<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Performance</title>
<style>
  html,body{margin:0;background:#26231A;color:#FFF3D1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #root{padding:14px 16px;}
  #ptabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0;}
  #ptabs button{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:0.06em;padding:7px 14px;border-radius:8px;cursor:pointer;background:rgba(110,103,68,0.18);color:rgba(217,196,138,0.95);border:1px solid rgba(110,103,68,0.55);}
  #ptabs button.on{background:rgba(168,216,180,0.14);color:#A8D8B4;border-color:rgba(168,216,180,0.65);}
  .tp-empty{color:rgba(217,196,138,0.75);font-size:11px;text-align:center;padding:26px 10px;letter-spacing:0.04em;}
</style>
</head><body>
<div id="ptabs"></div>
<div id="root"></div>
<div id="journal-wrap" style="display:none;padding:12px 16px 0"></div>
<script>
// ===== BLANK dataset — official data starts September; no practice data carried over =====
var BLANK_PERF = {equity:[],winrate:{total:0,wins:0,losses:0,be:0,net_pnl:0,expectancy:0,by_type:[]},edges:[],heatmap:[],revenge:[],streaks:[],current_streak:{},max_win_streak:0,max_loss_streak:0,r_dist:[],hold_time:[],monthly:[],rules:[]};
var PERF_FILTER = {'perf-combined':'ALL'};
function _getPerfData(){ return (window.PERF && window.PERF.winrate && window.PERF.winrate.total) ? window.PERF : BLANK_PERF; }
function _getMonths(){ return []; }

// ===== helpers =====
function perfSvg(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-height:200px;display:block">'; }
function perfNum(n){ return n>=0 ? '+$'+Math.abs(Math.round(n)).toLocaleString() : '-$'+Math.abs(Math.round(n)).toLocaleString(); }
function perfPct(n,d){ return d ? (100*n/d).toFixed(1)+'%' : '0%'; }
function perfLabel(t){ return '<div style="color:#F4C95D;font-size:9px;letter-spacing:0.15em;margin-bottom:3px">'+t+'</div>'; }

function _filterBar(widgetId){
  var cur=PERF_FILTER[widgetId]||'ALL';
  var presets=['1W','1M','3M','6M','YTD','ALL'];
  var html='<div style="display:flex;align-items:center;gap:3px;margin-bottom:6px;flex-wrap:wrap">';
  presets.forEach(function(p){
    var active=cur===p;
    var bg=active?'rgba(168,216,180,0.18)':'rgba(110,103,68,0.18)';
    var col=active?'#A8D8B4':'rgba(217,196,138,0.85)';
    var bdr=active?'1px solid rgba(168,216,180,0.60)':'1px solid rgba(110,103,68,0.26)';
    html+='<button onclick="perfSetFilter(\''+widgetId+'\',\''+p+'\')" style="background:'+bg+';color:'+col+';border:'+bdr+';border-radius:3px;padding:2px 6px;font-size:8px;font-family:ui-monospace,monospace;cursor:pointer;letter-spacing:0.05em">'+p+'</button>';
  });
  html+='</div>';
  return html;
}
function perfSetFilter(widgetId,value){ if(!value)return; PERF_FILTER[widgetId]=value; document.getElementById('root').innerHTML=renderCombinedWidget(); }

function _miniEquity(D){   // Nov 15: money tracker — P&L per day / week / month / quarter / year + running total
  var d=D.equity; if(!d||!d.length) return '';
  var EQ=(function(){try{var v=localStorage.getItem('tp:eq');return /^(day|week|month|quarter|year)$/.test(v)?v:'day';}catch(e){return 'day';}})();
  var MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var key=function(t){var ds=t.trade_date;if(EQ==='day')return ds;if(EQ==='week')return _wkKey(ds);if(EQ==='month')return ds.slice(0,7);if(EQ==='quarter')return ds.slice(0,4)+'-Q'+(Math.floor((+ds.slice(5,7)-1)/3)+1);return ds.slice(0,4);};
  var lab=function(k){if(EQ==='day')return MN[+k.slice(5,7)]+' '+(+k.slice(8));if(EQ==='week')return 'wk '+(+k.slice(5,7))+'/'+(+k.slice(8));if(EQ==='month')return MN[+k.slice(5)]+' '+k.slice(2,4);if(EQ==='quarter')return k.slice(5)+' '+k.slice(2,4);return k;};
  var P=[],by={};d.forEach(function(t){var k=key(t);if(!by[k]){by[k]={k:k,pnl:0,days:0};P.push(by[k]);}by[k].pnl+=t.day_pnl;by[k].days++;});
  var cum=0;P.forEach(function(p){cum+=p.pnl;p.cum=cum;});
  var n=P.length,W=1000,H=260,pl=10,pr=70,pt=26,pb=34,mx=0,cl=0,ch=0;P.forEach(function(p){mx=Math.max(mx,Math.abs(p.pnl));cl=Math.min(cl,p.cum);ch=Math.max(ch,p.cum);});mx=mx||1;
  var step=(W-pl-pr)/n,bw=Math.max(2,Math.min(70,step*.62)),zy=pt+(H-pt-pb)/2,half=(H-pt-pb)/2-4,X=function(i){return pl+step*(i+.5);};
  var cr=(ch-cl)||1,CY=function(v){return pt+(ch-v)/cr*(H-pt-pb);},g='';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+zy+'" y2="'+zy+'" stroke="rgba(255,243,209,0.35)"/>';
  var showLab=n<=24;
  P.forEach(function(p,i){var h=Math.abs(p.pnl)/mx*half,up=p.pnl>=0,y=up?zy-h:zy,col=up?'#A8D8B4':'#F0381F';
    g+='<g><title>'+lab(p.k)+': '+perfNum(p.pnl)+' · running total '+perfNum(p.cum)+(EQ==='day'?'':' · '+p.days+' trading days')+'</title><rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="1.5" fill="'+col+'" opacity=".9"/></g>';
    if(showLab)g+='<text x="'+X(i).toFixed(1)+'" y="'+(up?y-4:y+h+11).toFixed(1)+'" fill="'+col+'" font-size="'+(n>14?9:11)+'" text-anchor="middle">'+perfNum(p.pnl)+'</text>';
    if(showLab||i%Math.ceil(n/12)===0||i===n-1)g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-14)+'" fill="rgba(217,196,138,0.90)" font-size="10" text-anchor="middle">'+lab(p.k)+'</text>';});
  var path='';P.forEach(function(p,i){path+=(i?'L':'M')+X(i).toFixed(1)+' '+CY(p.cum).toFixed(1);});
  var last=P[n-1].cum,lc='#FF4FD8';
  g+='<path d="'+path+'" fill="none" stroke="'+lc+'" stroke-width="2"/><circle cx="'+X(n-1).toFixed(1)+'" cy="'+CY(last).toFixed(1)+'" r="4" fill="'+lc+'"/>';
  g+='<text x="'+(W-pr+8)+'" y="'+(CY(last)+4).toFixed(1)+'" fill="'+lc+'" font-size="12" font-weight="600">'+perfNum(last)+'</text>';
  g+='<text x="'+(W-pr+8)+'" y="'+(CY(ch)+4).toFixed(1)+'" fill="rgba(217,196,138,0.80)" font-size="9">'+(ch!==last?'high '+perfNum(ch):'')+'</text><text x="'+(W-pr+8)+'" y="'+(CY(cl)+4).toFixed(1)+'" fill="rgba(217,196,138,0.80)" font-size="9">'+(cl!==last&&cl<0?'low '+perfNum(cl):'')+'</text>';
  var tg=[['day','Day'],['week','Week'],['month','Month'],['quarter','Quarter'],['year','Year']].map(function(t){var on=t[0]===EQ;return '<button type="button" onclick="tpEq(\''+t[0]+'\')" style="font:600 10px ui-monospace,Menlo,monospace;padding:4px 10px;border-radius:6px;cursor:pointer;margin-right:4px;background:'+(on?'rgba(168,216,180,0.14)':'rgba(110,103,68,0.18)')+';color:'+(on?'#A8D8B4':'rgba(217,196,138,0.95)')+';border:1px solid '+(on?'rgba(168,216,180,0.65)':'rgba(110,103,68,0.55)')+'">'+t[1]+'</button>';}).join('');
  var up=P.filter(function(p){return p.pnl>0;}).length,best=P.slice().sort(function(a,b){return b.pnl-a.pnl;})[0],worst=P.slice().sort(function(a,b){return a.pnl-b.pnl;})[0];
  var unit={day:'days',week:'weeks',month:'months',quarter:'quarters',year:'years'}[EQ];
  return '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px"><div>'+perfLabel('MONEY · P&amp;L PER '+EQ.toUpperCase()+' + RUNNING TOTAL')+tg+'</div>'+
    '<div style="font-size:10px;color:rgba(217,196,138,1.00)">green '+unit+' <b style="color:#A8D8B4">'+up+'</b> of '+n+' · best <b style="color:#A8D8B4">'+perfNum(best.pnl)+'</b> ('+lab(best.k)+') · worst <b style="color:#F0381F">'+perfNum(worst.pnl)+'</b> ('+lab(worst.k)+') · total <b style="color:'+(last>=0?'#A8D8B4':'#F0381F')+'">'+perfNum(last)+'</b></div></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>'+
    '<div style="font-size:9px;color:rgba(217,196,138,0.80)">Bars = P&amp;L for each '+EQ+' (hover for details). Pink line = running total, adding every '+EQ+' up.</div>';
}
function tpEq(v){try{localStorage.setItem('tp:eq',v);}catch(e){}var y=window.scrollY;document.getElementById('root').innerHTML=renderCombinedWidget();window.scrollTo(0,y);}

function _payoffStats(D){
  var e=D.edges||[];
  var gw=0,gl=0,wins=0,losses=0;
  e.forEach(function(x){gw+=x.gross_win;gl+=x.gross_loss;wins+=x.wins;losses+=(x.n-x.wins);});
  var aw=wins?gw/wins:0, al=losses?Math.abs(gl)/losses:0;
  return {payoff: al?aw/al:0, pf: gl?gw/Math.abs(gl):0, avg_win:aw, avg_loss:al};
}
function _heroTile(label,big,bigCol,sub){
  var h='<div style="flex:1;text-align:center;background:rgba(110,103,68,0.11);border-radius:5px;padding:6px 2px">';
  h+='<div style="color:rgba(217,196,138,0.80);font-size:7px;letter-spacing:0.12em;margin-bottom:2px">'+label+'</div>';
  h+='<div style="font-size:22px;font-weight:700;color:'+bigCol+';line-height:1">'+big+'</div>';
  h+='<div style="font-size:7px;color:rgba(217,196,138,0.75);margin-top:2px">'+(sub||'')+'</div>';
  h+='</div>';
  return h;
}
function _combinedHero(D){
  var wr=D.winrate||{};
  var ps=_payoffStats(D);
  var rev=(D.revenge||[]).find(function(r){return r.category==='revenge';})||{n:0};
  var cur=D.current_streak||{};
  var isWin=cur.streak_type==='win';
  // win rate counts decisions (lots of one contract bought within 5 min = one decision), not individual lots
  var byDec=wr.decisions>0;
  var wrPct=byDec?(100*wr.decision_wins/wr.decisions).toFixed(1)+'%':(wr.total?(100*wr.wins/wr.total).toFixed(1)+'%':'—');
  var wrSub=byDec?(wr.decision_wins+'/'+wr.decisions+' decisions'):((wr.total||0)+' lots');
  var poCol=ps.payoff>=2?'#A8D8B4':(ps.payoff>=1?'rgba(255,243,209,0.95)':'#F0381F');
  var AL=D.alpha&&D.alpha.after_loss;
  var html='<div style="display:flex;gap:4px">';
  html+=_heroTile('WIN RATE',wrPct,'#A8D8B4',wrSub);
  html+=_heroTile('PAYOFF',ps.payoff?ps.payoff.toFixed(2)+'×':'—',poCol,'PF '+(ps.pf?ps.pf.toFixed(2):'—'));
  if(AL) html+=_heroTile('AFTER A LOSS',AL.retry.n+AL.revenge.n,'#F0381F',AL.retry.n+' re-try · '+AL.revenge.n+' revenge');
  else html+=_heroTile('REVENGE',rev.n||0,'#F0381F','trades');
  html+=_heroTile('STREAK',(cur.streak_len||0)+(isWin?'W':'L'),isWin?'#A8D8B4':'#F0381F','best '+(D.max_win_streak||0)+'W');
  html+='</div>';
  return html;
}
function _compactEdgesAll(D){
  var d=D.edges;if(!d||!d.length)return '';
  var maxAbs=0;d.forEach(function(e){if(Math.abs(e.pnl)>maxAbs)maxAbs=Math.abs(e.pnl);});
  var html='';
  d.forEach(function(e){
    var pct=maxAbs?Math.abs(e.pnl)/maxAbs*100:0;
    var col=e.pnl>=0?'#A8D8B4':'#F0381F';
    var bgCol=e.pnl>=0?'rgba(168,216,180,0.12)':'rgba(240,56,31,0.12)';
    html+='<div style="margin-bottom:2px">';
    html+='<div style="display:flex;justify-content:space-between;font-size:9px">';
    html+='<span style="color:rgba(255,243,209,0.95)">'+e.option_type+' · '+e.hold_bucket+' <span style="color:rgba(217,196,138,0.70)">('+e.n+')</span></span>';
    html+='<span style="color:'+col+';font-weight:600">'+perfNum(e.pnl)+'</span></div>';
    html+='<div style="height:3px;background:rgba(110,103,68,0.18);border-radius:2px;margin:1px 0">';
    html+='<div style="width:'+pct.toFixed(1)+'%;height:100%;background:'+bgCol+';border-radius:2px;'+(e.pnl<0?'margin-left:auto':'')+'"></div></div>';
    html+='</div>';
  });
  return html;
}
function _compactHoldTime(D){
  var d=D.hold_time;if(!d||!d.length)return '';
  var maxAbs=0;d.forEach(function(h){if(Math.abs(h.pnl)>maxAbs)maxAbs=Math.abs(h.pnl);});
  var html='';
  d.forEach(function(h){
    var pct=maxAbs?Math.abs(h.pnl)/maxAbs*100:0;
    var col=h.pnl>=0?'#A8D8B4':'#F0381F';
    var bgCol=h.pnl>=0?'rgba(168,216,180,0.18)':'rgba(240,56,31,0.13)';
    html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:9px">';
    html+='<span style="color:rgba(255,243,209,0.90);width:52px;flex-shrink:0">'+h.hold_bucket+'</span>';
    html+='<div style="flex:1;height:4px;background:rgba(110,103,68,0.13);border-radius:2px"><div style="width:'+pct.toFixed(1)+'%;height:100%;background:'+bgCol+';border-radius:2px;'+(h.pnl<0?'margin-left:auto':'')+'"></div></div>';
    html+='<span style="color:'+col+';font-weight:600;width:50px;text-align:right;flex-shrink:0">'+perfNum(h.pnl)+'</span>';
    html+='</div>';
  });
  return html;
}
function _compactRDist(D){
  var d=D.r_dist;if(!d||!d.length)return '';
  var maxN=0;d.forEach(function(b){if(b.n>maxN)maxN=b.n;});
  var W=240,H=70,pad={top:4,right:4,bottom:16,left:4};
  var pW=W-pad.left-pad.right,pH=H-pad.top-pad.bottom;
  var barW=pW/d.length-3;
  var svg=perfSvg(W,H);
  d.forEach(function(b,i){
    var bx=pad.left+i*(pW/d.length)+1.5;
    var bh=maxN?(b.n/maxN)*pH:0;
    var by=pad.top+pH-bh;
    var col=b.pnl>=0?'rgba(168,216,180,0.85)':'rgba(240,56,31,0.45)';
    svg+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0.5,bh).toFixed(1)+'" rx="1.5" fill="'+col+'"/>';
  });
  svg+='</svg>';
  return svg;
}
// (old _compactMonthly replaced Nov 15: labelled bars, see below)
function _compactRules(D){
  var d=D.rules;if(!d||!d.length)return '';
  var html='<div style="display:flex;gap:8px">';
  html+='<div style="flex:1"><div style="color:rgba(240,56,31,0.6);font-size:8px;letter-spacing:0.1em;margin-bottom:3px">STOP</div>';
  d.filter(function(r){return r.type==='stop';}).forEach(function(r){
    html+='<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(110,103,68,0.13);font-size:9px"><span style="color:rgba(255,243,209,0.85);flex:1">'+r.rule+'</span><span style="color:#F0381F;white-space:nowrap;margin-left:6px;font-weight:500">'+r.cost+'</span></div>';
  });
  html+='</div><div style="flex:1"><div style="color:rgba(168,216,180,0.90);font-size:8px;letter-spacing:0.1em;margin-bottom:3px">DO MORE</div>';
  d.filter(function(r){return r.type==='do';}).forEach(function(r){
    html+='<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(110,103,68,0.13);font-size:9px"><span style="color:rgba(255,243,209,0.85);flex:1">'+r.rule+'</span><span style="color:#A8D8B4;white-space:nowrap;margin-left:6px;font-weight:500">'+r.edge+'</span></div>';
  });
  html+='</div></div>';
  return html;
}
function _compactHeatmap(D){
  var d=D.heatmap;if(!d||!d.length)return '';
  var dows=['Mon','Tue','Wed','Thu','Fri'];
  var sessions=['pre','morning','midday','afternoon'];
  var sessLabels={'pre':'Pre','morning':'AM','midday':'Mid','afternoon':'PM'};
  var grid={};var maxAbs=0;
  d.forEach(function(h){grid[h.dow+'_'+h.session]=h;if(Math.abs(h.pnl)>maxAbs)maxAbs=Math.abs(h.pnl);});
  var cw=56,ch=28,gap=2,lw=30,th=12;
  var W=lw+dows.length*(cw+gap),H=th+sessions.length*(ch+gap);
  var svg=perfSvg(W,H);
  dows.forEach(function(dow,i){svg+='<text x="'+(lw+i*(cw+gap)+cw/2)+'" y="10" fill="rgba(217,196,138,0.80)" font-size="8" font-family="ui-monospace,monospace" text-anchor="middle">'+dow+'</text>';});
  sessions.forEach(function(sess,si){
    var cy=th+si*(ch+gap);
    svg+='<text x="1" y="'+(cy+ch/2+3)+'" fill="rgba(217,196,138,0.75)" font-size="7" font-family="ui-monospace,monospace">'+sessLabels[sess]+'</text>';
    dows.forEach(function(dow,di){
      var cx=lw+di*(cw+gap);var cell=grid[dow+'_'+sess];
      var pnl=cell?cell.pnl:0,n=cell?cell.n:0;
      var intensity=maxAbs?Math.min(1,Math.abs(pnl)/maxAbs):0;
      var fill=(!cell||n===0)?'rgba(110,103,68,0.11)':pnl>=0?'rgba(0,229,204,'+(0.04+intensity*0.35).toFixed(2)+')':'rgba(204,17,17,'+(0.04+intensity*0.35).toFixed(2)+')';
      svg+='<rect x="'+cx+'" y="'+cy+'" width="'+cw+'" height="'+ch+'" rx="2" fill="'+fill+'"/>';
      if(cell&&n>0){
        svg+='<text x="'+(cx+cw/2)+'" y="'+(cy+ch/2+1)+'" fill="rgba(255,243,209,0.90)" font-size="8" font-family="ui-monospace,monospace" text-anchor="middle" font-weight="600">'+perfNum(Math.round(pnl))+'</text>';
        svg+='<text x="'+(cx+cw/2)+'" y="'+(cy+ch/2+9)+'" fill="rgba(217,196,138,0.65)" font-size="6" font-family="ui-monospace,monospace" text-anchor="middle">'+n+'</text>';
      }
    });
  });
  svg+='</svg>';
  return svg;
}
function _pnlConcentration(D){
  var rd=D.r_dist;if(!rd||!rd.length)return '';
  var net=(D.winrate&&D.winrate.net_pnl)||0;
  var big=rd.filter(function(b){return b.pnl>0;}).sort(function(a,b){return b.pnl-a.pnl;})[0];
  if(!big)return '';
  var without=net-big.pnl;
  var html='<div style="background:rgba(168,216,180,0.04);border:1px solid rgba(168,216,180,0.12);border-radius:5px;padding:6px 8px;font-size:9px;line-height:1.4">';
  html+='<span style="color:rgba(217,196,138,0.95)">Edge lives in the fat tail — </span>';
  html+='<span style="color:#A8D8B4;font-weight:600">'+big.n+' trades ('+big.bucket+') = '+perfNum(big.pnl)+'</span>';
  html+='<span style="color:rgba(217,196,138,0.95)">. Strip them and net is </span>';
  html+='<span style="color:'+(without>=0?'#A8D8B4':'#F0381F')+';font-weight:600">'+perfNum(without)+'</span>';
  html+='</div>';
  return html;
}
function _pnlCalendar(D){
  var eq=D.equity; if(!eq||!eq.length) return '';
  var byd={}; eq.forEach(function(e){byd[e.trade_date]=e.day_pnl;});
  var months={}; eq.forEach(function(e){months[e.trade_date.slice(0,7)]=1;});
  var mlist=Object.keys(months).sort().reverse();
  var dows=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var html='';
  mlist.forEach(function(ym){
    var y=+ym.slice(0,4), m=+ym.slice(5,7);
    var startDow=new Date(y,m-1,1).getDay();
    var daysIn=new Date(y,m,0).getDate();
    var mtot=0; for(var dd=1;dd<=daysIn;dd++){var kk=ym+'-'+String(dd).padStart(2,'0'); if(byd[kk]!=null) mtot+=byd[kk];}
    html+='<div style="margin-bottom:10px">';
    html+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">';
    html+='<span style="color:rgba(217,196,138,0.95);font-size:10px;letter-spacing:0.08em">'+ym+'</span>';
    html+='<span style="font-size:11px;font-weight:600;color:'+(mtot>=0?'#A8D8B4':'#F0381F')+'">'+perfNum(mtot)+'</span></div>';
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
    dows.forEach(function(d){html+='<div style="text-align:center;font-size:7px;color:rgba(217,196,138,0.75);padding:1px 0">'+d+'</div>';});
    for(var i=0;i<startDow;i++) html+='<div></div>';
    for(var d=1;d<=daysIn;d++){

function _habits(){
  if(!HAB) return '';
  var f=PERF_FILTER['perf-combined']||'ALL',T=HAB.trades,Dy=HAB.days,cut='0000';
  if(f!=='ALL'&&T.length){var last=T.reduce(function(m,t){return t.d>m?t.d:m;},''),c=new Date(last+'T12:00:00Z');
    if(f==='YTD')c=new Date(last.slice(0,4)+'-01-01T00:00:00Z');else c.setUTCDate(c.getUTCDate()-({'1W':7,'1M':30,'3M':91,'6M':182}[f]||9999));cut=c.toISOString().slice(0,10);}
  T=T.filter(function(t){return t.d>=cut;});Dy=Dy.filter(function(d){return d.d>=cut;});
  var money=function(v){return (v<0?'−$':'+$')+Math.abs(Math.round(v)).toLocaleString();},col=function(v){return v>=0?SC.up:SC.dn;};
  var agg=function(L){var p=L.reduce(function(s,x){return s+x.pnl;},0);return {n:L.length,p:p,a:L.length?p/L.length:0};};
  var AVG={winner_030:function(t){return t.win;},winner_8min:function(t){return t.win;},small_loss:function(t){return t.loss;}};
  var rows={good:[],bad:[],alarm:[],unproven:[]};
  Object.keys(HAB.defs).forEach(function(k){var df=HAB.defs[k],day=df.scope==='day',src=day?Dy:T;
    var hit=src.filter(function(x){return x.tags.indexOf(k)>=0;}),A=agg(hit),txt;
    if(AVG[k]){var pool=T.filter(AVG[k]),rest=agg(pool.filter(function(x){return x.tags.indexOf(k)<0;}));
      txt='<b style="color:'+col(A.a)+'">'+money(A.a)+' avg</b> <span style="color:'+SC.mute+'">vs '+money(rest.a)+' avg for '+df.vs+'</span>';}
    else if(day) txt='<b style="color:'+col(A.p)+'">'+money(A.p)+'</b> <span style="color:'+SC.mute+'">· '+money(A.a)+'/day</span>';
    else txt='<b style="color:'+col(A.p)+'">'+money(A.p)+'</b>';
    rows[df.kind].push({lab:df.label,n:A.n,unit:day?'days':'trades',p:AVG[k]?A.a*1000:A.p,txt:txt});});
  rows.good.sort(function(a,b){return b.p-a.p;});rows.bad.sort(function(a,b){return a.p-b.p;});
  var li=function(r){return '<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid rgba(110,103,68,0.16);font-size:9.5px"><span style="color:'+SC.txt+'">'+r.lab+' <span style="color:'+SC.mute+'">('+r.n+' '+r.unit+')</span></span><span style="white-space:nowrap;text-align:right">'+(r.n?r.txt:'<span style="color:'+SC.mute+'">—</span>')+'</span></div>';};
  var h='<div style="display:flex;flex-wrap:wrap;gap:10px">';
  h+='<div style="flex:1;min-width:260px"><div style="color:'+SC.up+';font-size:9px;letter-spacing:.14em;margin-bottom:4px">GOOD HABITS · WHAT THEY MADE</div>'+rows.good.map(li).join('')+'</div>';
  h+='<div style="flex:1;min-width:260px"><div style="color:'+SC.dn+';font-size:9px;letter-spacing:.14em;margin-bottom:4px">BAD HABITS · WHAT THEY COST</div>'+rows.bad.map(li).join('')+
     rows.alarm.map(function(r){return '<div style="margin-top:6px;padding:5px 7px;border:1px solid rgba(240,56,31,0.45);border-radius:6px;font-size:9.5px"><span style="color:'+SC.dn+'">⚠ '+r.lab+'</span> <span style="color:'+SC.mute+'">('+r.n+' trades)</span> '+r.txt+'</div>';}).join('')+'</div>';
  if(rows.unproven.length) h+='</div><div style="margin-top:8px"><div style="color:'+SC.mute+';font-size:9px;letter-spacing:.14em;margin-bottom:4px">NOT PROVEN EITHER WAY · flipped between Sep–Oct and Nov (Nov 28 check)</div>'+rows.unproven.map(li).join('');
  h+='</div><div style="font-size:8.5px;color:'+SC.mute+';margin-top:5px">A trade can carry several habits. Day habits count the whole day. Updates every time a day is logged · through '+(HAB.updated||'')+'.</div>';
  return _sBox('HABITS · '+f, h);
}
function renderCombinedWidget(){
  if (PVIEW === 'trades' || PVIEW === 'journal') return '';
  var D=_getPerfData('perf-combined');
  var css='font-family:ui-monospace,monospace;font-size:10px;display:grid;gap:7px;grid-template-columns:1fr 1fr;';
  var html='<div style="'+css+'">';
  html+='<div style="grid-column:1/-1">'+_filterBar('perf-combined')+'</div>';
  if (PVIEW === 'perf') {
    var _po=(function(){try{return localStorage.getItem('tp:progOpen')!=='0';}catch(e){return true;}})();
    html+='<details style="grid-column:1/-1;padding:2px;border:1px solid rgba(110,103,68,0.44);border-radius:8px;padding:8px 10px"'+(_po?' open':'')+' ontoggle="try{localStorage.setItem(\'tp:progOpen\',this.open?\'1\':\'0\')}catch(e){}"><summary style="cursor:pointer;color:rgba(217,196,138,1.00);font-size:10px;letter-spacing:0.15em">AM I IMPROVING? · WINS · MONEY USED</summary><div style="margin-top:8px">'+_progress()+'</div></details>';
    html+='<div style="grid-column:1/-1">'+_combinedHero(D)+'</div>';
    // bot paper test panel removed Nov 15 (your page is your trades only; the bot lives on Trading Strategy + Trade Replay)
  }
  var hasData=(D.winrate&&D.winrate.total)||(D.equity&&D.equity.length);
  if(!hasData){
    html+='<div style="grid-column:1/-1" class="tp-empty">No trades yet — official data starts September.<br>This fills in once trade data is loaded.</div>';
    html+='</div>';return html;
  }
  if (PVIEW === 'perf') {
    html+='<div style="grid-column:1/-1">'+_miniEquity(D)+'</div>';
    html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('BUDGET · $150 PER 2 WEEKS')+_budget2w(D)+'</div>';
    html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('P&L CALENDAR')+_pnlCalendar(D)+'</div>';
    html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('MONTHLY')+_compactMonthly(D)+'</div>';
  } else {
    // Nov 16: visual stats + new angles; the old list views stay in a fold at the bottom
    html+='<div style="grid-column:1/-1;padding:2px">'+_habits()+'</div>';   // Nov 27: what my habits made / cost
    html+='<div style="grid-column:1/-1;padding:2px">'+_statsDeep(D)+'</div>';
    html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('R DISTRIBUTION')+_compactRDist(D)+'</div>';
    html+='<div style="grid-column:1/-1">'+_pnlConcentration(D)+'</div>';
    html+='<div style="grid-column:1/-1;padding:2px">'+_compactRules(D)+'</div>';
    html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('SESSION HEATMAP')+_compactHeatmap(D)+'</div>';
    html+='<details style="grid-column:1/-1;padding:2px"><summary style="cursor:pointer;color:rgba(217,196,138,0.90);font-size:9px;letter-spacing:0.15em">CLASSIC VIEW · strike zone, after a loss, timing, edges &amp; leaks, hold time lists</summary><div style="margin-top:8px">'+
      (D.alpha?perfLabel('STRIKE ZONE')+_strikeZone(D)+perfLabel('AFTER A LOSS')+_afterLoss(D)+perfLabel('TIMING')+_timing(D):'')+perfLabel('EDGES & LEAKS')+_compactEdgesAll(D)+perfLabel('HOLD TIME')+_compactHoldTime(D)+'</div></details>';
  }
  html+='</div>';
  return html;
}
function tpView(v){
  PVIEW = v; try { localStorage.setItem('tp:view', v); } catch (e) {}
  var T = [['perf', 'Performance'], ['stats', 'Stats'], ['trades', 'My trades'], ['journal', 'Journal']];
  document.getElementById('ptabs').innerHTML = T.map(function (t) { return '<button type="button" class="' + (t[0] === v ? 'on' : '') + '" onclick="tpView(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('');
  var root = document.getElementById('root'), mt = document.getElementById('my-trades'), jw = document.getElementById('journal-wrap');
  root.style.display = (v === 'perf' || v === 'stats') ? '' : 'none';
  if (mt) mt.style.display = v === 'trades' ? '' : 'none';
  jw.style.display = v === 'journal' ? '' : 'none';
  if (v === 'journal' && !jw.firstChild) jw.innerHTML = '<iframe src="notebook.html?v=20261120b" title="Trading Journal" style="width:100%;height:calc(100vh - 70px);border:1px solid rgba(110,103,68,0.55);border-radius:10px;display:block;background:#332E20"></iframe>';
  if (v === 'perf' || v === 'stats') root.innerHTML = renderCombinedWidget();
  window.scrollTo(0, 0);
}
(function(){var s=document.createElement('script');s.src='trading_performance_data.js?t='+Date.now();s.onload=s.onerror=function(){tpView(PVIEW);};document.head.appendChild(s);})();
</script>
