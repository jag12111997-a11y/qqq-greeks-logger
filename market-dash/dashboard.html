  function destroyQqqChart() {
    if (!QQQ_TV) return;
    try { if (QQQ_TV.resize) QQQ_TV.resize.disconnect(); } catch (err) {}
    try {
      if (QQQ_TV.el && QQQ_TV.interactionHandler) {
        ["pointermove", "wheel", "dblclick", "touchmove"].forEach(function (name) {
          QQQ_TV.el.removeEventListener(name, QQQ_TV.interactionHandler);
        });
      }
    } catch (interactionErr) {}
    try {
      if (QQQ_TV.rangeHandler && QQQ_TV.chart && QQQ_TV.chart.timeScale) {
        QQQ_TV.chart.timeScale().unsubscribeVisibleLogicalRangeChange(QQQ_TV.rangeHandler);
      }
    } catch (errRange) {}
    try { if (QQQ_TV.chart) QQQ_TV.chart.remove(); } catch (err2) {}
    QQQ_TV = null;
  }

  // Use Lightweight Charts' own price-to-pixel conversion so every GEX strike
  // lands on the same horizontal row as that price in the adjacent QQQ chart.
  // The SVG's built-in strike scale remains as a graceful fallback if the
  // library is unavailable or the cards stack on a narrow screen.
  function alignQqqGexProfile(series, chart) {
    var chartEl = document.getElementById("qqq-tv-chart");
    var profile = document.getElementById("qqq-gex-profile");
    if (!chartEl || !profile || !series || !series.priceToCoordinate) return;
    var plot = profile.querySelector ? profile.querySelector(".qqq-gex-plot") : null;
    var spacer = profile.querySelector ? profile.querySelector(".qqq-gex-align-spacer") : null;
    var svg = plot && plot.querySelector ? plot.querySelector("svg") : null;
    if (!plot || !spacer || !svg || !(chartEl.clientHeight > 0)) return;

    // On desktop the plotting rectangles begin on exactly the same row. When
    // the responsive layout stacks, collapse the spacer but keep the same scale.
    // A real block spacer avoids adjacent-margin collapsing and stays exact
    // after the profile is folded and reopened.
    var currentSpacer = parseFloat(spacer.style.height || "0") || 0;
    plot.style.height = chartEl.clientHeight + "px";
    var chartRect = chartEl.getBoundingClientRect();
    var plotRect = plot.getBoundingClientRect();
    var svgRect = svg.getBoundingClientRect();
    var stacked = window.innerWidth <= 1020 || plotRect.left <= chartRect.left + 20;
    var baseSvgTop = svgRect.top - currentSpacer;
    spacer.style.height = (stacked ? 0 : Math.max(0, Math.round(chartRect.top - baseSvgTop))) + "px";

    var viewH = Number(profile.getAttribute("data-view-height")) || 470;
    var svgHeight = svg.getBoundingClientRect().height || chartEl.clientHeight;
    var pxToView = viewH / svgHeight;
    var panePxH = chartEl.clientHeight;
    try {
      if (chart && chart.timeScale && chart.timeScale().height) {
        panePxH -= chart.timeScale().height();
      }
    } catch (paneErr) {}
    var paneViewH = Math.max(0, panePxH) * pxToView;
    var kMin = Number(profile.getAttribute("data-kmin"));
    var kMax = Number(profile.getAttribute("data-kmax"));
    function priceY(price) {
      var c = series.priceToCoordinate(Number(price));
      return c === null || !isFinite(c) ? null : c * pxToView;
    }
    function inWindow(price) {
      return !isFinite(kMin) || !isFinite(kMax) || (price >= kMin && price <= kMax);
    }

    var bars = profile.querySelectorAll("[data-gex-strike]");
    for (var i = 0; i < bars.length; i++) {
      var strike = Number(bars[i].getAttribute("data-gex-strike"));
      var y = priceY(strike), h = Number(bars[i].getAttribute("height")) || 1;
      var visible = y !== null && y + h / 2 >= 0 && y - h / 2 <= paneViewH;
      bars[i].style.display = visible ? "" : "none";
      if (visible) bars[i].setAttribute("y", (y - h / 2).toFixed(1));
    }

    var markers = profile.querySelectorAll("[data-gex-marker-price]");
    for (var j = 0; j < markers.length; j++) {
      var price = Number(markers[j].getAttribute("data-gex-marker-price"));
      var my = priceY(price), show = inWindow(price) && my !== null && my >= 0 && my <= paneViewH;
      markers[j].style.display = show ? "" : "none";
      if (!show) continue;
      if (String(markers[j].tagName).toLowerCase() === "line") {
        markers[j].setAttribute("y1", my.toFixed(1));
        markers[j].setAttribute("y2", my.toFixed(1));
      } else {
        markers[j].setAttribute("cy", my.toFixed(1));
      }
    }

    var labels = profile.querySelectorAll("[data-gex-axis-price]");
    for (var k = 0; k < labels.length; k++) {
      var ly = priceY(Number(labels[k].getAttribute("data-gex-axis-price")));
      var labelVisible = ly !== null && ly >= 8 && ly <= paneViewH - 8;
      labels[k].style.display = labelVisible ? "" : "none";
      if (labelVisible) labels[k].setAttribute("y", (ly + 3).toFixed(1));
    }
  }

  function scheduleQqqGexAlignment(series, chart) {
    if (QQQ_TV && QQQ_TV.series === series && QQQ_TV.alignPending) return;
    if (QQQ_TV && QQQ_TV.series === series) QQQ_TV.alignPending = true;
    window.requestAnimationFrame(function () {
      if (QQQ_TV && QQQ_TV.series === series) {
        QQQ_TV.alignPending = false;
        alignQqqGexProfile(series, chart);
      }
    });
  }

  function mountQqqChart(e, chartModel) {
    destroyQqqChart();
    var el = document.getElementById("qqq-tv-chart");
    var TV = window.LightweightCharts;
    if (!el) return;
    if (!TV || !TV.createChart) {
      el.innerHTML = '<div style="padding:54px 16px;text-align:center;color:var(--faint)">' +
        "Chart library unavailable. QQQ and GEX cards below are unchanged.</div>";
      return;
    }

    var chart = TV.createChart(el, {
      width: Math.max(el.clientWidth, 280),
      height: el.clientHeight || 430,
      layout: {
        background: { type: TV.ColorType.Solid, color: "#0c0c14" },
        textColor: "#8b8ba6",
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
        attributionLogo: false
      },
      grid: {
        vertLines: { color: "#15151f" },
        horzLines: { color: "#15151f" }
      },
      crosshair: {
        mode: TV.CrosshairMode.Normal,
        vertLine: { color: "#55556b", labelBackgroundColor: "#1e1e2a" },
        horzLine: { color: "#55556b", labelBackgroundColor: "#1e1e2a" }
      },
      rightPriceScale: { borderColor: "#1e1e2a", minimumWidth: 74 },
      timeScale: {
        borderColor: "#1e1e2a",
        timeVisible: true,
        secondsVisible: false,
        rightOffset: 4,
        barSpacing: 7,
        fixLeftEdge: false
      },
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true },
      // Both chart axes stay draggable. The adjacent GEX profile is realigned
      // on every scale/scroll gesture instead of disabling price-axis control.
      handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
      localization: { locale: "en-US", priceFormatter: function (p) { return "$" + p.toFixed(2); } }
    });

    var M = chartModel || qqqChartModel(e);
    var raw = M.latest && LIVE_AUCTION && Array.isArray(LIVE_AUCTION.candles)
      ? LIVE_AUCTION.candles : [];
    var seen = {}, candles = raw.map(function (b) {
      return {
        time: Number(b.time), open: Number(b.open), high: Number(b.high),
        low: Number(b.low), close: Number(b.close)
      };
    }).filter(function (b) {
      var good = isFinite(b.time) && isFinite(b.open) && isFinite(b.high) &&
        isFinite(b.low) && isFinite(b.close) && !seen[b.time];
      if (good) seen[b.time] = 1;
      return good;
    }).sort(function (a, b) { return a.time - b.time; });

    // Heikin Ashi transform — HA close = avg(O,H,L,C); HA open = mean of the
    // previous HA open/close (first bar seeds from its own O/C). Same price
    // scale as raw candles, so every GEX / range / dealer level still lines up.
    var haCandles = (function (src) {
      var out = [], pO = null, pC = null;
      for (var i = 0; i < src.length; i++) {
        var b = src[i];
        var haC = (b.open + b.high + b.low + b.close) / 4;
        var haO = pO === null ? (b.open + b.close) / 2 : (pO + pC) / 2;
        out.push({ time: b.time, open: haO,
          high: Math.max(b.high, haO, haC), low: Math.min(b.low, haO, haC), close: haC });
        pO = haO; pC = haC;
      }
      return out;
    })(candles);

    var series;
    if (candles.length) {
      series = chart.addSeries(TV.CandlestickSeries, {
        upColor: "#00e676", downColor: "#ff453a",
        borderUpColor: "#00e676", borderDownColor: "#ff453a",
        wickUpColor: "#69f0ae", wickDownColor: "#ff7961",
        priceLineVisible: false, lastValueVisible: true
      });
      series.setData(haCandles);
    } else {
      var cut = H.indexOf(e);
      var hist = cut >= 0 ? H.slice(0, cut + 1) : H.slice();
      var daily = {};
      hist.forEach(function (entry) {
        var q = null;
        (entry.watchlist || []).forEach(function (w) { if (w.symbol === "QQQ") q = w; });
        if (q && has(q.last) && entry.entry_date) {
          // AM and PM snapshots can share a date. Keep the later real QQQ
          // value so Lightweight Charts receives one strictly ordered point
          // per session date.
          daily[String(entry.entry_date).slice(0, 10)] = Number(q.last);
        }
      });
      var points = Object.keys(daily).sort().map(function (day) {
        return { time: day, value: daily[day] };
      });
      series = chart.addSeries(TV.LineSeries, {
        color: "#ff2be0", lineWidth: 2, priceLineVisible: false,
        lastValueVisible: true, crosshairMarkerRadius: 4
      });
      series.setData(points);
    }

    // Candles come from the 5-minute logger commits. Extend their right edge
    // to the browser's fresher QQQ quote so the chart and the live page price
    // always agree without pretending the quote is a full OHLC candle.
    var quoteSeries = null, lastCandleTime = null;
    if (candles.length && M.quoteLive && M.quoteTime !== null) {
      var tail = haCandles[haCandles.length - 1];
      var quoteBarTime = Math.floor(M.quoteTime / 60000) * 60;
      lastCandleTime = tail.time;
      quoteSeries = chart.addSeries(TV.LineSeries, {
        color: "#ff2be0", lineWidth: 2, lineStyle: TV.LineStyle.Dotted,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: true, crosshairMarkerRadius: 5
      });
      quoteSeries.setData(quoteBarTime > tail.time
        ? [{ time: tail.time, value: tail.close }, { time: quoteBarTime, value: M.spot }]
        : [{ time: tail.time, value: M.spot }]);
    }

    var styleMap = { solid: TV.LineStyle.Solid, dashed: TV.LineStyle.Dashed,
                     dotted: TV.LineStyle.Dotted };
    function level(item) {
      return series.createPriceLine({
        price: item.price, color: item.color, lineWidth: item.width || 1,
        lineStyle: styleMap[item.style] || TV.LineStyle.Solid,
        axisLabelVisible: true, title: item.title
      });
    }
    // Same-price signals are combined into one labelled line. This is common
    // when the call wall, put wall and OI magnet all sit on one strike.
    var active = M.levels.filter(function (x) {
      return x.group === "spot" || QQQ_LAYERS[x.group];
    }).sort(function (a, b) { return a.priority - b.priority; });
    // Merge signals on the same strike into one line. When they share the same
    // touch-odds % (true whenever they sit on one price), show that % once at the
    // end instead of repeating it after every label ("Call wall · Put wall · OI
    // magnet · 87%" rather than "Call wall 87% · Put wall 87% · OI magnet 87%").
    var merged = {}, pctRe = /\s(?:·\s)?(\d+%)$/;
    active.forEach(function (x) {
      var key = x.price.toFixed(4);
      if (!merged[key]) { merged[key] = x; return; }
      var tgt = merged[key];
      var mT = pctRe.exec(tgt.title), mX = pctRe.exec(x.title);
      var pct = (mX && mX[1]) || (mT && mT[1]) || null;
      var baseT = mT ? tgt.title.slice(0, mT.index) : tgt.title;
      var baseX = mX ? x.title.slice(0, mX.index) : x.title;
      if (baseT.split(" · ").indexOf(baseX) < 0) baseT += " · " + baseX;
      tgt.title = baseT + (pct ? " · " + pct : "");
    });
    var spotLine = null;
    Object.keys(merged).forEach(function (k) {
      var made = level(merged[k]);
      if (merged[k].group === "spot") spotLine = made;
    });

    chart.timeScale().fitContent();
    var ro = window.ResizeObserver ? new ResizeObserver(function () {
      if (el.clientWidth > 0) {
        chart.applyOptions({ width: el.clientWidth, height: el.clientHeight || 430 });
        scheduleQqqGexAlignment(series, chart);
      }
    }) : null;
    if (ro) {
      ro.observe(el);
      var profilePlot = document.querySelector(".qqq-gex-plot");
      if (profilePlot) ro.observe(profilePlot);
    }
    var rangeHandler = function () {
      scheduleQqqGexAlignment(series, chart);
    };
    try { chart.timeScale().subscribeVisibleLogicalRangeChange(rangeHandler); } catch (rangeErr) {}
    var interactionHandler = function (ev) {
      if (ev.type !== "pointermove" || ev.buttons) scheduleQqqGexAlignment(series, chart);
    };
    ["pointermove", "wheel", "dblclick", "touchmove"].forEach(function (name) {
      el.addEventListener(name, interactionHandler, { passive:true });
    });
    QQQ_TV = { chart: chart, resize: ro, quoteSeries: quoteSeries,
               series: series, rangeHandler: rangeHandler,
               spotLine: spotLine, lastCandleTime: lastCandleTime,
               quoteTime: M.quoteTime === null ? null : Math.floor(M.quoteTime / 60000) * 60,
               el: el, interactionHandler: interactionHandler, alignPending:false };
    scheduleQqqGexAlignment(series, chart);
  }

  function updateMountedQqqQuote(e) {
    if (idx !== FULL.length - 1) return;
    var M = qqqChartModel(e);
    if (!M.quoteLive || M.quoteTime === null) return;
    var quoteBarTime = Math.floor(M.quoteTime / 60000) * 60;
    if (QQQ_TV) {
      try {
        if (QQQ_TV.quoteSeries && quoteBarTime >= (QQQ_TV.quoteTime || 0)) {
          QQQ_TV.quoteSeries.update({ time: quoteBarTime, value: M.spot });
          QQQ_TV.quoteTime = quoteBarTime;
        }
        if (QQQ_TV.spotLine) QQQ_TV.spotLine.applyOptions({ price: M.spot, title: M.quoteFresh ? "LIVE QQQ" : "QQQ" });
      } catch (err) {}
    }
    var sourceEl = document.getElementById("qqq-live-source");
    var chipEl = document.getElementById("qqq-live-chip");
    var bars = LIVE_AUCTION && Array.isArray(LIVE_AUCTION.candles) ? LIVE_AUCTION.candles.length : 0;
    if (sourceEl) sourceEl.textContent = qqqChartSource(M, bars);
    if (chipEl) chipEl.textContent = (M.quoteFresh ? "QQQ LIVE $" : "QQQ LAST $") + M.spot.toFixed(2);

    // The command center follows the same fast quote without remounting the
    // chart or rebuilding the cockpit.
    var command = document.getElementById("qqq-command-live");
    var commandPrice = document.getElementById("qqq-command-price");
    var commandMove = document.getElementById("qqq-command-move");
    var commandRange = document.getElementById("qqq-command-range-used");
    var commandRangeBar = document.getElementById("qqq-command-range-bar");
    if (commandPrice) commandPrice.textContent = M.spot.toFixed(2);
    if (command) {
      var prev = Number(command.getAttribute("data-prev-close"));
      var cvix = Number(command.getAttribute("data-vix"));
      if (commandMove && isFinite(prev)) {
        var move = M.spot - prev;
        commandMove.textContent = (move >= 0 ? "+$" : "−$") + Math.abs(move).toFixed(2) + " · ";
      }
      if (isFinite(prev) && prev > 0 && isFinite(cvix) && cvix > 0) {
        var livePct = Math.abs((M.spot / prev - 1) * 100);
        var liveUsed = livePct / (cvix / Math.sqrt(252));
        var liveCol = liveUsed < .5 ? "#00e676" : liveUsed < 1 ? "#ffd600" : "#ff453a";
        if (commandRange) {
          commandRange.textContent = Math.round(liveUsed * 100) + "%";
          commandRange.style.color = liveCol;
        }
        if (commandRangeBar) {
          commandRangeBar.style.width = Math.min(100, liveUsed * 100).toFixed(0) + "%";
          commandRangeBar.style.background = liveCol;
        }
      }
    }

    // The profile's cyan spot row follows the same 15-second browser quote as
    // the chart; the gamma bars themselves only change with a real logger file.
    var profile = document.getElementById("qqq-gex-profile");
    var spotLine = document.getElementById("qqq-gex-spot-line");
    var spotDot = document.getElementById("qqq-gex-spot-dot");
    var spotValue = document.getElementById("qqq-gex-spot-value");
    var windowNote = document.getElementById("qqq-gex-window-note");
    if (profile && spotLine && spotDot) {
      var kMin = Number(profile.getAttribute("data-kmin"));
      var kMax = Number(profile.getAttribute("data-kmax"));
      var padTop = Number(profile.getAttribute("data-pad-top"));
      var plotHeight = Number(profile.getAttribute("data-plot-height"));
      if (isFinite(kMin) && isFinite(kMax) && kMax > kMin && isFinite(plotHeight)) {
        var outside = M.spot < kMin || M.spot > kMax;
        spotLine.style.display = outside ? "none" : "";
        spotDot.style.display = outside ? "none" : "";
        spotLine.setAttribute("data-gex-marker-price", M.spot);
        spotDot.setAttribute("data-gex-marker-price", M.spot);
        if (!outside) {
          var y = padTop + (kMax - M.spot) / (kMax - kMin) * plotHeight;
          spotLine.setAttribute("y1", y.toFixed(1)); spotLine.setAttribute("y2", y.toFixed(1));
          spotDot.setAttribute("cy", y.toFixed(1));
        }
        if (windowNote) windowNote.textContent = outside
          ? "Live QQQ is outside the captured strike window; the spot marker is hidden until the logger refreshes."
          : "";
      }
    }
    if (spotValue) spotValue.textContent = M.spot.toFixed(2);
    if (profile && profile.querySelectorAll) {
      var levelNodes = profile.querySelectorAll("[data-gex-level-price]");
      for (var i = 0; i < levelNodes.length; i++) {
        var levelPrice = Number(levelNodes[i].getAttribute("data-gex-level-price"));
        if (!isFinite(levelPrice) || !(M.spot > 0)) continue;
        levelNodes[i].innerHTML = num(levelPrice, 2) +
          ' <span style="color:var(--faint);font-size:9px">' +
          signed((levelPrice - M.spot) / M.spot * 100, 2, "%") + "</span>";
      }
    }
    if (QQQ_TV && QQQ_TV.series) {
      scheduleQqqGexAlignment(QQQ_TV.series, QQQ_TV.chart);
    }
  }

  function secGexLive(e) {
    // Only on the latest session (it's a live, right-now read), only if we have data.
    if (!LIVE_GEX || idx !== FULL.length - 1 || !has(LIVE_GEX.net_gex)) return "";
    var g = LIVE_GEX, L = g.levels || {}, flip = g.gamma_flip;
    var pos = g.regime === "POSITIVE GAMMA";
    var body =
      row("As of", esc(g.generated_utc || "—") + " UTC") +
      (has(g.spot) ? row("Spot (logger)", num(g.spot, 2)) : "") +
      row("Regime", '<span style="color:' + (pos ? "var(--up)" : "var(--down)") + '">' +
          esc(g.regime || "—") + "</span>") +
      row("Net GEX", fmtBig(g.net_gex)) +
      (has(flip) ? row("Gamma flip", num(flip, 2) +
          (has(g.distance_to_flip_pct) ? '  <span class=k>' +
           signed(g.distance_to_flip_pct, 2, "%") + " from spot</span>" : "")) : "") +
      (has(L.call_wall) ? row("Call wall", num(L.call_wall, 0)) : "") +
      (has(L.put_wall) ? row("Put wall", num(L.put_wall, 0)) : "") +
      (has(g.gamma_ratio) ? row("Gamma ratio (G)", num(g.gamma_ratio, 3)) : "") +
      (has(g.net_vannaex)
        ? row("Net vanna / charm", fmtBig(g.net_vannaex) + " / " + fmtBig(g.net_charmex))
        : row("Net vega / theta", fmtBig(g.net_vex) + " / " + fmtBig(g.net_tex)));

    var lines = [];
    lines.push(verdict(pos ? "var(--up)" : "var(--down)", pos
      ? "<b>Live &mdash; positive gamma.</b> Net GEX " + fmtBig(g.net_gex) +
        (has(g.distance_to_flip_pct) ? ", spot " + signed(g.distance_to_flip_pct, 2, "%") + " from the " + num(g.gamma_flip, 0) + " flip" : "") +
        ". Dealers are damping intraday &mdash; the fade-friendly, mean-reverting state, refreshed every 5 minutes as a real-time check on the twice-daily map above."
      : "<b>Live &mdash; negative gamma.</b> Net GEX " + fmtBig(g.net_gex) +
        ". Dealers are amplifying moves right now, so reversion is unreliable &mdash; stand fades down or wait for a clean flush before leaning on the mean."));
    lines.push("<div style='margin:5px 0'>Live GEX straight from your <b>5-min greeks logger</b> " +
      "(calls + puts), independent of the twice-daily API pull. If the API GEX card above is " +
      "missing or stale, this is your backup read of the same machine.</div>");
    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>" +
      esc(g.source || "logger") + ". OI is end-of-day; intraday moves come from spot + greeks. " +
      "Refreshes while the logger is running (mornings & midday PT).</div>");
    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>Read this map as " +
      "<b>where the crowd's open interest &mdash; hence attention and reflexive reaction &mdash; is stacked</b>, " +
      "more than proof dealers are <i>forced</i> to defend a level: Cboe's desk measured the net 0DTE hedging " +
      "load at ~0.2% of daily liquidity (de minimis). Walls still tend to hold and break the way the map " +
      "suggests, but the mechanism is often crowd-reflexivity rather than forced hedging.</div>");

    return sec("GEX — LIVE · 0DTE · ±$15 strikes · 5-min logger", body,
      '<details class="read" open><summary><b>Read</b></summary><div>' +
      lines.join("") + "</div></details>");
  }

  // The "answer" line that leads each card's Read: colored dot + plain-English
  // verdict + a short confidence/context tag. Turns a number into a decision.
  function verdict(color, html) {
    return "<div style='margin:0 0 10px;padding:8px 12px;border-left:3px solid " + color +
      ";background:rgba(255,255,255,.035);border-radius:5px;line-height:1.55'>" +
      "<span style='color:" + color + ";vertical-align:1px'>&#9679;</span> " + html + "</div>";
  }

  // In-page tab bar. The former cockpit tab is now part of Nasdaq itself.
  function tabBar() {
    function tab(id, label) {
      var on = TAB === id;
      return '<span data-tab="' + id + '" role="button" style="cursor:pointer;' +
        'padding:8px 18px;margin-right:6px;border:1px solid var(--line);border-bottom:none;' +
        'border-radius:9px 9px 0 0;font:600 13px ui-monospace,Menlo,monospace;' +
        'color:' + (on ? "var(--accent)" : "var(--dim)") + ';' +
        'background:' + (on ? "rgba(255,255,255,.06)" : "transparent") + '">' +
        esc(label) + "</span>";
    }
    return '<div style="display:flex;align-items:flex-end;' +
      'border-bottom:1px solid var(--line);margin:8px 0 16px">' +
      tab("dash", "Market Dash") + tab("nasdaq", "Nasdaq") + "</div>";
  }

  // ── TRADING COCKPIT ─────────────────────────────────────────────────────
  // A KDS-style glance board: every signal becomes a colour-coded ticket you
  // read in half a second (green = fade-friendly, amber = caution, red =
  // fade-hostile, grey = stale/off). Same real data the detailed cards use —
  // nothing new is invented here, it's the same numbers, just plated to glance.
  function cockpitVR(e) {                 // VR(2) for the fade-regime ticket
    var series = starSeries("pct_change").QQQ || [];
    var cut = H.indexOf(e);
    var upto = (cut >= 0) ? series.slice(0, cut + 1) : series;
    var r = upto.filter(function (v) { return typeof v === "number" && isFinite(v); })
                .map(function (v) { return Math.log(1 + v / 100); });
    var n = r.length;
    if (n < 12) return null;
    var mu = r.reduce(function (s, v) { return s + v; }, 0) / n;
    function varK(k) {
      var m = n - k + 1, acc = 0;
      for (var i = 0; i < m; i++) {
        var s = 0; for (var j = 0; j < k; j++) s += r[i + j];
        acc += (s - k * mu) * (s - k * mu);
      }
      return acc / m;
    }
    var v1 = varK(1);
    if (v1 <= 0) return null;
    return varK(2) / (2 * v1);
  }

  function secCockpit(e, chartModel) {
    var S = nasdaqCommandModel(e, chartModel);
    function tile(label, big, sub, cn) {
      var map = {
        up:   ["var(--up)",   "rgba(0,230,118,.13)"],
        down: ["var(--down)", "rgba(255,69,58,.13)"],
        warn: ["var(--warn)", "rgba(255,214,0,.12)"],
        dim:  ["var(--dim)",  "rgba(139,139,166,.10)"],
        flat: ["var(--txt)",  "rgba(255,255,255,.045)"]   // neutral context tile
      };
      var c = map[cn] || map.dim;
      var subCol = cn === "flat" ? "var(--dim)" : c[0];
      // Compact chip (Q5): tiny label + value + sub, wraps in a chip row like the status lights.
      return '<div style="background:' + c[1] + ';border:1px solid rgba(255,255,255,.06);border-radius:9px;' +
        'padding:6px 10px;flex:0 1 auto;min-width:96px;max-width:220px;min-height:0">' +
        '<div style="font-size:8.5px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;' +
        'white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(label) + "</div>" +
        '<div style="font-size:15px;font-weight:700;line-height:1.15;color:' + c[0] + ';margin-top:1px">' + big + "</div>" +
        '<div style="font-size:9.5px;color:' + subCol + ';opacity:.9;margin-top:1px;line-height:1.3">' + sub + "</div>" +
        "</div>";
    }

    // Compact pairwise-correlation table for any symbol set (glance version of
    // the Market Dash correlation card). Same Pearson math, no dollar-move bars.
    function corrPanel(symbols, title) {
      var nH = H.length;
      var ser = {};
      symbols.forEach(function (s) { ser[s] = []; });
      H.forEach(function (entry) {
        var by = {};
        (entry.watchlist || []).forEach(function (w) { by[w.symbol] = w; });
        symbols.forEach(function (s) { var w = by[s]; ser[s].push(w && has(w.pct_change) ? w.pct_change : null); });
      });
      var pairs = [];
      for (var a = 0; a < symbols.length; a++) {
        for (var b = a + 1; b < symbols.length; b++) {
          var xs = [], ys = [];
          for (var i = 0; i < nH; i++) {
            if (ser[symbols[a]][i] !== null && ser[symbols[b]][i] !== null) {
              xs.push(ser[symbols[a]][i]); ys.push(ser[symbols[b]][i]);
            }
          }
          if (xs.length < 5) continue;
          var mx = xs.reduce(function (p, c2) { return p + c2; }, 0) / xs.length;
          var my = ys.reduce(function (p, c2) { return p + c2; }, 0) / ys.length;
          var sxy = 0, sxx = 0, syy = 0;
          for (var k = 0; k < xs.length; k++) {
            var dx = xs[k] - mx, dy = ys[k] - my;
            sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
          }
          if (!sxx || !syy) continue;
          pairs.push({ a: symbols[a], b: symbols[b], r: sxy / Math.sqrt(sxx * syy), n: xs.length });
        }
      }
      if (!pairs.length) {
        return '<div style="font-size:11px;color:var(--faint);margin:2px 0 10px">' + esc(title) +
          " &mdash; needs ~5 shared sessions per pair; filling in as the logger runs.</div>";
      }
      pairs.sort(function (p1, p2) { return Math.abs(p2.r) - Math.abs(p1.r); });
      var out = '<div style="font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:6px">' + esc(title) + "</div>" +
        "<table><tr><th>Pair</th><th style='text-align:right'>Correlation</th>" +
        "<th style='text-align:right'>Sessions</th></tr>";
      pairs.slice(0, 10).forEach(function (p) {
        var col = p.r > 0.5 ? "var(--up)" : p.r < -0.5 ? "var(--down)" : "var(--dim)";
        out += "<tr><td>" + p.a + " / " + p.b + "</td>" +
          '<td class="num" style="color:' + col + '">' + p.r.toFixed(2) + "</td>" +
          '<td class="num" style="color:var(--faint)">' + p.n + "</td></tr>";
      });
      return out + '</table><div style="height:12px"></div>';
    }

    var tiles = "";

    var g = S.geometry;
    if (ok(g) && has(g.diversification_volume)) {
      var vol = g.diversification_volume;
      tiles += tile("Regime √det(G)", num(vol, 3),
        vol < 0.15 ? "collapsed · stand down" : vol < 0.35 ? "thin · trade small" : "healthy · fades ok",
        vol < 0.15 ? "down" : vol < 0.35 ? "warn" : "up");
    }

    var vr2 = S.vr2;
    if (vr2 !== null) {
      tiles += tile("Fade regime VR(2)", num(vr2, 2),
        vr2 < 0.9 ? "mean-revert · fade" : vr2 > 1.1 ? "trending · hostile" : "random · no edge",
        vr2 < 0.9 ? "up" : vr2 > 1.1 ? "down" : "dim");
    }

    // The merged cockpit must agree with the live chart/profile on the newest
    // session, while historical selections keep their saved GEX map.
    var gx = S.g;
    if (ok(gx) && has(gx.regime)) {
      var pos = gx.regime === "POSITIVE GAMMA";
      tiles += tile("Gamma regime", pos ? "+γ" : "−γ",
        (pos ? "dampen · fade ok" : "amplify · hostile") +
        (has(gx.gamma_flip) ? " · flip " + num(gx.gamma_flip, 0) : ""),
        pos ? "up" : "down");
    }

    var ri = S.realized;
    if (ok(ri) && has(ri.spread_pct)) {
      var sp = ri.spread_pct;
      tiles += tile("Realized − implied", signed(sp, 1, "pp"),
        sp > 0 ? "your edge · long γ paid" : "seller's tape",
        sp > 0 ? "up" : "down");
    }

    var mk = S.mk;
    var vix = S.vix, q = S.q;
    if (has(vix) && q && has(q.last) && has(q.pct_change)) {
      var exp = vix / Math.sqrt(252) / 100;
      var used = exp > 0 ? Math.abs(q.pct_change) / (exp * 100) : 0;
      tiles += tile("Range used", (used * 100).toFixed(0) + "%",
        used < 0.5 ? "room left" : used < 1 ? "half spent" : "blown 1σ",
        used < 0.5 ? "up" : used < 1 ? "warn" : "down");
    }

    // Rich detail line from a GEX snapshot: net · flip(+dist) · walls · spot.
    function gexDetail(G) {
      var L = G.levels || {};
      var bits = [];
      if (has(G.net_gex)) bits.push("net " + fmtBig(G.net_gex));
      if (has(G.gamma_flip)) bits.push("flip " + num(G.gamma_flip, 0) +
        (has(G.distance_to_flip_pct) ? " " + signed(G.distance_to_flip_pct, 2, "%") : ""));
      var walls = [];
      if (has(L.call_wall)) walls.push(num(L.call_wall, 0));
      if (has(L.put_wall)) walls.push(num(L.put_wall, 0));
      var line2 = [];
      if (walls.length) line2.push("walls " + walls.join(" / "));
      if (has(G.spot)) line2.push("spot " + num(G.spot, 2));
      return bits.join(" · ") + (line2.length ? "<br>" + line2.join(" · ") : "");
    }
    if (LIVE_GEX && has(LIVE_GEX.net_gex)) {
      var ts = Date.parse(String(LIVE_GEX.generated_utc || "").replace(" ", "T") + "Z");
      var ageMin = isFinite(ts) ? (Date.now() - ts) / 60000 : 1e9;
      var lpos = LIVE_GEX.regime === "POSITIVE GAMMA";
      if (ageMin > 30) {
        // Logger off (after hours) — still show the last REAL reading, greyed,
        // with its age and detail — never a dead "STALE".
        var ageTxt = !isFinite(ts) ? "no stamp"
          : ageMin >= 120 ? Math.round(ageMin / 60) + "h ago"
          : Math.round(ageMin) + "m ago";
        tiles += tile("Live GEX", lpos ? "+γ" : "−γ",
          "0DTE ±$15 · last logged " + ageTxt + "<br>" + gexDetail(LIVE_GEX), "dim");
      } else {
        tiles += tile("Live GEX", lpos ? "+γ" : "−γ",
          "0DTE ±$15 · " + (lpos ? "dampen" : "amplify") + " · live<br>" + gexDetail(LIVE_GEX),
          lpos ? "up" : "down");
      }
    } else if (ok(gx) && has(gx.regime)) {
      // No live snapshot — fall back to the twice-daily API GEX (≤30d ±10%, different engine).
      var fpos = gx.regime === "POSITIVE GAMMA";
      tiles += tile("Live GEX", fpos ? "+γ" : "−γ",
        "≤30d ±10% · last close<br>" + gexDetail(gx), "dim");
    }

    if (!tiles) tiles = '<div style="color:var(--faint);font-size:13px;padding:20px">No live signals for this session yet.</div>';

    var stamp = '<div style="display:flex;justify-content:space-between;align-items:baseline;' +
      'font-size:12px;color:var(--dim);margin:2px 0 10px">' +
      '<span style="letter-spacing:2px">𝜎u𝜎 — NASDAQ COCKPIT</span>' +
      '<span>' + (q && has(q.last) ? "QQQ " + num(q.last, 2) + "  ·  " : "") + "entry window 7:17 PT</span></div>";

    // ── THE CALL — synthesis read (a LEAN, not a command; signal not validated) ──
    var hostile = [], friendly = [];
    if (ok(g) && has(g.diversification_volume)) {
      if (g.diversification_volume < 0.15) hostile.push("regime collapsed");
      else if (g.diversification_volume >= 0.35) friendly.push("regime healthy");
    }
    if (ok(gx) && has(gx.regime)) {
      if (gx.regime === "POSITIVE GAMMA") friendly.push("positive gamma");
      else hostile.push("negative gamma");
    }
    if (vr2 !== null) {
      if (vr2 > 1.1) hostile.push("trending");
      else if (vr2 < 0.9) friendly.push("mean-reverting");
    }
    var banner;
    if (!hostile.length && !friendly.length) {
      banner = '<div style="border:1px dashed var(--line);border-radius:12px;padding:18px;' +
        'margin-bottom:12px;text-align:center;color:var(--faint);font-size:12px;letter-spacing:2.5px">' +
        "THE CALL &mdash; waiting on signals</div>";
    } else {
      var lean, ccol;
      if (hostile.length >= 2) { lean = "Stand down"; ccol = "var(--down)"; }
      else if (friendly.length >= 2 && hostile.length === 0) { lean = "Lean fade"; ccol = "var(--up)"; }
      else { lean = "Mixed"; ccol = "var(--warn)"; }
      var drivers = (hostile.length ? hostile : friendly).slice(0, 3).join(" + ");
      var caveat = "";
      if (ok(ri) && has(ri.spread_pct)) {
        caveat = ri.spread_pct > 0
          ? "realized > implied — your long gamma is paid"
          : "implied ≥ realized — theta works against you";
      }
      banner = '<div style="border-left:4px solid ' + ccol + ';background:rgba(255,255,255,.05);' +
        'border-radius:12px;padding:15px 20px;margin-bottom:12px">' +
        '<div style="font-size:10.5px;letter-spacing:2px;color:var(--dim);text-transform:uppercase">The call</div>' +
        '<div style="font-size:22px;font-weight:700;color:' + ccol + ';margin-top:2px;line-height:1.15">' +
        '<span style="vertical-align:1px">&#9679;</span> ' + lean + "</div>" +
        '<div style="font-size:13px;color:var(--dim);margin-top:5px">' + drivers +
        (caveat ? '. <span style="color:var(--faint)">' + caveat + "</span>" : "") +
        '</div><div style="font-size:10.5px;color:var(--faint);margin-top:3px;letter-spacing:1px">' +
        "a lean, not a command &mdash; signal still validating</div></div>";
    }

    var grid = '<div style="margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
      'text-transform:uppercase;margin-bottom:6px">Signals</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">' +
      tiles + "</div>";

    var legend = '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--dim)">' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--up);vertical-align:-1px"></span> fade-friendly</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--warn);vertical-align:-1px"></span> caution</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--down);vertical-align:-1px"></span> fade-hostile</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--dim);vertical-align:-1px"></span> stale/off</span></div>';

    // ── Auction (IEX) — VWAP · ADL · Opening range · Volume ──
    // Live from the 60s logger's QQQ 1-min IEX bars (auction_live.json). IEX is a
    // tape SUBSET, so tiles note IEX — not the exact consolidated tape. Imagery-
    // first: on the latest session the box ALWAYS renders — greyed "waiting"
    // shells until the session's first logger run writes real data, which then
    // drops into place. The placeholder shows "—", never a fake value.
    var auctBlk = "";
    if (idx === FULL.length - 1) {
      var A = LIVE_AUCTION;
      var haveA = A && (has(A.vwap) || has(A.ad_z) || has(A.or30_high) || has(A.vol_pace));
      var at = "", aStale = false, aAgeTxt = "";
      if (haveA) {
        var ats = Date.parse(String(A.generated_utc || "").replace(" ", "T") + "Z");
        var aAge = isFinite(ats) ? (Date.now() - ats) / 60000 : 1e9;
        aStale = aAge > 30;
        aAgeTxt = !isFinite(ats) ? "no stamp"
          : aAge >= 120 ? Math.round(aAge / 60) + "h ago"
          : Math.round(aAge) + "m ago";
        var aTag = aStale ? " · " + aAgeTxt : "";
        at += tile("VWAP", has(A.vwap) ? num(A.vwap, 2) : "—",
          (has(A.vwap_dist_pct) ? signed(A.vwap_dist_pct, 2, "%") + " from spot" : "session mean") + " · IEX" + aTag,
          "flat");
        at += tile("ADL", has(A.ad_z) ? "z " + signed(A.ad_z, 2) : "—",
          (has(A.ad_z) ? (A.ad_z > 0 ? "accum · gate open" : "distrib · gate shut") : "gate") + " · IEX" + aTag,
          (aStale || !has(A.ad_z)) ? "dim" : (A.ad_z > 0 ? "up" : "down"));
        at += tile("Opening range", (has(A.or30_high) && A.spot_vs_or) ? String(A.spot_vs_or).toUpperCase() : "OR30",
          (has(A.or30_high) && has(A.or30_low) ? "OR30 " + num(A.or30_low, 2) + "–" + num(A.or30_high, 2) : "—") +
          " · IEX" + aTag, "flat");
        at += tile("Volume", has(A.vol_pace) ? num(A.vol_pace, 2) + "×" : "—",
          "pace vs session avg · IEX" + aTag,
          (aStale || !has(A.vol_pace)) ? "dim" : (A.vol_pace >= 1.3 ? "warn" : A.vol_pace <= 0.7 ? "dim" : "flat"));
      } else {
        // placeholder shells — layout on screen now, real numbers slot in next run
        var wait = "waiting for this session";
        at = tile("VWAP", "—", wait + " · IEX", "dim") +
             tile("ADL", "—", "gate · " + wait, "dim") +
             tile("Opening range", "—", "OR30 · " + wait, "dim") +
             tile("Volume", "—", wait + " · IEX", "dim");

      auctBlk = '<div style="margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:6px">Auction — IEX' +
        (aStale ? ' <span style="color:var(--faint);letter-spacing:0">· last logged ' + aAgeTxt + '</span>' : '') +
        '</div><div style="display:flex;flex-wrap:wrap;gap:8px">' +
        at + "</div>";
    }

    // ── Context tiles (neutral): the quant card, condensed to a glance ──
    var ctiles = "";
    var g2 = get(e, "quant.garch");
    if (ok(g2) && has(g2.regime) && has(g2.conditional_vol_pct)) {
      ctiles += tile("Vol regime (GARCH)", num(g2.conditional_vol_pct, 1, "%"),
        String(g2.regime).toLowerCase() +
        (has(g2.unconditional_vol_pct) ? " · uncond " + num(g2.unconditional_vol_pct, 1, "%") : ""),
        /HIGH/i.test(g2.regime) ? "warn" : "flat");
    }
    if (S.chart.sigLeft !== null && isFinite(S.chart.spot)) {
      ctiles += tile("Expected move", "±" + (S.chart.sigLeft * 100).toFixed(2) + "%",
        "$" + (S.chart.spot * S.chart.sigLeft).toFixed(2) + " · into close", "flat");
    }
    var o2 = e.options;
    if (ok(o2) && has(o2.total_pc)) {
      var t = o2.total_pc;
      var lean = t >= 1.15 ? "put-heavy" : t >= 0.95 ? "balanced" : t >= 0.75 ? "call-lean" : "very call-heavy";
      var ieTxt = (has(o2.index_pc) && has(o2.equity_pc))
        ? " · " + signed(o2.index_pc - o2.equity_pc, 2) + " idx−eq" : "";
      ctiles += tile("P/C skew", num(t, 2), lean + ieTxt, "flat");
    }
    // VIX — the fear gauge (amber when elevated)
    var vxr = mk.VIX;
    if (vxr && has(vxr.last)) {
      ctiles += tile("VIX (fear gauge)", num(vxr.last, 2),
        (has(vxr.pct_change) ? signed(vxr.pct_change, 2, "%") + " today" : "level"),
        vxr.last >= 20 ? "warn" : "flat");
    }
    // Vanna / charm — the REAL 2nd-order dealer dials (dDelta/dsigma, dDelta/dt).
    // Uses net_vannaex/net_charmex; hidden on older snapshots that lack them.
    if (ok(gx) && has(gx.net_vannaex)) {
      ctiles += tile("Vanna / charm", fmtBig(gx.net_vannaex),
        "charm " + (has(gx.net_charmex) ? fmtBig(gx.net_charmex) : na()) + " · 2nd-order", "flat");
    }
    // Touch odds — chance price tags the gamma flip today
    if (ok(gx) && has(gx.gamma_flip) && isFinite(S.chart.spot) && S.chart.spot > 0) {
      var kf = gx.gamma_flip;
      var pTouch = S.chart.touch(kf);
      if (pTouch !== null) {
        ctiles += tile("Touch odds — flip", (pTouch * 100).toFixed(0) + "%",
          "flip " + num(kf, 0) + " · " + signed((kf - S.chart.spot) / S.chart.spot * 100, 2, "%"), "flat");
      }
    }
    // Venue concentration — Cboe share (fills in after the fetcher's next run)
    var vc = e.venue_concentration;
    if (ok(vc) && vc.volume_share && vc.volume_share.length) {
      var cbV = vc.volume_share.filter(function (r) { return /cboe/i.test(r.venue); })[0];
      var cbP = (vc.premium_share || []).filter(function (r) { return /cboe/i.test(r.venue); })[0];
      if (cbV && has(cbV.today)) {
        ctiles += tile("Venue — Cboe", num(cbV.today, 1, "%"),
          "vol share" + (cbP && has(cbP.today) ? " · prem " + num(cbP.today, 1, "%") : ""), "flat");
      }
    }
    var ctxBlk = ctiles
      ? '<div style="margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:6px">Context</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        ctiles + "</div>"
      : "";

    // ── Mini sectors donut ──
    var sec2 = get(e, "sectors");
    var sectorsBlk = (ok(sec2) && get(sec2, "rows", []).length)
      ? '<div style="margin-top:18px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:2px">Sectors</div>' + donut(sec2.rows, true)
      : "";

    // ── Leverage — QQQ + the 3× twins' bull/bear imbalance ──
    // QQQ shows its own z / $ move. TQQQ (3× long) and SQQQ (3× short) are
    // COMBINED into one "lean" square: TQQQ z is bull-signed (+ = QQQ up), SQQQ z
    // is bear-signed (+ = QQQ down), so the average bullish stretch = (TQQQ.z −
    // SQQQ.z)/2 → >0 callish, <0 bearish, ~0 balanced. NDX and VIX z removed
    // (VIX is covered by its own tile / eve's separate fix).
    var levTiles = "";
    var _q = mk.QQQ;
    if (_q && has(_q.last) && has(_q.z20)) {
      var qMove = has(_q.pct_change) ? _q.last - _q.last / (1 + _q.pct_change / 100) : null;
      var qMoveTxt = qMove === null ? "" : (qMove >= 0 ? "+$" : "−$") + Math.abs(qMove).toFixed(2) + " · ";
      var qcn = Math.abs(_q.z20) >= 2 ? (_q.z20 > 0 ? "up" : "down") : "dim";
      levTiles += tile("QQQ", "z " + signed(_q.z20, 2), qMoveTxt + num(_q.last, 2), qcn);
    }
    var _tq = mk.TQQQ, _sq = mk.SQQQ;
    if (_tq && has(_tq.z20) && _sq && has(_sq.z20)) {
      var lean = (_tq.z20 - _sq.z20) / 2;
      var leanWord = lean >= 0.5 ? "callish" : lean <= -0.5 ? "bearish" : "balanced";
      // Neutral square so bull/bear colour never clashes with the fade legend
      // (green=fade-friendly). The signed value + accent word carry direction.
      levTiles += '<div style="background:rgba(255,255,255,.045);border-radius:12px;padding:14px 16px;min-height:98px">' +
        '<div style="font-size:11px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase">TQQQ / SQQQ lean</div>' +
        '<div style="font-size:30px;font-weight:700;line-height:1.15;color:var(--txt);margin-top:4px">' + signed(lean, 2) + "</div>" +
        '<div style="font-size:12.5px;margin-top:3px;color:var(--dim);opacity:.9">' +
        '<span style="color:var(--accent)">' + leanWord + "</span> · TQQQ " + signed(_tq.z20, 2) +
        " / SQQQ " + signed(_sq.z20, 2) + "</div></div>";
    }
    var levBlk = levTiles
      ? '<div style="margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:6px">Leverage — QQQ &amp; 3× lean</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">' +
        levTiles + "</div>"
      : "";

    // ── Plan & discipline — the box, condensed ──
    var planBlk = '<div style="margin-top:16px;background:rgba(255,255,255,.04);border-radius:12px;' +
      'padding:12px 16px;font-size:12.5px;color:var(--dim);line-height:1.7">' +
      '<span style="letter-spacing:1px;text-transform:uppercase;font-size:10.5px">The box</span><br>' +
      '<span style="color:var(--txt)">7:17–8:30 PT</span> · QQQ 0DTE call 3 ITM · size 60% · ' +
      'stop <span style="color:var(--down)">−$0.30</span> · target <span style="color:var(--up)">+$0.82</span> · ' +
      '15-min time-stop · flat 12:45 PT</div>';

    // ── Next catalyst — condensed to ONE glance box (cockpit tile aesthetic),
    //    a quick daily read: the soonest event, its real forecasts, a plain-
    //    English takeaway, and a short "then:" strip of what follows. ──
    var catAll = get(e, "calendar.us_high_impact", []);
    var newsBlk = "";
    if (catAll && catAll.length) {
      var todayD = String(e.entry_date || "").slice(0, 10);
      var upC = catAll.filter(function (ev) { return String(ev.date || "").slice(0, 10) >= todayD; })
                      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
      if (!upC.length) upC = catAll.slice();
      var nx = upC[0];
      var nxDay = String(nx.date || "").slice(0, 10);
      var sameDay = upC.filter(function (ev) { return String(ev.date || "").slice(0, 10) === nxDay; });
      var isToday = nxDay === todayD;
      var whenTxt = (isToday ? "TODAY" : fmtDate(nxDay).replace(/<[^>]*>/g, "")) + " · " + fmtTime(nx.date);
      // family headline — drop the m/m · y/y suffixes so the glance is one phrase
      function famName(t) {
        return String(t || "").replace(/\s*[—-]\s.*$/, "")
          .replace(/\b(m\/m|y\/y|q\/q)\b/ig, " ").replace(/\s+/g, " ").trim() || "event";
      }
      var head = famName(nx.title);
      // real forecasts only (golden rule: never invent a number)
      var prints = sameDay.filter(function (ev) { return has(ev.forecast); }).map(function (ev) {
        return esc(ev.title) + " fc " + esc(ev.forecast) +
          (has(ev.previous) ? " / prev " + esc(ev.previous) : "");
      });
      var why = whyFor(nx.title);
      var later = upC.filter(function (ev) { return String(ev.date || "").slice(0, 10) !== nxDay; })
        .filter(function (ev, i, a) {            // one row per family name
          return a.findIndex(function (x) { return famName(x.title) === famName(ev.title) &&
            String(x.date).slice(0, 10) === String(ev.date).slice(0, 10); }) === i;
        }).slice(0, 3);
      var accent = isToday ? "var(--warn)" : "var(--txt)";
      var bg = isToday ? "rgba(255,214,0,.12)" : "rgba(255,255,255,.045)";
      newsBlk =
        '<div style="margin-top:18px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:6px">Next catalyst</div>' +
        '<div style="background:' + bg + ';border-radius:12px;padding:14px 16px">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">' +
            '<div style="font-size:22px;font-weight:700;line-height:1.15;color:' + accent + '">' + esc(head) + '</div>' +
            '<div style="font-size:11px;letter-spacing:1px;white-space:nowrap;color:' +
              (isToday ? "var(--warn)" : "var(--dim)") + '">' + whenTxt + '</div>' +
          '</div>' +
          (prints.length ? '<div style="font-size:12px;color:var(--dim);margin-top:7px;line-height:1.5">' +
            prints.join("  ·  ") + '</div>' : "") +
          (why ? '<div style="font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.5">' + esc(why) + '</div>' : "") +
          (later.length ? '<div style="font-size:10.5px;color:var(--faint);margin-top:8px;padding-top:8px;' +
            'border-top:1px solid var(--line)">then · ' + later.map(function (ev) {
              return esc(famName(ev.title)) + " " + fmtDate(String(ev.date).slice(0, 10)).replace(/<[^>]*>/g, "");
            }).join("  ·  ") + '</div>' : "") +
        '</div>';
    }

    // (The STRETCH z20 wheel used to live here — moved to the Market Dash tab.)

    // The shared command summary already owns The Call, leverage, range and
    // regime lights. Keep only cockpit-exclusive detail here so the combined
    // dashboard never repeats or contradicts itself.
    var _tf = get(e, "time_footprint");
    var tfBlk = secOptHeatmap(_tf) || secTimeFootprint(_tf);   // heatmap when grid data exists, else classic bars
    return sectorsBlk + planBlk + auctBlk + ctxBlk + newsBlk + tfBlk;
  }

  function secNasdaqCommandCenter(e, chartModel) {

  function render() {

    var opts = FULL.map(function (x, i) {

    var _qqqModel = qqqChartModel(e);

    // MARKET DASH tab — the broad-market context (cross-asset, sectors, macro).

    var _stretchWheel = moveWheel(e.watchlist || []);
    var _dashBody =

      (_stretchWheel ? group("Watchlist stretch", secWide("Stretch — |z20|", _stretchWheel)) : "") +
      group("Price", secStars(e)) +
      group("News", secWeek(e)) +
      group("Sectors and regime", secInternals(e)) +
      group("Macro and positioning", secMacro(e) + secPositioning(e)) +

      "<footer>" + FULL.length + " logged session" + (FULL.length > 1 ? "s" : "") +
      " · " + (H.length - FULL.length) + " backfilled" +
      " logged · append-only · history.js</footer>";

    app.innerHTML = _header + tabBar() +
      (TAB === "nasdaq" ? ('<div class="flow">' + _qqqBody + "</div>") : _dashBody);

    document.getElementById("pick").addEventListener("change", function () {
      idx = parseInt(this.value, 10);
      render();
    });

    applyCollapseState();   // restore whatever you had folded last visit
    if (TAB === "nasdaq") {
      window.requestAnimationFrame(function () { mountQqqChart(e, _qqqModel); });
    }

  render();

  // Overlay-chart controls: mode toggle, expand, and click-to-hide a line.
  // Delegated on document so it survives every re-render.
  document.addEventListener("click", function (ev) {
    var t = (ev.target && ev.target.closest)
      ? ev.target.closest("[data-chart-mode],[data-chart-expand],[data-chart-taller],[data-chart-shorter],[data-series]") : null;
    if (!t) return;
    if (t.hasAttribute("data-chart-mode")) {
      CHART.mode = (CHART.mode === "dxy") ? "rebase" : "dxy";
      try { localStorage.setItem("md:chartmode", CHART.mode); } catch (e2) {}
    } else if (t.hasAttribute("data-chart-expand")) {
      CHART.big = !CHART.big;
    } else if (t.hasAttribute("data-chart-taller")) {
      CHART.height = Math.min(CHART.height + 80, 900);
      try { localStorage.setItem("md:charth", CHART.height); } catch (e3) {}
    } else if (t.hasAttribute("data-chart-shorter")) {
      CHART.height = Math.max(CHART.height - 80, 160);
      try { localStorage.setItem("md:charth", CHART.height); } catch (e4) {}
    } else {
      var s = t.getAttribute("data-series");
      if (CHART.hidden[s]) delete CHART.hidden[s]; else CHART.hidden[s] = true;
    }
    var y = window.scrollY;
    render();
    if (!CHART.big) window.scrollTo(0, y);
  });

  // Tab switching (Market Dash / Nasdaq), delegated so it survives re-renders.
  document.addEventListener("click", function (ev) {
    var t = (ev.target && ev.target.closest) ? ev.target.closest("[data-tab]") : null;
    if (!t) return;
    var id = t.getAttribute("data-tab");
    if (id && id !== TAB) {
      TAB = id;
      try { localStorage.setItem("md:tab", id); } catch (e5) {}
      window.scrollTo(0, 0);
      render();
    }
  });

  // QQQ chart overlay toggles. The choice survives refreshes and rerenders.
  document.addEventListener("click", function (ev) {
    var t = (ev.target && ev.target.closest) ? ev.target.closest("[data-qqq-layer]") : null;
    if (!t) return;
    var layer = t.getAttribute("data-qqq-layer");
    if (!Object.prototype.hasOwnProperty.call(QQQ_LAYERS, layer)) return;
    QQQ_LAYERS[layer] = !QQQ_LAYERS[layer];
    try { localStorage.setItem("md:qqq-layers", JSON.stringify(QQQ_LAYERS)); } catch (eLayers) {}
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  });

  // ---------- LIVE PRICES (client-side, browser-only) ----------
  // The twice-daily GitHub run writes a FROZEN snapshot of prices. This layer
  // makes prices live everywhere they show — Star Players, the rest of the
  // watchlist, and the sector donut: every time the page is open it pulls
  // real-time quotes from Finnhub (a browser-friendly free quote API) and
  // refreshes on a timer. PURELY ADDITIVE: if a fetch fails (offline, key over
  // quota, source down) the snapshot values stay exactly as they were. It never
  // blanks and never shows NaN.
  function startLivePrices() {
    // ---- TWEAK ZONE ----
    // Free Finnhub API key. Read-only stock/ETF quotes, rate-limited (60/min).
    // It is PUBLIC in this file by design (client-side runs in your browser). If
    // it ever gets abused, regenerate a new one free at finnhub.io and paste it
    // here in place of this one.
    var FINNHUB_KEY = "d9l0n6hr01qoc1b3pu0gd9l0n6hr01qoc1b3pu10";
    // --------------------
    var BASE = "https://finnhub.io/api/v1/quote?symbol=";
    var LIVE = {};              // symbol -> {last, pct, srcTime(ms)}
    var everOk = false;

    // Every symbol the latest session shows: the watchlist rows (stars + the
    // rest) AND the sector-ETF tickers behind the donut. Index products like
    // DXY and VIX are not on Finnhub's free tier — they come back empty and stay
    // on the snapshot, no harm done.
    function wantedSymbols() {
      var set = {};
      if (FULL.length) {
        var latest = FULL[FULL.length - 1];
        (latest.watchlist || []).forEach(function (r) {
          if (r && r.symbol) set[r.symbol] = 1;
        });
        ((latest.sectors && latest.sectors.rows) || []).forEach(function (r) {
          if (r && r.ticker) set[r.ticker] = 1;
        });
      }
      return Object.keys(set);
    }

    function fetchOne(sym) {
      return fetch(BASE + sym + "&token=" + FINNHUB_KEY, { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (q) {
          // Finnhub quote: c=current, d=$ change, dp=% change, t=unix seconds.
          // c is 0 for an unknown symbol or before the first print — skip those.
          if (!q || typeof q.c !== "number" || q.c <= 0) return;
          LIVE[sym] = {
            last: q.c,
            pct:  (typeof q.dp === "number") ? q.dp : null,
            srcTime: (typeof q.t === "number" && q.t > 0) ? q.t * 1000 : null
          };
        })
        .catch(function () { /* offline / blocked / bad symbol -> keep snapshot */ });
    }

    // VIX isn't on Finnhub's free tier — pull it live (~15-min delayed) from
    // Cboe's public delayed-quote CDN so the VIX tile AND everything keyed off it
    // (range used, expected move, touch odds) refresh every minute. Fails silently
    // if the CDN blocks cross-origin, in which case VIX just keeps the snapshot.
    function fetchVix() {
      return fetch("https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json?t=" + Date.now(),
                   { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var d = j && j.data;
          if (!d || typeof d.current_price !== "number" || d.current_price <= 0) return;
          LIVE["VIX"] = {
            last: d.current_price,
            pct: (typeof d.price_change_percent === "number") ? d.price_change_percent : null,
            srcTime: Date.parse(String(d.last_trade_time || "")) || Date.now()
          };
        })
        .catch(function () { /* CORS / offline -> keep the snapshot VIX */ });
    }

    function fetchAll() {
      return Promise.all([fetchVix()].concat(wantedSymbols().map(fetchOne)));
    }

    // Paint live values onto the LATEST session's watchlist rows only. Older
    // sessions picked from the dropdown keep their true historical snapshot.
    function applyLive() {
      if (!FULL.length) return { painted: 0, newest: 0 };
      var latest = FULL[FULL.length - 1];
      var painted = 0, newest = 0;
      function note(q) {
        var t = (typeof q.srcTime === "number") ? q.srcTime : NaN;
        if (!isNaN(t) && t > newest) newest = t;
      }
      // Star players + rest of watchlist (matched by symbol).
      (Array.isArray(latest.watchlist) ? latest.watchlist : []).forEach(function (r) {
        var q = LIVE[r.symbol];
        if (!q) return;
        r.last = q.last;
        if (q.pct !== null) r.pct_change = q.pct;
        r._live_quote = true;
        r._live_src_time = q.srcTime || Date.now();
        painted++; note(q);
      });
      // Sector donut (matched by ETF ticker). Only the % move shows there.
      ((latest.sectors && latest.sectors.rows) || []).forEach(function (r) {
        var q = LIVE[r.ticker];
        if (!q || q.pct === null) return;
        r.pct_change = q.pct;
        if (typeof q.last === "number") r.last = q.last;
        painted++; note(q);
      });
      if (painted) everOk = true;
      return { painted: painted, newest: newest };
    }

    function badge(html, color) {
      var b = document.getElementById("livebadge");
      if (!b) {
        b = document.createElement("div");
        b.id = "livebadge";
        b.style.cssText = "position:fixed;right:12px;bottom:12px;z-index:9999;" +
          "font:11px ui-monospace,Menlo,monospace;padding:5px 9px;border-radius:14px;" +
          "background:rgba(0,0,0,.72);border:1px solid var(--line);color:var(--dim);" +
          "-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:none";
        document.body.appendChild(b);
      }
      b.innerHTML = html;
      b.style.borderColor = color || "var(--line)";
    }

    function stamp(info) {
      if (!everOk) {
        badge('<span style="color:var(--faint)">&#9679;</span> live prices unavailable — showing last snapshot', "var(--line)");
        return;
      }
      var t = new Date().toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", second:"2-digit" });
      // The quote carries its own trade time — if that is old, say so honestly.
      var stale = "";
      if (info && info.newest && (Date.now() - info.newest) / 3.6e6 > 12) {
        stale = ' <span style="color:var(--warn)">(source may be delayed)</span>';
      }
      badge('<span style="color:var(--up)">&#9679;</span> live &middot; ' + t + stale, "var(--up)");
    }

    function cycle() {
      loadLiveGex();
      loadAuction();
      fetchAll().then(function () {
        var info = applyLive();
        // Repaint without losing scroll or which session you are viewing.
        if (info.painted && idx === FULL.length - 1) {
          var y = window.scrollY; render(); window.scrollTo(0, y);
        }
        stamp(info);
      });
    }

    // QQQ gets a faster lightweight quote-only refresh for the chart. This is
    // four requests per minute and stays comfortably inside the free feed's
    // limit; the heavier all-symbol dashboard refresh remains once per minute.
    function cycleQqq() {
      if (document.hidden) return;
      fetchOne("QQQ").then(function () {
        var info = applyLive();
        if (idx === FULL.length - 1) updateMountedQqqQuote(FULL[FULL.length - 1]);
        stamp(info);
      });
    }

    cycle();                     // paint as soon as the page opens
    setInterval(cycle, 60000);   // keep it fresh every 60s while the page is open
    setInterval(cycleQqq, 15000); // keep the QQQ chart quote aligned with the live price
  }
  startLivePrices();
})();
</script>
</body>
