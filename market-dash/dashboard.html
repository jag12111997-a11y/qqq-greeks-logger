      bits.push("equities down, TLT up — money rotating into duration, not just leaving");
    }

    var extra = [];
    try {
      var mv2 = all.filter(function (r) {
        return has(r.pct_change) && Math.abs(r.pct_change) >= 2;
      }).sort(function (x, y) { return Math.abs(y.pct_change) - Math.abs(x.pct_change); });
      extra = marketLines(e, all, mv2);
    } catch (err) { extra = []; }

    var readHtml = '<details class="read" open><summary><b>Read</b></summary><div>' +
      extra.join("") +
      (bits.length ? '<div style="margin:5px 0"><span style="color:var(--dim)">Cross-asset</span>  ' +
        bits.join(" · ") + "</div>" : "") + "</div></details>";

    return secWide("Star players",
      starChart(e) + wlTable(rows, true) +
      '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">' +
      starCorrel(e) + "</div>", readHtml);
  }

  // Same Star-Players card, on the Nasdaq-100 leverage family (QQQ tab). Reuses
  // the exact chart + correlation logic by swapping STARS/STAR_COLOR for the
  // synchronous render, then restoring them.
  // One shared truth object for the command summary and its cockpit detail.
  // QQQ spot/range/GEX all come from qqqChartModel(), so the two views cannot
  // disagree while the faster browser quote advances between logger snapshots.
  function nasdaqCommandModel(e, chartModel) {
    var M = chartModel || qqqChartModel(e);
    var mk = {};
    Object.keys(M.mk || {}).forEach(function (sym) { mk[sym] = M.mk[sym]; });
    var rawQ = M.q || {}, q = {};
    Object.keys(rawQ).forEach(function (k) { q[k] = rawQ[k]; });
    if (isFinite(M.spot)) q.last = M.spot;
    if (M.pct !== null && isFinite(M.pct)) q.pct_change = M.pct;
    mk.QQQ = q;

    var gx = M.g || {};
    var geometry = get(e, "quant.geometry");
    var dv = isFinite(M.geometry) ? M.geometry
      : (ok(geometry) && has(geometry.diversification_volume)
        ? Number(geometry.diversification_volume) : null);
    var vr2 = M.vr2;
    var realized = get(e, "quant.realized_vs_implied");
    var spread = ok(realized) && has(realized.spread_pct) ? Number(realized.spread_pct) : null;
    var gpos = ok(gx) && gx.regime === "POSITIVE GAMMA";
    var hostile = 0, friendly = 0;
    if (dv !== null) { if (dv < 0.15) hostile++; else if (dv >= 0.35) friendly++; }
    if (ok(gx) && has(gx.regime)) { if (gpos) friendly++; else hostile++; }
    if (vr2 !== null) { if (vr2 > 1.1) hostile++; else if (vr2 < 0.9) friendly++; }

    var call = "MIXED", callColor = "#ffd600", callBorder = "#454020";
    if (hostile >= 2) { call = "STAND DOWN"; callColor = "#ff453a"; callBorder = "#45201f"; }
    else if (friendly >= 2 && !hostile) {
      call = "LEAN FADE"; callColor = "#00e676"; callBorder = "#14432b";
    }
    return { chart:M, mk:mk, q:q, vix:isFinite(M.vix) ? M.vix : null,
             g:gx, geometry:geometry, dv:dv,
             vr2:vr2, realized:realized, spread:spread, gpos:gpos,
             hostile:hostile, friendly:friendly, call:call,
             callColor:callColor, callBorder:callBorder };
  }

  // Game-HUD command board for the Nasdaq tab — a glance dashboard (hero score,
  // gauges, status lights, compact leverage bars) built from the same live data
  // the cockpit uses. The heavy charts/tables live in the collapsed panels below.
  function secNasdaqHUD(e, chartModel) {
    var S = nasdaqCommandModel(e, chartModel);
    var mk = S.mk, q = S.q, vix = S.vix, gx = S.g;
    var g = S.geometry, dv = S.dv, vr2 = S.vr2, sp = S.spread, gpos = S.gpos;
    var hostile = S.hostile, friendly = S.friendly;
    var call = S.call, callCol = S.callColor, callBrd = S.callBorder;
    function C(v) { return v >= 0 ? "#00e676" : "#ff453a"; }

    var qz = q && has(q.z20) ? q.z20 : null;
    var qMove = q && has(q.last) && isFinite(S.chart.prevClose) ? q.last - S.chart.prevClose : null;
    var hero =
      '<div style="display:flex;gap:12px;margin-bottom:12px">' +
        '<div style="flex:2;background:#0d1a12;border:1px solid #14432b;border-radius:12px;padding:14px 16px">' +
          '<div style="font-size:10.5px;letter-spacing:1.5px;color:#8b8ba6">QQQ STRETCH</div>' +
          '<div style="font-size:38px;font-weight:800;line-height:1;color:' + (qz !== null ? (qz >= 0 ? "#00e676" : "#ff453a") : "#8b8ba6") + '">' +
            (qz !== null ? "z " + signed(qz, 2) : "&mdash;") + '</div>' +
          '<div style="font-size:12px;color:#8b8ba6;margin-top:5px">' +

  // Reusable pairwise-correlation table for any symbol list (same Pearson math
  // as the Star Players card). Used by the cockpit and the watchlist card.
  function corrTable(symbols, title) {
    var nH = H.length;
    var ser = {};
    symbols.forEach(function (s) { ser[s] = []; });
    H.forEach(function (entry) {
      var by = {};
      (entry.watchlist || []).forEach(function (w2) { by[w2.symbol] = w2; });
      symbols.forEach(function (s) { var w2 = by[s]; ser[s].push(w2 && has(w2.pct_change) ? w2.pct_change : null); });
    });
    var pairs = [];
    for (var a = 0; a < symbols.length; a++) {
      for (var b = a + 1; b < symbols.length; b++) {
        var xs = [], ys = [];
        for (var i = 0; i < nH; i++) {
          if (ser[symbols[a]][i] !== null && ser[symbols[b]][i] !== null) {
            xs.push(ser[symbols[a]][i]); ys.push(ser[symbols[b]][i]);
          }
        }
        if (xs.length < 5) continue;
        var mx = xs.reduce(function (p, c2) { return p + c2; }, 0) / xs.length;
        var my = ys.reduce(function (p, c2) { return p + c2; }, 0) / ys.length;
        var sxy = 0, sxx = 0, syy = 0;
        for (var k = 0; k < xs.length; k++) {
          var dx = xs[k] - mx, dy = ys[k] - my;
          sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
        }
        if (!sxx || !syy) continue;
        pairs.push({ a: symbols[a], b: symbols[b], r: sxy / Math.sqrt(sxx * syy), n: xs.length });
      }
    }
    if (!pairs.length) {
      return '<div style="font-size:11px;color:var(--faint);margin:2px 0 10px">' + esc(title) +
        " &mdash; needs ~5 shared sessions per pair; filling in as the logger runs.</div>";
    }
    pairs.sort(function (p1, p2) { return Math.abs(p2.r) - Math.abs(p1.r); });
    var out = '<div style="font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
      'text-transform:uppercase;margin-bottom:6px">' + esc(title) + "</div>" +
      "<table><tr><th>Pair</th><th style='text-align:right'>Correlation</th>" +
      "<th style='text-align:right'>Sessions</th></tr>";
    pairs.slice(0, 10).forEach(function (p) {
      var col = p.r > 0.5 ? "var(--up)" : p.r < -0.5 ? "var(--down)" : "var(--dim)";
      out += "<tr><td>" + p.a + " / " + p.b + "</td>" +
        '<td class="num" style="color:' + col + '">' + p.r.toFixed(2) + "</td>" +
        '<td class="num" style="color:var(--faint)">' + p.n + "</td></tr>";
    });
    return out + '</table><div style="height:14px"></div>';
  }

  // Normal CDF (Abramowitz & Stegun 7.1.26) — no library needed.
  function cdf(z) {
    var t = 1 / (1 + 0.2316419 * Math.abs(z));
    var d = 0.3989422804014327 * Math.exp(-z * z / 2);
    var p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
    return z > 0 ? 1 - p : p;
  }

  function fmtBig(v) {
    if (!has(v) || isNaN(v)) return na();
    var a = Math.abs(v), sign = v < 0 ? "-" : "";
    if (a >= 1e9) return sign + "$" + (a / 1e9).toFixed(2) + "B";
    if (a >= 1e6) return sign + "$" + (a / 1e6).toFixed(1) + "M";
    if (a >= 1e3) return sign + "$" + (a / 1e3).toFixed(0) + "K";
    return sign + "$" + a.toFixed(0);

  function secGex(e) {
    var g = e.gex;
    if (!ok(g) || !get(g, "strikes", []).length) return "";

    var strikes = g.strikes, spot = g.spot;
    var realFlip = g.gamma_flip_method === "zero crossing";
    var flip = realFlip ? g.gamma_flip : null;   // don't draw a fake level
    var pos = g.regime === "POSITIVE GAMMA";

    // ---- bar chart: net GEX per strike ----
    var W = 1080, Hh = 260, padL = 8, padR = 8, padT = 14, padB = 30;
    var maxAbs = Math.max.apply(null, strikes.map(function (s2) { return Math.abs(s2.net_gex); })) || 1;
    var kMin = strikes[0].strike, kMax = strikes[strikes.length - 1].strike;
    var span = (kMax - kMin) || 1;
    function X(k) { return padL + ((k - kMin) / span) * (W - padL - padR); }
    function Y(v) { return padT + (1 - (v / maxAbs + 1) / 2) * (Hh - padT - padB); }
    var zero = Y(0);
    var bw = Math.max((W - padL - padR) / strikes.length - 1, 1.5);

    var svg = '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + zero.toFixed(1) +
              '" y2="' + zero.toFixed(1) + '" stroke="#1e1e2a"/>';

    strikes.forEach(function (s2) {
      var y = Y(s2.net_gex), h = Math.abs(y - zero);
      svg += '<rect x="' + (X(s2.strike) - bw / 2).toFixed(1) + '" y="' +
        Math.min(y, zero).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' +
        Math.max(h, 0.6).toFixed(1) + '" fill="' +
        (s2.net_gex >= 0 ? "#00e676" : "#ff453a") + '" opacity=".85"><title>' +
        s2.strike + "\ncall " + fmtBig(s2.call_gex).replace(/<[^>]*>/g, "") +
        "\nput " + fmtBig(s2.put_gex).replace(/<[^>]*>/g, "") +
        "\nnet " + fmtBig(s2.net_gex).replace(/<[^>]*>/g, "") +
        "\nOI  c" + s2.call_oi + " / p" + s2.put_oi + "</title></rect>";
    });

    // Labels get their own vertical LANE so close strikes (spot / flip / call
    // wall often within a point of each other) never overprint into garble.
    var laneH = 12;
    function marker(k, col, label, dash, lane) {
      if (!has(k) || k < kMin || k > kMax) return "";
      var xn = X(k), x = xn.toFixed(1);
      var lineBot = Hh - padB;
      var ly = lineBot + 11 + lane * laneH;            // this label's baseline
      var anchor = xn > W - 55 ? "end" : xn < 55 ? "start" : "middle";
      return '<line x1="' + x + '" x2="' + x + '" y1="' + padT + '" y2="' + lineBot +
        '" stroke="' + col + '" stroke-width="1.6"' + (dash ? ' stroke-dasharray="4 3"' : "") + "/>" +
        // faint tick tying the staggered label back to its line
        '<line x1="' + x + '" x2="' + x + '" y1="' + lineBot + '" y2="' + (ly - 8).toFixed(1) +
        '" stroke="' + col + '" stroke-width="1" opacity=".35"/>' +
        '<text x="' + x + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" fill="' + col +
        '" font-size="9.5">' + label + " " + k + "</text>";
    }
    // Distinct lanes: put wall (far left, isolated) on lane 0; the right-side
    // cluster spot/flip/call each on its own lane so they stack, not collide.
    svg += marker(get(g, "levels.put_wall"), "#ff453a", "put wall", true, 0);
    svg += marker(spot, "#ff2be0", "spot", false, 0);
    svg += marker(flip, "#ffd600", "flip", false, 1);
    svg += marker(get(g, "levels.call_wall"), "#00e676", "call wall", true, 2);

    var body = '<div style="background:' + (pos ? "rgba(0,230,118,.10)" : "rgba(255,69,58,.10)") +
      ";border-left:3px solid " + (pos ? "var(--up)" : "var(--down)") +
      ';padding:10px 12px;margin-bottom:12px">' +
      '<div style="font-size:11px;color:var(--dim);letter-spacing:1.5px">REGIME</div>' +
      '<div style="font-size:19px;color:' + (pos ? "var(--up)" : "var(--down)") + '">' +
      esc(g.regime) + "</div>" +
      '<div style="font-size:12px;color:var(--dim);margin-top:4px">' +
      (pos ? "Dealers hedge against the move — expect pinning and mean reversion."
           : "Dealers hedge with the move — expect amplification and trend.") +
      (realFlip ? "" : "<br><span style='color:var(--faint)'>No flip level in range — " +
       "one-sided gamma across every strike.</span>") + "</div></div>";

    var Ht = Hh + 30;   // extra room below the plot for the stacked label lanes
    body += '<svg viewBox="0 0 ' + W + " " + Ht + '" width="100%" height="' + Ht +
            '" style="display:block">' + svg + "</svg>";

    body += "<table><tr><th>Level</th><th style='text-align:right'>Strike</th>" +
            "<th style='text-align:right'>vs spot</th></tr>";
    var L = g.levels || {};
    [["Gamma flip", flip, "#ffd600"],
     ["Call wall (resistance)", L.call_wall, "#00e676"],
     ["Put wall (support)", L.put_wall, "#ff453a"],
     ["Max + gamma (pin)", L.max_positive_gamma, "var(--dim)"],
     ["Max − gamma (amplify)", L.max_negative_gamma, "var(--dim)"],
     ["Highest OI (magnet)", L.highest_oi_strike, "var(--dim)"]
    ].forEach(function (r) {
      if (!has(r[1])) return;
      var d = ((r[1] - spot) / spot) * 100;
      body += '<tr><td style="color:' + r[2] + '">' + r[0] + "</td>" +
        '<td class="num">' + r[1] + "</td>" +
        '<td class="num">' + signed(d, 2, "%") + "</td></tr>";
    });
    body += "</table>";

    body += '<div style="margin-top:10px">' +
      row("Spot", num(spot, 2)) +
      row("Distance to flip", signed(g.distance_to_flip_pct, 2, "%")) +
      row("Contracts used", commas(g.contracts_used)) + "</div>" +

      // ---- full exposure stack ----
      '<div style="margin-top:14px"><h2 style="margin-bottom:6px">Exposure stack</h2>' +
      row("GEX  gamma", fmtBig(g.net_gex) + ' <span class=k>' +
          (g.net_gex >= 0 ? "dampening" : "amplifying") + "</span>") +
      row("DEX  delta", fmtBig(g.net_dex) + ' <span class=k>' +
          (has(g.net_dex) && g.net_dex >= 0 ? "hedge pressure up" : "hedge pressure down") + "</span>") +
      row("VEX  vega", fmtBig(g.net_vex)) +
      row("TEX  theta", fmtBig(g.net_tex)) + "</div>" +

      // ---- G, the SqueezeMetrics gamma-ratio ----
      (has(g.gamma_ratio)
        ? '<div style="margin-top:14px"><h2 style="margin-bottom:6px">G — gamma ratio</h2>' +
          '<div style="display:flex;height:16px;border-radius:3px;overflow:hidden;font-size:10px">' +
          '<div style="width:' + (g.gamma_ratio * 100).toFixed(1) +
          '%;background:#00e676;opacity:.85;display:flex;align-items:center;' +
          'justify-content:center;color:#000">' +
          (g.gamma_ratio > 0.15 ? "calls " + (g.gamma_ratio * 100).toFixed(1) + "%" : "") + "</div>" +
          '<div style="flex:1;background:#ff453a;opacity:.85;display:flex;align-items:center;' +
          'justify-content:center;color:#000">' +
          (g.gamma_ratio < 0.85 ? "puts " + (100 - g.gamma_ratio * 100).toFixed(1) + "%" : "") +
          "</div></div>" +
          '<div style="font-size:11px;color:var(--dim);margin-top:4px">' + num(g.gamma_ratio, 3) +
          " — " + (g.gamma_ratio > 0.55 ? "call-driven: convexity leans upside"
                   : g.gamma_ratio < 0.45 ? "put-driven: convexity leans downside"
                   : "balanced") +
          ' <span style="color:var(--faint)">(0.5 = neutral)</span></div></div>'
        : "") +
      '<div style="font-size:10.5px;color:var(--faint);margin-top:8px">' +
      esc(g.dealer_convention) + " · flip via " + esc(g.gamma_flip_method || "—") +
      " · greeks solved locally with Black-Scholes from the Alpaca chain" +
      (has(g.exposure_note) ? "<br>" + esc(g.exposure_note) : "") + "</div>";

    var lines = [];
    lines.push(verdict(pos ? "var(--up)" : "var(--down)", pos
      ? "<b>Positive gamma.</b> Net GEX " + fmtBig(g.net_gex) + " with spot " +
        (realFlip ? (g.distance_to_flip_pct >= 0 ? "above" : "below") + " the " + flip + " flip"
                  : "one-sided across the window") +
        ", so dealers are <b>dampening</b> &mdash; rallies get sold, dips bought, and realised vol tends to come in under implied. That's the containment backdrop your fades want; treat the " +
        (has(L.put_wall) ? L.put_wall : "?") + "&ndash;" + (has(L.call_wall) ? L.call_wall : "?") +
        " walls as magnets and lean on reversion."
      : "<b>Negative gamma.</b> Net GEX " + fmtBig(g.net_gex) + " with spot below the " + flip +
        " flip, so dealers <b>amplify</b> &mdash; they sell weakness and buy strength, moves accelerate, and reversion is unreliable. Fades into strength are the trap here; wait for exhaustion, not just stretch."));
    lines.push("<div style='margin:5px 0'>Net GEX is <b>" + fmtBig(g.net_gex) +
      "</b>. " + (realFlip
        ? "Spot sits " + (g.distance_to_flip_pct >= 0 ? "<b>above</b>" : "<b>below</b>") +
          " the flip at " + flip + " by " + Math.abs(g.distance_to_flip_pct).toFixed(2) + "%."
        : "<b>There is no gamma flip inside the strike window</b> — net gamma is the same " +
          "sign at every strike, so there's no level where dealer behaviour reverses. " +
          "That's a finding, not a gap.") + "</div>");
    lines.push("<div style='margin:5px 0'>" + (pos
      ? "Positive gamma: dealer hedging <b>dampens</b> moves. Rallies get sold, dips get bought, and realised vol tends to come in under implied. This is the regime your fade setups like."
      : "Negative gamma: dealer hedging <b>accelerates</b> moves. Selling begets selling. Fades are dangerous here — the same flow that pinned price yesterday pushes it today.") +
      "</div>");
    if (has(L.call_wall) && has(L.put_wall)) {
      lines.push("<div style='margin:5px 0'>Walls bracket <b>" + L.put_wall + " – " + L.call_wall +
        "</b>, a " + (((L.call_wall - L.put_wall) / spot) * 100).toFixed(2) +
        "% band. Those are where gamma concentrates, so they act as magnets until they break.</div>");
    }
    if (has(g.gamma_ratio)) {
      lines.push("<div style='margin:5px 0'>G is <b>" + g.gamma_ratio.toFixed(3) +
        "</b> — " + (g.gamma_ratio > 0.55 ? "convexity leans <b>upside</b>, call structures dominate"
         : g.gamma_ratio < 0.45 ? "convexity leans <b>downside</b>, put structures dominate"
         : "call and put gamma are near balanced") +
        ". This is SqueezeMetrics' gamma-ratio, computed off your own chain.</div>");
    }
    if (has(g.net_dex)) {
      lines.push("<div style='margin:5px 0'>DEX is <b>" + fmtBig(g.net_dex) +
        "</b>. Gamma tells you the vol regime; delta tells you which way dealer " +
        "hedging leans. When GEX and DEX disagree, the pin is fighting a directional flow.</div>");
    }
    lines.push("<div style='margin:6px 0;padding:7px 9px;background:rgba(255,214,0,.08);" +
      "border-left:2px solid var(--warn);font-size:11.5px'>" +
      "<b style='color:var(--warn)'>Caveat that matters.</b> Cboe's research desk measured the " +
      "actual net gamma hedging load from 0DTE flow at roughly <b>0.2% of SPX daily liquidity</b> " +
      "— over 95% of 0DTE trades are limited-risk and call/put flow is largely balanced, so it " +
      "nets out. Read these levels as <b>where the crowd's contracts are stacked</b>, not as " +
      "proof dealers are forced to defend them. Both usually point to the same strikes. When a " +
      "wall breaks on balanced flow, the mechanical floor was thinner than the chart felt.</div>");
    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>" +
      "Built from open interest and locally-solved Black-Scholes greeks. It assumes a " +
      "dealer positioning convention — if that assumption is wrong, the sign is wrong. " +
      "Treat levels as where flow concentrates, not as predictions.</div>");

    return secWide("GEX map — ≤30d · ±10% strikes · twice-daily (ours, not a vendor's)", body,
      '<details class="read" open><summary><b>Read</b></summary><div>' +
      lines.join("") + "</div></details>");
  }

  function secGeometry(e) {
    var g = get(e, "quant.geometry");
    if (!ok(g) || !has(g.diversification_volume)) return "";

    var vol = g.diversification_volume;
    var pct = Math.max(Math.min(vol, 1), 0) * 100;
    var col = vol < 0.15 ? "var(--down)" : vol < 0.35 ? "var(--warn)" : "var(--up)";

    var body = '<div style="margin-bottom:10px">' +
      '<div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;' +
      'color:var(--dim)">Diversification volume  √det(G)</div>' +
      '<div style="font-size:23px;color:' + col + '">' + num(vol, 4) + "</div>" +
      '<div style="height:10px;background:rgba(255,255,255,.05);border-radius:2px;' +
      'margin-top:6px;overflow:hidden"><div style="height:10px;width:' + pct.toFixed(1) +
      '%;background:' + col + ';opacity:.8"></div></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:10px;' +
      'color:var(--faint);margin-top:2px"><span>0 = one crowded trade</span>' +
      "<span>1 = independent</span></div></div>";

    body += row("Regime", '<span style="color:' + col + '">' + esc(g.regime) + "</span>") +
      row("det G", num(g.det_G, 6)) +
      row("Average correlation", num(g.avg_correlation, 3)) +
      row("Assets × sessions", g.assets + " × " + g.observations);

    body += '<div style="margin-top:14px"><h2 style="margin-bottom:6px">' +
      "Marchenko–Pastur noise floor</h2>" +
      row("λ₊ threshold", num(g.mp_lambda_plus, 3)) +
      row("Real factors", g.real_factors + " of " + g.assets) +
      row("Top eigenvalue share", num(g.top_eigen_share_pct, 1, "%")) + "</div>";

    if (get(g, "eigenvalues", []).length) {
      var mx = g.eigenvalues[0] || 1;
      body += '<div style="margin-top:10px;font-size:10.5px;color:var(--dim)">eigenvalues ' +
        "(bars above the dashed line are real factors, the rest is noise)</div>" +
        '<div style="display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:4px;' +
        'position:relative">';
      g.eigenvalues.forEach(function (ev) {
        var real = ev > g.mp_lambda_plus;
        body += '<div title="' + ev + '" style="flex:1;height:' +
          Math.max(ev / mx * 100, 2).toFixed(1) + '%;background:' +
          (real ? "var(--accent)" : "var(--line)") + ';border-radius:1px 1px 0 0"></div>';
      });
      body += '<div style="position:absolute;left:0;right:0;bottom:' +
        (g.mp_lambda_plus / mx * 100).toFixed(1) +
        '%;border-top:1px dashed var(--warn)"></div></div>';
    }

    var lines = [];
    var _gcol = vol < 0.15 ? "var(--down)" : vol < 0.4 ? "var(--warn)" : "var(--up)";
    lines.push(verdict(_gcol, vol < 0.15
      ? "Cross-asset diversification has <b>geometrically collapsed</b> (&radic;det(G) " + num(vol, 3) +
        ", near zero) &mdash; everything is moving as one trade. This is exactly when mechanical reversion stops being true, so <b>stand your fades down</b> until it re-expands."
      : vol < 0.4 ? "&radic;det(G) is <b>" + num(vol, 3) + "</b> &mdash; correlations are elevated and diversification is thin, so trade smaller and treat reversion signals with more suspicion than usual."
      : "&radic;det(G) is <b>" + num(vol, 3) + "</b> &mdash; assets are moving fairly independently, so the mechanical-reversion assumption your fades rely on is intact. Normal conditions."));
    lines.push("<div style='margin:5px 0'>√det(G) is <b>" + num(vol, 4) + "</b>. " +
      (vol < 0.15
        ? "Correlations have collapsed toward one — diversification hasn't shrunk, it has " +
          "<b>geometrically stopped existing</b>. This is the alarm that matters for a fader: " +
          "your mechanical-reversion assumption is exactly what stops being true here."
        : vol < 0.35
        ? "Names are locking together. Dispersion is draining out of the tape."
        : "Sectors are still moving with reasonable independence — dispersion intact, which " +
          "is the environment mechanical reversion actually works in.") + "</div>");

    lines.push("<div style='margin:5px 0'>Average correlation is <b>" + g.avg_correlation +
      "</b>. The determinant matters more than that average: if two big index components " +
      "quietly become near-identical, two rows of G align and det G craters while the average " +
      "barely twitches. The determinant sees the dimensional collapse; the average doesn't.</div>");

    lines.push("<div style='margin:5px 0'>Only <b>" + g.real_factors + " of " + g.assets +
      "</b> eigenvalues clear the Marchenko–Pastur floor of " + g.mp_lambda_plus +
      ", so the rest of that correlation structure is statistically indistinguishable from " +
      "noise. Fewer real factors means fewer genuinely independent things moving.</div>");

    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>" +
      "Chosen over a hidden Markov regime model on purpose: HMMs flicker on single outliers, " +
      "which is poison if decisions hang off the label. A real regime shift is a genuine " +
      "collapse in det G, and a one-bar outlier isn't.</div>");

    return sec("Regime geometry — √det(G)", body,
      '<details class="read" open><summary><b>Read</b></summary><div>' +
      lines.join("") + "</div></details>");
  }

  function secQuant(e) {
    var mk = {};
    (e.watchlist || []).forEach(function (r) { mk[r.symbol] = r; });
    var vix = get(mk, "VIX.last");
    var q = mk.QQQ;
    if (!has(vix) || !q || !has(q.last)) return "";

    var spot = q.last;
    // VIX is an annualised 30-day implied vol. One trading day = /sqrt(252).
    var sig = vix / Math.sqrt(252) / 100;
    var body = "";

    body += row("VIX (annualised IV)", num(vix, 2, "%"));
    body += row("Implied 1-day σ", num(sig * 100, 2, "%") +
                "  <span class=k>±$" + (spot * sig).toFixed(2) + "</span>");

    // where does the overnight gap sit in that distribution?
    if (has(q.overnight_pct)) {
      var z = (q.overnight_pct / 100) / sig;
      var pAbove = 1 - cdf(z);
      body += row("Overnight gap", signed(q.overnight_pct, 2, "%") +
        "  <span class=k>z = " + z.toFixed(2) + "</span>");
      body += row("Gap this size or larger", num(pAbove * 100, 1, "%") +
        " <span class=k>of sessions, if IV is right</span>");
    }

    // session decay: sigma shrinks with sqrt(time remaining)
    // Session anchors in PACIFIC. US cash session is 6:30 AM - 1:00 PM PT.
    var marks = [["6:30 AM open", 6.5], ["8:00 AM", 5.0], ["10:00 AM", 3.0],
                 ["12:00 PM", 1.0], ["12:55 PM", 0.08]];
    body += '<div style="margin-top:12px"><h2 style="margin-bottom:6px">' +
            "Implied range into the close</h2>" +
            "<table><tr><th>Time (PT)</th><th style='text-align:right'>&sigma; left</th>" +
            "<th style='text-align:right'>68% band</th>" +
            "<th class='smhide' style='text-align:right'>95% band</th></tr>";
    marks.forEach(function (m) {
      var sr = sig * Math.sqrt(m[1] / 6.5);
      body += "<tr><td>" + m[0] + "</td>" +
        '<td class="num">' + (sr * 100).toFixed(2) + "%</td>" +
        '<td class="num">' + (spot * (1 - sr)).toFixed(2) + " – " + (spot * (1 + sr)).toFixed(2) + "</td>" +
        '<td class="num smhide" style="color:var(--dim)">' + (spot * (1 - 2 * sr)).toFixed(2) +
        " – " + (spot * (1 + 2 * sr)).toFixed(2) + "</td></tr>";
    });
    body += "</table></div>";

    // ---- regime-conditioned vol (GARCH) — the fix for assuming normality ----
    var g11 = get(e, "quant.garch");
    if (ok(g11) && has(g11.conditional_vol_pct)) {
      var cvol = g11.conditional_vol_pct;
      var csig = cvol / Math.sqrt(252) / 100;
      body += '<div style="margin-top:14px"><h2 style="margin-bottom:6px">' +
        "Vol regime — GARCH(1,1)</h2>" +
        row("Regime", '<span style="color:' +
            (g11.regime === "HIGH VOL" ? "var(--down)" :
             g11.regime === "LOW VOL" ? "var(--up)" : "var(--dim)") + '">' +
            esc(g11.regime) + "</span>") +
        row("Conditional vol", num(cvol, 2, "%")) +
        row("Unconditional vol", num(g11.unconditional_vol_pct, 2, "%")) +
        row("Persistence α+β", num(g11.persistence, 3)) +
        row("Implied 1-day σ (GARCH)", num(csig * 100, 2, "%") +
            "  <span class=k>±$" + (spot * csig).toFixed(2) + "</span>") +
        row("68% band (GARCH)", (spot * (1 - csig)).toFixed(2) + " – " +
            (spot * (1 + csig)).toFixed(2)) +
        "</div>";
    }

    // ---- realized vs implied: the gamma-scalping number ----
    var rvi = get(e, "quant.realized_vs_implied");
    if (ok(rvi)) {
      body += '<div style="margin-top:14px"><h2 style="margin-bottom:6px">' +
        "Realized vs implied</h2>" +
        row("Realized (" + rvi.window_days + "d)", num(rvi.realized_vol_pct, 2, "%")) +
        row("Implied (VIX)", num(rvi.implied_vol_pct, 2, "%")) +
        row("Spread", signed(rvi.spread_pct, 2, "pp")) + "</div>";
    }

    // skew from the options tape
    var pc = get(e, "options.total_pc"), ipc = get(e, "options.index_pc"),
        epc = get(e, "options.equity_pc");
    if (has(pc)) {
      body += '<div style="margin-top:12px"><h2 style="margin-bottom:6px">Positioning skew</h2>';
      body += row("Total P/C", num(pc, 2));
      if (has(ipc) && has(epc)) {
        body += row("Index − equity P/C", signed(ipc - epc, 2) +
          " <span class=k>" + (ipc - epc > 0.2 ? "institutional hedging" : "balanced") + "</span>");
      }
      body += "</div>";
    }

    var lines = [];
    lines.push((ok(rvi) && has(rvi.spread_pct))
      ? verdict(rvi.spread_pct > 0 ? "var(--up)" : "var(--down)", rvi.spread_pct > 0
          ? "Realised vol is running <b>above</b> implied (spread " + signed(rvi.spread_pct, 1, "pp") +
            ") &mdash; the market is underpricing movement, which is the <b>buyer's</b> side you sit on. Your long-0DTE gamma is being paid, and today's &plusmn;" + (sig * 100).toFixed(2) + "% expected move is probably too tight."
          : "Realised vol is coming in <b>below</b> implied (spread " + signed(rvi.spread_pct, 1, "pp") +
            ") &mdash; the short-gamma dealer's edge, and the wrong side for a long-0DTE buyer. You're overpaying for movement, so demand a bigger stretch before paying up for premium.")
      : verdict("var(--dim)", "Options are pricing a <b>&plusmn;" + (sig * 100).toFixed(2) + "%</b> day (about $" +
          (spot * sig).toFixed(2) + "), but there's no realised-vs-implied read this run &mdash; lean on the range and GARCH blocks below."));
    lines.push("<div style='margin:5px 0'>Option markets are pricing a <b>&plusmn;" +
      (sig * 100).toFixed(2) + "%</b> one-day move in QQQ — about <b>$" +
      (spot * sig).toFixed(2) + "</b>. Two-thirds of sessions should close inside " +
      (spot * (1 - sig)).toFixed(2) + "–" + (spot * (1 + sig)).toFixed(2) + ".</div>");

    if (has(q.overnight_pct)) {
      var z2 = (q.overnight_pct / 100) / sig;
      lines.push("<div style='margin:5px 0'>The overnight gap is <b>" + z2.toFixed(2) +
        "&sigma;</b>. If implied vol is fair, a gap that large or larger happens about <b>" +
        ((1 - cdf(z2)) * 100).toFixed(0) + "%</b> of the time — " +
        (Math.abs(z2) > 1 ? "the tape has already used most of its expected daily range before the bell."
                          : "well inside the expected range.") + "</div>");
    }

    var disp = get(e, "sectors.rows", []);
    if (disp.length) {
      var spread = Math.max.apply(null, disp.map(function (r) { return r.pct_change; })) -
                   Math.min.apply(null, disp.map(function (r) { return r.pct_change; }));
      lines.push("<div style='margin:5px 0'>Sector spread is <b>" + spread.toFixed(2) +
        "pp</b> top to bottom against an index moving " +
        (has(q.pct_change) ? Math.abs(q.pct_change).toFixed(2) : "?") +
        "%. Dispersion is doing the work, not direction — the environment favours " +
        "relative-value over outright index bets.</div>");
    }

    var rvi2 = get(e, "quant.realized_vs_implied");
    if (ok(rvi2)) {
      lines.push("<div style='margin:5px 0'>Realized vol is <b>" + rvi2.realized_vol_pct +
        "%</b> against <b>" + rvi2.implied_vol_pct + "%</b> implied — a " +
        (rvi2.spread_pct >= 0 ? "+" : "") + rvi2.spread_pct + "pp spread. " +
        esc(rvi2.who_is_paid) + ". A short-gamma dealer earns " +
        "½ΓS²(σ²real − σ²impl); you, long 0DTE, need that sign flipped.</div>");
    }

    var g2 = get(e, "quant.garch");
    if (ok(g2) && has(g2.conditional_vol_pct)) {
      lines.push("<div style='margin:5px 0'>GARCH puts you in a <b>" + esc(g2.regime) +

  function finalRegime(e, align) {
    var vix = get(e, "markets.VIX.last");
    var pc = get(e, "options.total_pc");
    var s = align.sum, n = align.live;

    var call, why;
    if (!n) { call = "INSUFFICIENT DATA"; why = "Not enough sources returned to make a call."; }
    else if (s >= n * 0.6) { call = "RISK-ON / TREND"; why = "Breadth, vol and positioning point the same direction."; }
    else if (s <= -n * 0.6) { call = "RISK-OFF / DEFENSIVE"; why = "Broad de-risking across sectors, vol and hedging."; }
    else if (has(vix) && vix > 26) { call = "HIGH-VOL CHOP"; why = "Elevated vol with disagreeing internals — fade edges, expect whips."; }
    else { call = "MIXED / ROTATIONAL"; why = "Signals conflict. Rotation under the surface, no clean directional read."; }

    if (has(pc) && pc >= 1.15) why += " Put-heavy tape (" + pc.toFixed(2) + ") — mean-reversion setups favored.";

    // Alignment lives HERE now, under the call it produced — not in its own
    // box halfway down the page.
    var strip = "";
    if (align.votes) {
      var chips = Object.keys(align.votes).map(function (k) {
        var v = align.votes[k];
        var col = v === null ? "var(--faint)" : v > 0 ? "var(--up)" : v < 0 ? "var(--down)" : "var(--dim)";

        return '<span style="display:inline-block;margin:0 14px 4px 0;font-size:11.5px">' +
               '<span style="color:var(--dim)">' + esc(k) + "</span> " +

        'color:var(--dim);margin-bottom:6px">Alignment — ' + align.live + " of " +
        Object.keys(align.votes).length + " signals reporting</div>" + chips +
        (align.read ? '<div style="font-size:12px;color:var(--dim);margin-top:4px">' +
          esc(align.read) + "</div>" : "") + "</div>";
    }

    return '<div class="regime"><div class="label">Best-fit regime</div>' +
           '<div class="call">' + call + "</div>" +
           '<div class="why">' + esc(why) + "</div>" + strip + "</div>";

  function secWide(title, body, readHtml) {
    return sec(title, body, readHtml).replace("<section>", '<section class="wide">');

  // ---------- collapse state, remembered between visits ----------
  function keyFor(title) {
    return "md:" + String(title).replace(/[^a-z0-9]+/gi, "_").toLowerCase();
  }
  function readStore() {
    try { return JSON.parse(localStorage.getItem("md:collapsed") || "{}"); }
    catch (err) { return {}; }
  }
  function writeStore(o) {
    try { localStorage.setItem("md:collapsed", JSON.stringify(o)); }
    catch (err) { /* private mode or file:// — just don't persist */ }
  }
  function applyCollapseState() {
    var store = readStore();
    var nodes = document.querySelectorAll("details[data-k]");
    for (var i = 0; i < nodes.length; i++) {
      var d = nodes[i], k = d.getAttribute("data-k");
      if (store[k] === 1) d.removeAttribute("open");
      d.addEventListener("toggle", function () {
        var s2 = readStore();
        if (this.open) delete s2[this.getAttribute("data-k")];
        else s2[this.getAttribute("data-k")] = 1;
        writeStore(s2);
      });
    }
  }

  function sec(title, body, readHtml) {
    // body goes INSIDE <details> (collapsible).
    // readHtml sits OUTSIDE it, so folding the box keeps the read on screen.
    var k = keyFor(title);
    return '<section><details open data-k="' + k + '"><summary><h2>' + esc(title) +
           "</h2></summary>" + body + "</details>" +
           (readHtml || "").replace('<details class="read" open>',
                                    '<details class="read" open data-k="' + k + ':read">') +
           "</section>";
  }

  // ---------- render ----------
  function secTouchFlow(e) {
    // spot + 1-day implied sigma, same source secQuant uses
    var mk = {};
    (e.watchlist || []).forEach(function (r) { mk[r.symbol] = r; });
    var vix = get(mk, "VIX.last");
    var q = mk.QQQ;
    var g = e.gex;
    if (!has(vix) || !q || !has(q.last) || !ok(g)) return "";

    var spot = q.last;
    var sig = vix / Math.sqrt(252) / 100;      // 1-day implied sigma (a fraction)
    var L = g.levels || {};

    // Probability price TOUCHES level K by the close, driftless GBM:
    //   P(touch) ~= 2 * N( -|ln(K/spot)| / sigma )   (reflection principle)
    function touch(K) {
      if (!has(K) || !(K > 0) || sig <= 0) return null;
      return Math.min(1, 2 * cdf(-Math.abs(Math.log(K / spot)) / sig));
    }

    var levels = [
      ["Gamma flip", g.gamma_flip_method === "zero crossing" ? g.gamma_flip : null],
      ["Call wall",  L.call_wall],
      ["Put wall",   L.put_wall],
      ["OI magnet",  L.highest_oi_strike]
    ];

    var rows = "";
    levels.forEach(function (lv) {
      var K = lv[1], p = touch(K);
      if (p === null) return;
      var dist = ((K - spot) / spot) * 100;
      rows += "<tr><td>" + esc(lv[0]) + "</td>" +
        '<td class="num">' + num(K, 2) + "</td>" +
        '<td class="num">' + signed(dist, 2, "%") + "</td>" +
        '<td class="num">' + (p * 100).toFixed(0) + "%</td></tr>";
    });
    if (!rows) return "";

    var body =
      '<table><tr><th>Level</th><th style="text-align:right">Strike</th>' +
      '<th style="text-align:right">vs spot</th>' +
      '<th style="text-align:right">touch odds</th></tr>' + rows + "</table>";

    var pos = g.regime === "POSITIVE GAMMA";
    var lines = [];
    lines.push(verdict(pos ? "var(--up)" : "var(--down)",
      "At today's &plusmn;" + (sig * 100).toFixed(2) + "% &sigma;, your flip and walls are far likelier to be <b>touched</b> than <b>broken</b> &mdash; " +
      (pos ? "and with positive gamma you can fade toward them and let the pin do the work"
           : "but with negative gamma a touch can flip into a break, so tighten up") +
      ". The practical rule: don't park stops on high-touch levels, or they'll get run on a day that still reverts."));
    lines.push("<div style='margin:5px 0'>Touch odds are the chance price <b>tags</b> each " +
      "level at some point today (about 2&times; the odds it <i>closes</i> beyond it), from " +
      "the VIX 1-day &sigma; of <b>" + (sig * 100).toFixed(2) + "%</b>. A wall is far more " +
      "likely to be <b>touched</b> than <b>broken</b> &mdash; size fades toward it, and expect " +
      "stops parked at high-touch levels to get run even on a day that ultimately reverts. " +
      "(Full-session estimate; it shrinks with &radic;(time left).)</div>");
    lines.push("<div style='margin:5px 0'>Second-order dealer flow (vanna / charm): in <b>" +
      (pos ? "positive gamma" : "negative gamma") + "</b>, " +
      (pos
        ? "charm quietly bleeds dealer delta toward the pins as the day ages &mdash; the slow " +
          "grind into the close &mdash; and a vol spike adds mild vanna selling into downside " +
          "puts. Both are mechanical and tend to revert."
        : "charm and vanna both push <b>with</b> the move &mdash; the grind becomes a slide and " +
          "a vol spike accelerates it. Fades into strength are dangerous here.") +
      "</div>");

    return sec("Touch odds & dealer-flow tilt", body,
      '<details class="read"><summary><b>Read</b></summary><div>' +
      lines.join("") + "</div></details>");
  }

  function secFadeRegime(e) {
    // QQQ daily % returns across the logged history, up to the viewed session
    var series = starSeries("pct_change").QQQ || [];
    var cut = H.indexOf(e);
    var upto = (cut >= 0) ? series.slice(0, cut + 1) : series;
    var r = upto.filter(function (v) { return typeof v === "number" && isFinite(v); })
                .map(function (v) { return Math.log(1 + v / 100); });   // LOG returns
    var n = r.length;
    if (n < 12) return "";                      // need a real sample first (NaN/nulls dropped)

    function mean(a) { var s = 0; a.forEach(function (v) { s += v; }); return s / a.length; }
    var mu = mean(r);
    function varK(k) {                          // variance of overlapping k-day sums
      var m = n - k + 1, acc = 0;
      for (var i = 0; i < m; i++) {
        var s = 0; for (var j = 0; j < k; j++) s += r[i + j];
        acc += (s - k * mu) * (s - k * mu);
      }
      return acc / m;
    }
    var v1 = varK(1);
    if (v1 <= 0) return "";
    function VR(k) { return varK(k) / (k * v1); }
    var vr2 = VR(2), vr5 = VR(5);
    var Hurst = 0.5 + 0.5 * (Math.log(vr2) / Math.log(2));
    // Hurst is unreliable on short samples: needs ~500+ obs; non-stationarity biases H toward 1.
    var conf = n >= 500 ? "solid" : n >= 250 ? "moderate" : n >= 60 ? "low" : "very low (illustrative)";

    var label, col, tone;
    if (vr2 < 0.9)      { label = "MEAN-REVERTING"; col = "var(--up)";
      tone = "fades are in season &mdash; mechanical stretch tends to snap back."; }
    else if (vr2 > 1.1) { label = "TRENDING";       col = "var(--down)";
      tone = "moves feed on themselves &mdash; fades get run over; wait for the second push."; }
    else                { label = "RANDOM WALK";    col = "var(--dim)";
      tone = "no memory either way &mdash; no reversion edge to lean on today."; }

    var body =
      row("Regime", '<span style="color:' + col + '">' + label + "</span>") +
      row("Variance ratio VR(2)", num(vr2, 3)) +
      row("Variance ratio VR(5)", num(vr5, 3)) +
      row("Hurst H", num(Hurst, 3) + " <span class=k>" +
          (Hurst < 0.5 ? "&lt;0.5 anti-persistent" :
           Hurst > 0.5 ? "&gt;0.5 persistent" : "random") + "</span>") +
      row("Sample", n + " sessions") +
      row("Confidence", '<span style="color:' + (n >= 250 ? "var(--dim)" : "var(--warn)") + '">' +
          conf + "</span> <span class=k>Hurst wants ~500+ obs</span>");

    var lines = [];
    lines.push(verdict(col, "QQQ's recent tape reads <b>" + label + "</b> (VR(2) " + num(vr2, 2) +
      ", Hurst " + num(Hurst, 2) + ") &mdash; " +
      (vr2 < 0.9 ? "returns fight themselves, so mechanical stretch tends to snap back and fades are in season"
       : vr2 > 1.1 ? "moves feed on themselves, so fades get run over &mdash; wait for the second push"
       : "no memory either way, so there's no reversion edge to lean on") +
      ". But <b>confidence is " + conf + "</b>: Hurst wants ~500+ observations and you have a handful, so treat this as a lean, not a verdict."));
    lines.push("<div style='margin:5px 0'>Variance ratio compares the variance of multi-day " +
      "returns against a random walk. <b>VR &lt; 1</b> means QQQ returns fight themselves " +
      "(mean-reverting, fade-friendly); <b>VR &gt; 1</b> means they feed on themselves " +
      "(trending, fade-hostile). Hurst is the same read as one number, " +
      "H = 0.5 + &frac12;&middot;log&#8322;(VR(2)).</div>");
    lines.push("<div style='margin:5px 0'>Now VR(2) = <b>" + num(vr2, 3) + "</b> &rarr; <b>" +
      label + "</b>: " + tone + " Pair it with the OU half-life before committing a fade &mdash; " +
      "stretch <i>and</i> a short reversion clock, not either alone.</div>");
    lines.push("<div style='margin:5px 0;color:var(--warn);font-size:11px'><b>Confidence: " + conf +
      ".</b> Hurst is unreliable below ~500 observations, and non-stationarity biases it toward 1 " +
      "(trending) &mdash; with " + n + " points this is a <b>weak prior</b>, not a verdict. Treat the " +
      "label as a lean, and lean harder only as the sample grows.</div>");
    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>Computed on <b>daily</b> " +
      "closes (log returns), so it reads the multi-day backdrop, not the intraday tape. Feed it a " +
      "per-minute QQQ series and the identical formula becomes a live intraday fade light.</div>");

    return sec("Fade regime — variance ratio / Hurst", body,
      '<details class="read"><summary><b>Read</b></summary><div>' +
      lines.join("") + "</div></details>");
  }

  function secRangeUsed(e) {

    var movePct = Math.abs(q.pct_change);         // move used so far today (%)
    var used = expPct > 0 ? movePct / expPct : 0; // fraction of the day's range spent

    var bar =

      '<div style="height:100%;width:' + (Math.min(used, 1) * 100).toFixed(0) +
      '%;background:' + col + '"></div></div>';

      row("Expected 1-day move", "&plusmn;" + expPct.toFixed(2) + "%  <span class=k>$" +

       : "The day has <b>blown past</b> its 1&sigma; range &mdash; either real information is driving it (don't fade) or it's badly overstretched (a prime fade, but confirm the regime first).")));
    lines.push("<div style='margin:5px 0'>Price has spent <b>" + (used * 100).toFixed(0) +
      "%</b> of the &plusmn;" + expPct.toFixed(2) + "% the options market priced for today. " +

      ". Pair a high 'range used' with the Fade-regime card: overstretched AND mean-reverting is the " +
      "fade; overstretched AND trending is the trap.</div>");

    return sec("Range used — how much of today's move is spent", body,

  function secVanna(e) {

      "not proxies; sign follows your logger's convention (" + esc(g.dealer_convention || "—") + ").</div>");
    lines.push("<div style='margin:5px 0'><b>Vega (vex)</b> and <b>theta (tex)</b> exposures sit alongside as the " +

  function qqqChartModel(e) {
    var latest = idx === FULL.length - 1;
    var g = (latest && LIVE_GEX) ? LIVE_GEX : get(e, "gex", {});
    var L = (g && g.levels) || {};

    var q = mk.QQQ || {};

    var quoteTime = quoteLive && isFinite(Number(q._live_src_time))

    var vix = Number(get(mk, "VIX.last"));
    var sig = isFinite(vix) && vix > 0 ? vix / Math.sqrt(252) / 100 : null;

    // Current-session implied range shrinks with the square root of time left.

    add("core", L.call_wall, "#00e676", touchTitle("Call wall", L.call_wall), "solid", 2, 20);

      add("ranges", spot * (1 + gsig), "#ff00e5", "+GARCH 68%", "dashed", 1, 70);
      add("ranges", spot * (1 - gsig), "#ff00e5", "-GARCH 68%", "dashed", 1, 71);

    if (vanna) add("flow", vanna.price, "#00bfa5", touchTitle("Vanna", vanna.price), "dotted", 1, 80);
    if (charm) add("flow", charm.price, "#c792ea", touchTitle("Charm", charm.price), "dotted", 1, 82);

    var geometry = Number(get(e, "quant.geometry.diversification_volume"));

  function secQqqGexProfile(e, bodyOnly, chartModel) {

    var strikes = raw.map(function (s) {

      '<text data-gex-axis-price="' + (kMin + edge) + '" x="' + (padL - 5) + '" y="' + (Y(kMin + edge) + 3).toFixed(1) +
      '" text-anchor="end" fill="#55556b" font-size="9">' + num(kMin + edge, 0) + '</text>' +

          'aria-label="Horizontal net gamma exposure bars aligned to the QQQ chart price axis, with live spot, gamma flip, call wall and put wall">' +
          svg + '</svg></div>' +
        '<div class="qqq-gex-levels">' +
          level(M.quoteFresh ? "Live QQQ" : (M.quoteLive ? "QQQ" : "Spot"), spot, "#ff2be0", "qqq-gex-spot-value") +
          level("Gamma flip", flip, "#ffd600", "") +
          level("Call wall", L.call_wall, "#00e676", "") +
          level("Put wall", L.put_wall, "#ff453a", "") +
        '</div>' +
        '<div class="qqq-gex-foot">Strike price runs vertically with the QQQ chart; green / red net-GEX bars extend right / left from zero. Lines use the same snapshot as the dealer-map overlays. ' +
          (liveLogger ? "Logger scope is the currently captured 0DTE strike window." : "Historical view uses the saved full-session options map.") +
          (stamp ? " · As of " + fmtTime(stamp) : "") + '</div>' +
        '<div id="qqq-gex-window-note" class="qqq-gex-window-note"></div>' +
      '</div>';
    if (bodyOnly) return body;
    return sec("GEX · synchronized strike profile", body)
      .replace("<section>", '<section class="qqq-gex-profile">');
  }

  // ── Q3: one synthesized read — MARKET STORY + CURRENT POSTURE + KEY LEVELS ──
  // Consolidates the per-section "Read" prose (now hidden via .flow .read) into a
  // single narrative built from the SAME computed signals the HUD/cockpit use.
  function secSynthesis(e, chartModel) {
    var S = nasdaqCommandModel(e, chartModel);
    var gx = S.g || {}, L = get(gx, "levels", {}) || {};
    var spot = (S.chart && isFinite(S.chart.spot)) ? S.chart.spot : (has(gx.spot) ? gx.spot : null);
    if (spot === null) return "";
    var sig = (S.chart && S.chart.sigLeft !== undefined) ? S.chart.sigLeft : null;
    var flip = has(gx.gamma_flip) ? gx.gamma_flip : null;
    var cw = has(L.call_wall) ? L.call_wall : null;
    var pw = has(L.put_wall) ? L.put_wall : null;
    var oi = has(L.highest_oi_strike) ? L.highest_oi_strike : null;
    var z = (S.q && has(S.q.z20)) ? S.q.z20 : null;
    var dv = S.dv, vr2 = S.vr2, sp = S.spread, vix = S.vix;
    var garch = get(e, "quant.garch");

    function tag(name, p, col) {
      if (p === null || !isFinite(p)) return "";
      var d = spot ? (p / spot - 1) * 100 : null;
      return '<span style="display:inline-block;background:rgba(255,255,255,.05);border:1px solid ' + col +
        ';border-radius:7px;padding:3px 9px;margin:4px 6px 0 0;font-size:12px;color:var(--txt);white-space:nowrap">' +
        '<span style="color:' + col + '">' + esc(name) + '</span> ' + num(p, 2) +
        (d !== null ? ' <span style="color:' + (d >= 0 ? "#00e676" : "#ff453a") + ';font-size:11px">' + signed(d, 2, "%") + "</span>" : "") +
        "</span>";
    }

    var story = ["QQQ " + num(spot, 2) +
      (z !== null ? " · stretch z " + signed(z, 2) +
        (Math.abs(z) >= 1.5 ? " (extended)" : Math.abs(z) >= 1 ? " (stretched)" : " (mid-range)") : "")];
    if (has(gx.regime))
      story.push(S.gpos ? "dealers long gamma — flow dampens / pins toward the walls"
                        : "dealers short gamma — flow amplifies moves");
    var micro = [];
    if (dv !== null) micro.push(dv < 0.15 ? "geometry collapsed" : dv < 0.35 ? "geometry thin" : "geometry healthy");
    if (vr2 !== null) micro.push(vr2 > 1.1 ? "trending (VR " + num(vr2, 2) + ")" : vr2 < 0.9 ? "mean-reverting (VR " + num(vr2, 2) + ")" : "random walk");
    if (sp !== null) micro.push("edge " + signed(sp, 1, "pp") + " real−impl");
    if (ok(garch) && has(garch.regime) && has(garch.conditional_vol_pct))
      micro.push(String(garch.regime).toLowerCase() + " " + num(garch.conditional_vol_pct, 1, "%"));
    if (has(vix)) micro.push("VIX " + num(vix, 2));

    var upObj = cw !== null ? cw : (sig !== null ? spot * (1 + sig) : null);
    var downInv = pw !== null ? pw : (sig !== null ? spot * (1 - sig) : null);
    var magnet = oi !== null ? oi : flip;

    return '<div class="qqq-synthesis">' +
      '<div class="qqq-syn-row"><span class="qqq-syn-k">Market story</span><div class="qqq-syn-v">' +
        story.join(" · ") + (micro.length ? '<div class="qqq-syn-sub">' + micro.join(" · ") + "</div>" : "") +
      "</div></div>" +
      '<div class="qqq-syn-row"><span class="qqq-syn-k">Current posture</span><div class="qqq-syn-v">' +
        '<b style="color:' + S.callColor + '">' + esc(S.call) + "</b>" +
        ' <span style="color:var(--dim)">— ' + S.hostile + " hostile · " + S.friendly + " friendly signal" +
        ((S.hostile + S.friendly) === 1 ? "" : "s") + "</span></div></div>" +
      '<div class="qqq-syn-row"><span class="qqq-syn-k">Key levels</span><div class="qqq-syn-v">' +
        tag("Magnet", magnet, "#b388ff") + tag("Flip", flip, "#ffd600") +
        tag("Upside", upObj, "#00e676") + tag("Downside", downInv, "#ff453a") +
        (sig !== null ? tag("+1σ", spot * (1 + sig), "#29b6f6") + tag("−1σ", spot * (1 - sig), "#29b6f6") : "") +
      "</div></div>" +
    "</div>";
  }

  function secQqqOpening(e, chartModel) {
    var body =
      secNasdaqHUD(e, chartModel) +
      '<div class="qqq-top-grid">' +
        '<div class="qqq-primary-chart">' + secQqqTradingChart(e, true, chartModel) + '</div>' +

  // Keep every original long-form card, but plate them inside one master box.
  // Each card retains its own heading/Read folds and collapse-state key; only
  // the redundant outer card shell is removed so the material reads as one flow.
  function qqqDeepItem(html) {
