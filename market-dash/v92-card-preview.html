<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v9.2 Card Preview</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#05020c;color:#f0e9ff;font-family:ui-monospace,Menlo,monospace}
  .wrap{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  h1{font-size:15px;letter-spacing:2px;color:#ff00e5;margin:0}
  .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#a99fd6}
  select,input,button{font:inherit;background:#140b22;color:#f0e9ff;border:1px solid #2a1a4a;border-radius:8px;padding:6px 10px}
  button{cursor:pointer}button.on{border-color:#ff00e5;color:#ff00e5}
  input[type=range]{flex:1;min-width:180px;padding:0}
  .note{font-size:11px;color:#7a6cff}
</style>
</head>
<body>
<div class="wrap">
  <h1>3V3 v9.5 GAME PLAN · PREVIEW</h1>
  <div class="ctl">
    <button id="live">Live (today)</button>
    <span>or replay</span>
    <select id="day"></select>
    <input id="t" type="range" min="-10" max="155" step="1" value="45">
    <span id="tl">7:15</span>
  </div>
  <div id="card"></div>
  <div class="note">Preview only. The Tulip card on the Nasdaq tab is unchanged until you say go.
    Replay mode shows exactly what the card would have shown at that minute, using that morning's real bars and logged quotes.</div>
</div>
<script src="v92_engine.js"></script>
<script src="v92_map.js"></script>
<script src="v92_card.js"></script>
<script>
(function(){
  var el=document.getElementById('card'),day=document.getElementById('day'),t=document.getElementById('t'),tl=document.getElementById('tl'),lv=document.getElementById('live');
  function clk(m){var x=390+Number(m);return ((Math.floor(x/60)+11)%12+1)+':'+String(x%60).padStart(2,'0');}
  function stop(){if(el._v92stop)el._v92stop();}
  var q=new URLSearchParams(location.search);
  fetch('history/index.json?t='+Date.now()).then(function(r){return r.json();}).then(function(ix){
    var days=(ix.days||[]).slice().reverse();
    day.innerHTML=days.map(function(d){return '<option>'+d+'</option>';}).join('');
    if(q.get('day'))day.value=q.get('day');
    if(q.get('at')){var p=q.get('at').split(':').map(Number);t.value=((p[0]<6?p[0]+12:p[0])*60+p[1]-390);}
    if(q.get('day'))replay();else goLive();
  });
  function replay(){stop();lv.classList.remove('on');tl.textContent=clk(t.value);V92CARD.mount(el,{base:'./',day:day.value,at:clk(t.value)});}
  function goLive(){stop();lv.classList.add('on');V92CARD.mount(el,{base:'./'});}
  var deb;t.addEventListener('input',function(){tl.textContent=clk(t.value);clearTimeout(deb);deb=setTimeout(replay,150);});
  day.addEventListener('change',replay);lv.addEventListener('click',goLive);
})();
</script>
</body>
</html>
