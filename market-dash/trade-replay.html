<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>html,body{margin:0;background:#0c0710;color:#eadbe6;}</style>
</head><body>
<!-- ===== BOT TRADE REPLAY: every bot trade (card + options), nightly from the paper log + live from the card ===== -->
<style>
#rp { --bg:#0c0710; --panel:#140c19; --line:#2a1a2f; --grid:rgba(190,150,200,0.08); --fg:#eadbe6; --mute:#9c879a; --accent:#c2479d;
  --up:#38c793; --down:#f0605c; --vwap:#f2b134; --level:#ffffff; --win:#6ee06a; --loss:#ff6b62; --shake:#f2b134; --you:#3fd3ff;
  --cw:#ff7a7a; --pw:#5fd18a; --gf:#f5e663; --yd:#8c7f8c; --s4:#3fd3ff; --s7:#ff9a3c;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  padding:14px 16px 30px; background:var(--bg); color:var(--fg); font-family:var(--display); display:flex; flex-direction:column; gap:12px; }
#rp .hd { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; }
#rp .hd h2 { margin:0; font-size:22px; }
#rp .hd .sub { color:var(--mute); font-size:13px; }
#rp .tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); padding-bottom:8px; }
#rp .tab { font:600 13.5px var(--display); padding:7px 14px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--mute); cursor:pointer; }
#rp .tab[aria-selected="true"] { color:var(--fg); border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent); }
#rp .pane { display:flex; flex-direction:column; gap:12px; }
#rp .pane[hidden] { display:none; }
#rp * { box-sizing:border-box; }
#rp .wrap { display:flex; flex-direction:column; gap:12px; }
#rp .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
#rp .eyebrow { font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--mute); margin:0; }
#rp .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
#rp .kpi { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
#rp .kpi small { font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--mute); }
#rp .kpi b { font:600 20px var(--mono); font-variant-numeric:tabular-nums; }
#rp .kpi span { font-size:11.5px; color:var(--mute); line-height:1.35; }
#rp .pos { color:var(--win); } #rp .neg { color:var(--loss); } #rp .mut { color:var(--mute); }
#rp .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
@media (max-width:900px) { #rp .grid2 { grid-template-columns:minmax(0,1fr); } }
#rp .tbl { overflow-x:auto; }
#rp table { border-collapse:collapse; width:100%; font-size:13px; }
#rp th { text-align:left; font-weight:600; color:var(--mute); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
#rp td { padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
#rp td.n, #rp th.n { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
#rp tr.hl td { background:color-mix(in srgb,var(--accent) 10%,transparent); }
#rp tr.click { cursor:pointer; } #rp tr.click:hover td { background:var(--grid); }
#rp tr.sel td { box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--accent) 16%,transparent); }
#rp .fine { font-size:12px; color:var(--mute); line-height:1.5; margin:0; }
#rp .note { border-left:3px solid var(--accent); padding-left:12px; font-size:13.5px; line-height:1.5; margin:0; }
#rp canvas { width:100%; display:block; }
#rp .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--mute); }
#rp .legend i { display:inline-block; width:14px; height:0; border-top:2.5px solid; margin-right:5px; vertical-align:middle; }
#rp .ev { display:flex; flex-direction:column; gap:8px; }
#rp .evrow { display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr) 70px; gap:8px; align-items:center; font-size:12.5px; }
@media (max-width:640px) { #rp .evrow { grid-template-columns:minmax(0,1fr) 70px; } #rp .evrow > span { grid-row:1; grid-column:1; } #rp .evrow > b { grid-row:1; grid-column:2; text-align:right; } #rp .evrow .bar { grid-row:2; grid-column:1/-1; } }
#rp .bar { height:14px; background:var(--grid); border-radius:3px; position:relative; overflow:hidden; }
#rp .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; }
#rp .mono { font-family:var(--mono); }
#rp .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
#rp .chip { font:600 12.5px var(--display); letter-spacing:0.04em; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
#rp .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
#rp .chip:focus-visible, #rp .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#rp .month { font:700 15px var(--display); letter-spacing:0.06em; margin:4px 0 0; }
#rp .day { display:flex; flex-direction:column; gap:6px; }
#rp .dayhead { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; font-size:13px; border-top:1px solid var(--line); padding-top:8px; }
#rp .dayhead b { font-size:14px; }
#rp .strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:8px; }
/* one month at a time: month tabs, then that month's trades in one sideways-scrolling row */
#rp .mbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
#rp .mtab { font:600 13px var(--display); background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:baseline; }
#rp .mtab small { font:500 11.5px var(--mono); color:var(--mute); }
#rp .mtab[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
#rp .mtab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#rp .strip.h { display:flex; overflow-x:auto; gap:8px; padding-bottom:6px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
#rp .strip.h .card { flex:0 0 178px; scroll-snap-align:start; }
#rp .mhint { font:500 12px var(--mono); color:var(--mute); margin:0; }
#rp .opt30 canvas { height:170px; }
#rp .card { text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px 10px; color:var(--fg); cursor:pointer; display:flex; flex-direction:column; gap:5px; font-family:var(--display); }
#rp .card[aria-current="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
#rp .card .top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; font-size:12.5px; }
#rp .card.tulip { border-style:dashed; border-color:var(--win); }
#rp .card .pnl { font:600 12.5px var(--mono); white-space:nowrap; }
#rp .card canvas { height:64px; }
#rp .tags { display:flex; flex-wrap:wrap; gap:4px; }
#rp .tag { font:600 10.5px var(--display); letter-spacing:0.05em; text-transform:uppercase; padding:2px 6px; border-radius:4px; border:1px solid var(--line); color:var(--mute); }
#rp .tag.bad { color:var(--loss); border-color:currentColor; } #rp .tag.warn { color:var(--shake); border-color:currentColor; } #rp .tag.ok { color:var(--win); border-color:currentColor; }
#rp .tag.tulip { color:var(--win); border-style:dashed; }
#rp .desk { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; align-items:start; scroll-margin-top:8px; }
@media (max-width:680px) { #rp .desk { grid-template-columns:minmax(0,1fr); } }
#rp .main canvas { height:400px; } #rp .opt canvas { height:200px; }
@media (max-width:680px) { #rp .main canvas { height:330px; } }
#rp .ttl { font-size:16px; font-weight:700; margin:0; }
#rp .readout { font:12px var(--mono); color:var(--mute); min-height:18px; overflow-wrap:anywhere; }
#rp .rules { display:grid; grid-template-columns:16px minmax(0,1fr); gap:6px 8px; align-items:baseline; font-size:13px; line-height:1.3; }
#rp .rules .ok { color:var(--win); font-weight:700; } #rp .rules .no { color:var(--loss); font-weight:700; } #rp .rules .na { color:var(--mute); }
#rp .rules .d { display:block; font:11.5px var(--mono); color:var(--mute); overflow-wrap:anywhere; }
#rp .verdict { font-size:15px; font-weight:700; }
#rp .tw { border:1px dashed var(--win); border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.45; }
#rp .tw.miss { border-color:var(--mute); }
</style>
<style>
#rp .live { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; }
#rp .live.on { border-color:var(--win); }
#rp .live .dot { width:9px; height:9px; border-radius:50%; background:var(--mute); display:inline-block; }
#rp .live.on .dot { background:var(--win); box-shadow:0 0 8px var(--win); }
#rp .card.open { border-color:var(--you); }
#rp .tag.live { color:var(--you); border-color:currentColor; }
#rp .tag.opt { color:var(--accent); border-color:currentColor; }
#rp .lchips { display:flex; flex-wrap:wrap; gap:5px; }
#rp .lchip { font:600 11.5px var(--display); padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--mute); cursor:pointer; }
#rp .lchip[aria-pressed="true"] { color:var(--fg); border-color:var(--accent); background:color-mix(in srgb,var(--accent) 18%,transparent); }
#rp .lchip i { display:inline-block; width:10px; height:0; border-top:2.5px solid; margin-right:5px; vertical-align:middle; }
</style>
<div id="rp">
  <div class="hd"><h2>Trade Replay</h2><span class="sub">Every trade the bot made, on the chart, checked against its own rules · today's trades appear live</span></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-p="chart" aria-selected="true">Chart room</button><button class="tab" role="tab" data-p="sum" aria-selected="false">Summary</button></div>
  <div class="wrap" id="rp-wrap"><p class="fine" id="rp-load">Loading the bot's trades…</p></div>
</div>
<script src="v92_engine.js"></script>
<script src="v92_map.js"></script>
<script src="v95_options.js"></script>
<script src="hiv_layer.js"></script>
<script src="v92_card.js"></script>
<script>
(function () {
  var det = document.getElementById('rp');
  var s = document.createElement('script'); s.src = 'bot_replay.js?t=' + Date.now();
  s.onload = function () { try { rpInit(window.BOTREPLAY); } catch (e) { document.getElementById('rp-load').textContent = 'Could not draw the replay: ' + e.message; } };
  s.onerror = function () { document.getElementById('rp-load').textContent = 'Replay data file (bot_replay.js) is missing.'; };
  document.head.appendChild(s);

  function rpInit(R) {
    var root = det, css = function (n) { return getComputedStyle(root).getPropertyValue(n).trim(); };
    var usd = function (v) { v = v || 0; return (v < 0 ? '−$' : '+$') + Math.round(Math.abs(v)).toLocaleString('en-US'); };
    var cl = function (v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'mut'; };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var pt = function (m) { var t = 390 + Math.floor(m), h = Math.floor(t / 60); return ((h - 1) % 12 + 1) + ':' + String(t % 60).padStart(2, '0'); };
    var q2 = function (v) { return v == null || !isFinite(v) ? '—' : Number(v).toFixed(2); };
    var mname = function (m) { return new Date(m + '-15T12:00:00Z').toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }); };
    var mmdd = function (d) { return new Date(d + 'T12:00:00Z').toLocaleString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); };
    var LAB = { trap: 'Trap', gap: 'Gap-and-go', fw: 'Fade the week', vb: 'VIX bounce', 'failed poke (B)': 'Failed poke', fp: 'Failed poke', flip: 'Flip',
      'box scalp': 'Box', 'Playbook home run': 'Playbook', 'Tulip v3.2': 'Tulip', 'turn entry': 'Turn entry', sniper: 'Sniper', 'calls checkpoint': 'Calls checkpoint' };
    var lab = function (c) { var s = c.setup || ''; if (s.indexOf('re-') === 0) return 'Re-entry (' + (LAB[s.slice(3)] || s.slice(3)) + ')'; return LAB[s] || s; };
    var WHY = { stop: 'stopped', 'trail (3 ticks)': 'trail', trail: 'trail', 'time exit': 'time exit', time: 'time exit', target: 'target', 'broke box': 'broke the box', crossback: 'back through red 304',
      'hit 304': 'reached red 304', 'gave way to a v9.2 setup': 'gave way', open: 'open', yield: 'gave way' };
    var why = function (c) { return WHY[c.why] || c.why || ''; };
    var C = [], DAYS = R.days, DAILY = [], LIVE = null;
    function rebuild() {
      C = R.cards.slice(); DAILY = R.daily.slice();
      if (LIVE) { LIVE.cards.forEach(function (c) { C.push(c); }); DAILY.push(LIVE.daily); DAYS[LIVE.date] = LIVE.day; delete LIVE.day.L; }
      C.forEach(function (c) { c.id = c.date + '|' + c.src + '|' + c.setup + '|' + c.side + '|' + c.strike + '|' + c.m; c.weekday = DAYS[c.date].weekday; c.time_pt = pt(c.m); });
    }
    rebuild();
    // ---- your 9 lines, rebuilt in the page from each morning's seed (the EMA after the 3 prior sessions) ----
    var LINES = [[8, '#7CFF6B', 'g'], [14, '#4FD44A', 'g'], [35, '#2E9B3A', 'g'], [52, '#F5E663', 'y'], [80, '#C9B840', 'y'], [120, '#FF9A3C', 'o'], [250, '#FF8A80', 'r'], [304, '#FF4D4D', 'r'], [400, '#B23A36', 'r']];
    function linesOf(D) { if (D.L) return D.L; D.L = {}; LINES.forEach(function (q) { var n = q[0], a = 2 / (n + 1), e = D.seed && D.seed[n] != null ? D.seed[n] : null;
      D.L[n] = D.candles.map(function (k) { e = e === null ? k[3] : a * k[3] + (1 - a) * e; return e; }); }); return D.L; }
    var LT = { core: true, g: false, y: false, o: false, r: false, va: true, gex: true };
    try { var sv = JSON.parse(localStorage.getItem('rp-lines') || 'null'); if (sv) Object.keys(LT).forEach(function (k) { if (typeof sv[k] === 'boolean') LT[k] = sv[k]; }); } catch (e) {}
    var LCH = [['core', 'Green 8 + red 304', '#7CFF6B'], ['g', 'Green 14 / 35', '#4FD44A'], ['y', 'Yellow 52 / 80', '#F5E663'], ['o', 'Orange 120', '#FF9A3C'], ['r', 'Red 250 / 400', '#FF8A80'], ['va', 'Value area', '#9c879a'], ['gex', 'GEX walls', '#ff7a7a']];
    var lineOn = function (n) { return n === 8 || n === 304 ? LT.core : n === 14 || n === 35 ? LT.g : n === 52 || n === 80 ? LT.y : n === 120 ? LT.o : LT.r; };

    var html = '<div class="pane" data-p="chart"><div class="live" id="rp-live"><span class="dot"></span><span id="rp-live-t">Checking for a live morning…</span></div>';
    html += '<div class="chips" id="rp-f"></div><div id="rp-strip"></div>' +
      '<div class="desk" id="rp-desk"><section class="panel main"><p class="ttl" id="rp-title"></p><div class="lchips" id="rp-lines"></div><canvas id="rp-main"></canvas>' +
      '<p class="readout" id="rp-main-r">Hover the chart for a minute.</p>' +
      '<div class="legend"><span><i style="border-color:var(--vwap)"></i>VWAP</span><span>Your lines: green 8/14/35 · yellow 52/80 · orange 120 · red 250/304/400</span><span><i style="border-color:var(--cw)"></i>Call wall</span><span><i style="border-color:var(--pw)"></i>Put wall</span><span><i style="border-color:var(--gf)"></i>Gamma flip</span>' +
      '<span><i style="border-color:var(--yd);border-top-style:dashed"></i>Yesterday H/L/C</span><span>▒ yesterday\'s value area</span><span><i style="border-color:var(--level);border-top-style:dashed"></i>Trap line</span><span><i style="border-color:var(--accent);border-top-style:dashed"></i>Trade level (box / bounce level / fake-out)</span><span>▲ bot buy · ▼ bot sell · ● other bot trades</span></div></section>' +
      '<aside class="panel"><p class="eyebrow">The contract</p><p class="ttl" id="rp-opt-t"></p><div class="opt"><canvas id="rp-opt"></canvas></div><p class="fine" id="rp-opt-n"></p><p class="eyebrow" style="margin-top:4px">30-min candles · this contract, 6:30 →</p><div class="opt30"><canvas id="rp-opt30"></canvas></div><p class="fine" id="rp-opt30-n"></p><div id="rp-side" style="display:flex;flex-direction:column;gap:10px"></div></aside></div>';
    html += '</div><div class="pane" data-p="sum" hidden><div class="kpis" id="rp-kpis"></div>' +
      '<div class="grid2"><section class="panel"><p class="eyebrow">Every morning · card vs options · tap a day</p><div class="tbl"><table id="rp-daily"></table></div><p class="fine" id="rp-daily-n"></p></section>' +
      '<section class="panel"><p class="eyebrow">Running total</p><canvas id="rp-cum" style="height:240px"></canvas>' +
      '<div class="legend"><span><i style="border-color:var(--win)"></i>Card + options</span><span><i style="border-color:var(--you)"></i>Card (as sized)</span><span><i style="border-color:var(--shake);border-top-style:dashed"></i>Card at 1 contract</span></div>' +
      '<p class="readout" id="rp-cum-r">Hover the chart for a day.</p></section></div>' +
      '<div class="grid2"><section class="panel"><p class="eyebrow">Scoreboard · by setup</p><div class="tbl"><table id="rp-rules"></table></div></section>' +
      '<section class="panel"><p class="eyebrow">How trades ended · P&amp;L by exit</p><div class="ev" id="rp-leaks"></div><p class="note" id="rp-lesson"></p></section></div>' +
      '<p class="fine" id="rp-built"></p></div>';
    document.getElementById('rp-wrap').innerHTML = html;
    function showPane(p) {
      document.querySelectorAll('#rp .tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.p === p ? 'true' : 'false'); });
      document.querySelectorAll('#rp .pane').forEach(function (x) { x.hidden = x.dataset.p !== p; });
      if (p === 'sum') { summary(); cum(); } else { strip(); if (sel.card) { drawMain(); drawOpt(); } }
    }
    document.querySelectorAll('#rp .tab').forEach(function (b) { b.addEventListener('click', function () { showPane(b.dataset.p); }); });
    document.getElementById('rp-lines').innerHTML = LCH.map(function (q) { return '<button class="lchip" data-k="' + q[0] + '" aria-pressed="' + LT[q[0]] + '"><i style="border-color:' + q[2] + '"></i>' + q[1] + '</button>'; }).join('');
    document.querySelectorAll('#rp-lines .lchip').forEach(function (b) { b.addEventListener('click', function () { LT[b.dataset.k] = !LT[b.dataset.k]; b.setAttribute('aria-pressed', LT[b.dataset.k]); try { localStorage.setItem('rp-lines', JSON.stringify(LT)); } catch (e) {} drawMain(); }); });

    // ---------- filters + strip (newest month first) ----------
    var FILT = [['all', 'All'], ['win', 'Wins'], ['loss', 'Losses'], ['open', 'Open now'], ['card', 'Card'], ['option', 'Options'], ['Trap', 'Trap'], ['Gap-and-go', 'Gap-and-go'], ['Fade the week', 'Fade the week'],
      ['VIX bounce', 'VIX bounce'], ['Failed poke', 'Failed poke'], ['flipre', 'Flip / re-entry'], ['Box', 'Box'], ['Playbook', 'Playbook'], ['Tulip', 'Tulip'], ['Turn entry', 'Turn entry'], ['Sniper', 'Sniper'],
      ['Calls checkpoint', 'Calls checkpoint'], ['flipped', 'Flipped options'], ['stopped', 'Stopped']];
    var filter = 'all';
    var fOk = function (c, f) { f = f || filter; var L = lab(c); return f === 'all' || (f === 'win' ? c.pnl > 0 && c.why !== 'open' : f === 'loss' ? c.pnl <= 0 && c.why !== 'open' : f === 'open' ? c.why === 'open' : f === 'card' || f === 'option' ? c.src === f :
      f === 'flipre' ? (L === 'Flip' || L.indexOf('Re-entry') === 0) : f === 'flipped' ? c.how === 'flip' : f === 'stopped' ? c.why === 'stop' : L === f); };
    function chips() {
      document.getElementById('rp-f').innerHTML = FILT.map(function (f) { var n = C.filter(function (c) { return fOk(c, f[0]); }).length;
        return '<button class="chip" data-f="' + f[0] + '" aria-pressed="' + (f[0] === filter) + '"' + (n || f[0] === 'all' ? '' : ' hidden') + '>' + f[1] + ' · ' + n + '</button>'; }).join('');
      document.querySelectorAll('#rp-f .chip').forEach(function (b) { b.addEventListener('click', function () { filter = b.dataset.f; document.querySelectorAll('#rp-f .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); strip(); }); });
    }
    function tagsOf(c) { var t = [];
      t.push('<span class="tag ' + (c.src === 'option' ? 'opt' : '') + '">' + esc(lab(c)) + '</span>');
      if (c.src === 'option') t.push('<span class="tag opt">' + (c.how === 'flip' ? 'option · flipped' : c.how === 'agree' ? 'option · with card' : 'option · box first') + '</span>');
      if (c.ct > 1) t.push('<span class="tag">' + c.ct + '×</span>');
