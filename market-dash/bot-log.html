<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Paper Log</title>
<!-- Nov 18: the bot's paper trades from v92_log (written nightly by v92_paper_log.js) — live mornings (Nov 2+, never seen by the
     research) next to the backtested ones, per layer, plus every trade. Read-only: nothing here changes the bot. -->
<style>
:root{--bg:#0c0710;--panel:#140c18;--line:rgba(176,64,143,.28);--fg:#ecdce8;--mute:rgba(220,190,210,.72);--up:#00e5cc;--down:#ff4d5e;--acc:#ff2be0;--gold:#f5c542;--font:ui-monospace,SFMono-Regular,Menlo,monospace}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font)}
.wrap{padding:14px 16px 40px;max-width:1200px}
h2{font-size:12px;letter-spacing:.14em;color:var(--acc);margin:18px 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:11.5px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.06em}
td:first-child,th:first-child{text-align:left}
th.grp{color:var(--gold);text-align:center;border-bottom:1px solid var(--line)}
.pos{color:var(--up)}.neg{color:var(--down)}.dim{color:var(--mute)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;margin-right:6px;border:1px solid var(--line)}
.L-card{color:#ffd166;border-color:rgba(255,209,102,.4)}.L-v95{color:#ff9a3c;border-color:rgba(255,154,60,.4)}.L-opt{color:#3fd3ff;border-color:rgba(63,211,255,.4)}
.L-hiv{color:#ff7ac8;border-color:rgba(255,122,200,.4)}.L-bf{color:#7cff6b;border-color:rgba(124,255,107,.4)}.L-v10{color:#ffffff;border-color:rgba(255,255,255,.5);background:rgba(255,43,224,.18)}.L-v11{color:#0c0710;border-color:#f5c542;background:#f5c542}.L-duo{color:#0c0710;border-color:#4df0ff;background:#4df0ff}.L-vol{color:#0c0710;border-color:#b388ff;background:#b388ff}
.day{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:6px 0;padding:8px 10px}
.day .hd{display:flex;justify-content:space-between;gap:10px}
.day .hd b{font-weight:600}
.tr{display:grid;grid-template-columns:90px 120px 1fr 80px;gap:8px;padding:4px 0 0;font-size:12px}
.tr span:last-child{text-align:right}
.verdict{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0 4px;background:var(--panel);font-size:12px}
details>summary{cursor:pointer;color:var(--mute);font-size:12px;margin:10px 0}
.scroll{overflow-x:auto}
</style></head><body><div class="wrap" id="app">Loading the bot's paper log…</div>
<script>
(function(){
var LAYERS=[
  {k:'card',name:'Card (v9.2)',cls:'L-card',trades:function(d){return d.trades||[];},usd:function(t){return t.usd;}},
  {k:'v95',name:'v9.5 (sized)',cls:'L-v95',trades:function(d){return (d.shadow_v95&&d.shadow_v95.trades)||[];},usd:function(t){return t.usd*(t.contracts||1);}},
  {k:'opt',name:'Options add-ons',cls:'L-opt',trades:function(d){return (d.shadow_options&&d.shadow_options.trades)||[];},usd:function(t){return t.usd*(t.contracts||1);}},
  {k:'hiv',name:'High-IV layer',cls:'L-hiv',trades:function(d){return (d.shadow_hiv&&d.shadow_hiv.trades)||[];},usd:function(t){return t.usd;}},
  {k:'bf',name:'Big-fish layer',cls:'L-bf',trades:function(d){return (d.shadow_bigfish&&d.shadow_bigfish.trades)||[];},usd:function(t){return t.usd;}},
  {k:'v10',name:'v10 auction',cls:'L-v10',trades:function(d){return (d.shadow_v10&&d.shadow_v10.trades)||[];},usd:function(t){return t.usd;}},
  {k:'v11',name:'v11 regime',cls:'L-v11',trades:function(d){return (d.shadow_v11&&d.shadow_v11.trades)||[];},usd:function(t){return t.usd;}},
  {k:'vol',name:'Volume layer',cls:'L-vol',trades:function(d){return (d.shadow_vol&&d.shadow_vol.trades)||[];},usd:function(t){return t.usd;}},
  {k:'combo',name:'Combo v9.2+v11+vol +add +lotto',cls:'L-duo',trades:function(d){return (d.shadow_duo&&d.shadow_duo.legs)||[];},usd:function(t){return t.usd;}}];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function usd(v){v=Math.round(v);return (v<0?'−$':'+$')+Math.abs(v).toLocaleString();}
function cl(v){return v>0.5?'pos':v<-0.5?'neg':'dim';}
var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],W=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function day(d){var t=new Date(d+'T12:00:00');return W[t.getDay()]+' '+M[t.getMonth()]+' '+t.getDate();}
function tellHeight(){}
fetch('v92_log/index.json?t='+Date.now()).then(function(r){return r.json();}).then(function(ix){
  var dates=ix.days.map(function(r){return r.date;}),fwdFrom=ix.forward_from||'2026-11-02';
  return Promise.all(dates.map(function(d){return fetch('v92_log/'+d+'.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});})).then(function(D){render(ix,D.filter(Boolean),fwdFrom);});
}).catch(function(e){document.getElementById('app').textContent='Could not load the paper log ('+e+').';});
function stats(D,L){
  var tr=[],days=0,bestDay=0,worstDay=0;
  D.forEach(function(d){var T=L.trades(d);if(T.length){days++;var s=0;T.forEach(function(t){var u=L.usd(t);tr.push(u);s+=u;});bestDay=Math.max(bestDay,s);worstDay=Math.min(worstDay,s);}});
  var tot=tr.reduce(function(a,b){return a+b;},0),w=tr.filter(function(u){return u>0.5;}).length;
  return {mornings:D.length,days:days,n:tr.length,w:w,tot:tot,avg:tr.length?tot/tr.length:0,wr:tr.length?100*w/tr.length:0,worst:worstDay,best:bestDay};
}
function render(ix,D,fwdFrom){
  var BT=D.filter(function(d){return d.date<fwdFrom;}),LV=D.filter(function(d){return d.date>=fwdFrom;});
  var h='<h2>BOT PAPER LOG · LIVE VS BACKTEST</h2><p class="sub">Live = mornings from '+day(fwdFrom)+' on, which the research never saw. Backtest = '+day(BT[0]?BT[0].date:'')+' – '+day(BT.length?BT[BT.length-1].date:'')+'. 1 contract unless the layer sizes up. Written nightly; last update '+esc((ix.updated_utc||'').slice(0,16).replace('T',' '))+' UTC.</p>';
  h+='<div class="scroll"><table><tr><th></th><th class="grp" colspan="5">BACKTEST · '+BT.length+' mornings</th><th class="grp" colspan="5">LIVE · '+LV.length+' mornings</th></tr>'+
     '<tr><th>Layer</th><th>trades</th><th>win %</th><th>avg / trade</th><th>total</th><th>worst day</th><th>trades</th><th>win %</th><th>avg / trade</th><th>total</th><th>worst day</th></tr>';
  var verdicts=[];
  LAYERS.forEach(function(L){var b=stats(BT,L),l=stats(LV,L);
    h+='<tr><td><span class="tag '+L.cls+'">'+L.name+'</span></td>'+
      '<td>'+b.n+'</td><td>'+(b.n?b.wr.toFixed(0)+'%':'—')+'</td><td class="'+cl(b.avg)+'">'+(b.n?usd(b.avg):'—')+'</td><td class="'+cl(b.tot)+'">'+(b.n?usd(b.tot):'—')+'</td><td class="'+cl(b.worst)+'">'+(b.n?usd(b.worst):'—')+'</td>'+
      '<td>'+l.n+'</td><td>'+(l.n?l.wr.toFixed(0)+'%':'—')+'</td><td class="'+cl(l.avg)+'">'+(l.n?usd(l.avg):'—')+'</td><td class="'+cl(l.tot)+'">'+(l.n?usd(l.tot):'—')+'</td><td class="'+cl(l.worst)+'">'+(l.n?usd(l.worst):'—')+'</td></tr>';
    var txt;
    if(!l.n) txt='no live trades yet';
    else if(l.n<5) txt='only '+l.n+' live trade'+(l.n>1?'s':'')+' — too few to judge';
    else if(l.avg>=b.avg*0.5&&l.avg>0) txt='tracking the backtest';
    else if(l.avg>0) txt='positive but well below the backtest';
    else txt='losing live while the backtest made '+usd(b.avg)+' a trade';
    verdicts.push('<span class="tag '+L.cls+'">'+L.name+'</span>'+txt+(l.n?' · live '+l.w+' of '+l.n+' won':''));
  });
  h+='</table></div><div class="verdict">'+verdicts.join('<br>')+'</div>';
  // Nov 21: v10 is judged against random entries with the same contract + exits (a signal only has edge if it beats them)
  function vb(S){var a=0,b=0,n=0;S.forEach(function(d){if(d.shadow_v10&&!d.shadow_v10.skip){a+=d.shadow_v10.usd||0;b+=d.shadow_v10.baseline_usd||0;n++;}});return {v:a,b:b,n:n};}
  var vB=vb(BT),vL=vb(LV);
  function vb11(S){var a=0,n=0,m={};S.forEach(function(d){var v=d.shadow_v11;if(v&&!v.skip){a+=v.usd||0;n++;var k=v.regime?v.regime.name:'?';m[k]=(m[k]||0)+1;}});return {v:a,n:n,m:m};}
  var wB=vb11(BT),wL=vb11(LV);
  if(wB.n||wL.n) h+='<div class="verdict"><span class="tag L-v11">v11 regime</span>v10 + the master switch (last evening\u2019s VIX change + GARCH: vol release / fast vol bid → follow the opening-range break; vol stall / calm vol bid → fade the failed break) · backtest <span class="'+cl(wB.v)+'">'+usd(wB.v)+'</span> vs v10 '+usd(vB.v)+' · live <span class="'+cl(wL.v)+'">'+usd(wL.v)+'</span> vs v10 '+usd(vL.v)+'. Built Nov 22 from these same mornings — forward test from Mon Nov 23.</div>';
  // Nov 22: combo = old bot + v11 + add-ons, scored four ways, plus each bot's self-check
  var duoFrom='2026-11-23';
  function vd(S){var o={combo:0,lotto:0,add:0,both:0,n:0,cash:0};S.forEach(function(d){var u=d.shadow_duo;if(u){o.n++;['combo','lotto','add','both'].forEach(function(k){o[k]+=u.usd[k]||0;});o.cash=Math.max(o.cash,(u.max_cash||{}).both||0);}});return o;}
  var dB=vd(D.filter(function(d){return d.date<duoFrom;})),dL=vd(D.filter(function(d){return d.date>=duoFrom;}));
  var lastDuo=null;D.forEach(function(d){if(d.shadow_duo)lastDuo=d.shadow_duo;});
  function sc(x){return x?(x.on?'<span class="pos">ON</span>':'<span class="neg">SITTING OUT</span>')+' <span class="dim">('+esc(x.why)+')</span>':'—';}
  function four(o){return 'combo <span class="'+cl(o.combo)+'">'+usd(o.combo)+'</span> · +lotto <span class="'+cl(o.lotto)+'">'+usd(o.lotto)+'</span> · +add <span class="'+cl(o.add)+'">'+usd(o.add)+'</span> · +both <span class="'+cl(o.both)+'">'+usd(o.both)+'</span>';}
  if(dB.n||dL.n) h+='<div class="verdict"><span class="tag L-duo">Combo</span>old bot (v9.2) + new bot (v11) + volume layer (gap breaks + confirmed node bounces, added Nov 22) every morning, opposite sides allowed; when a trade hits +$0.30 it ADDS +1 contract and buys a $0.30–0.80 LOTTO, both sold with the main trade (the table row = +both).<br>Built Nov 22 ('+dB.n+' mornings, in-sample): '+four(dB)+' · most cash at once '+usd(dB.cash).replace('+','')+'<br>Forward from Mon Nov 23 ('+dL.n+' mornings): '+(dL.n?four(dL):'<span class="dim">starts Monday</span>')+'<br>Self-check now — old bot: '+sc(lastDuo&&lastDuo.self_check.old)+' · new bot: '+sc(lastDuo&&lastDuo.self_check.new)+' · volume layer: '+sc(lastDuo&&lastDuo.self_check.vol)+'</div>';
  if(vB.n||vL.n) h+='<div class="verdict"><span class="tag L-v10">v10 auction</span>vs random entries with the same exits · backtest <span class="'+cl(vB.v)+'">'+usd(vB.v)+'</span> vs random <span class="'+cl(vB.b)+'">'+usd(vB.b)+'</span> ('+vB.n+' mornings) · live <span class="'+cl(vL.v)+'">'+usd(vL.v)+'</span> vs random <span class="'+cl(vL.b)+'">'+usd(vL.b)+'</span> ('+vL.n+' mornings). <b>Built Nov 21 from these November mornings, so they are not a fair test</b> — its real forward test starts Mon Nov 23. Paper only — the card does not trade it.</div>';
  // live log
  function dayBox(d){
    var rows=[],per=[];
    LAYERS.forEach(function(L){var ls=0,ln=0;L.trades(d).forEach(function(t){var u=L.usd(t);ls+=u;ln++;
      rows.push('<div class="tr"><span><span class="tag '+L.cls+'">'+L.k+'</span></span><span>'+esc(t.filled||t.signal||'')+' → '+esc(t.exit||'')+'</span><span>'+esc(t.side||'')+' '+esc(t.strike||'')+((t.contracts||1)>1?' ×'+t.contracts:'')+' · '+(t.paid!=null?Number(t.paid).toFixed(2):'')+' → '+(t.sold!=null?Number(t.sold).toFixed(2):'')+' · <span class="dim">'+esc(t.setup||t.rule||'')+(t.why?' · '+esc(t.why):'')+'</span></span><span class="'+cl(u)+'">'+usd(u)+'</span></div>');});if(ln)per.push('<span class="tag '+L.cls+'">'+L.k+' <span class="'+cl(ls)+'">'+usd(ls)+'</span></span>');});
    var rg=d.shadow_v11&&d.shadow_v11.regime?' <span class="dim" style="font-weight:400">· '+esc(d.shadow_v11.regime.name)+' ('+(d.shadow_v11.regime.vix_change>=0?'+':'')+Number(d.shadow_v11.regime.vix_change).toFixed(1)+'% VIX)</span>':'';
    return '<div class="day"><div class="hd"><b>'+day(d.date)+rg+'</b><span>'+(rows.length?per.join(''):'<span class="dim">no trades</span>')+'</span></div>'+rows.join('')+'</div>';
  }
  h+='<h2>LIVE MORNINGS · EVERY TRADE</h2><p class="sub">Newest first. Day totals are per layer (v9.5 already includes the card trades, so they do not add up). v10 = opening-range break · new-extreme break · pop with the 20-min candle (high-vol only). combo lines repeat the old-bot and v11 trades plus their ADD and LOTTO legs. Each line: layer · fill → exit time (PT) · contract · paid → sold · setup / why it closed · $.</p>'+LV.slice().reverse().map(dayBox).join('');
  h+='<details><summary>Backtested mornings ('+BT.length+') · every trade</summary>'+BT.slice().reverse().map(dayBox).join('')+'</details>';
  document.getElementById('app').innerHTML=h+'<div id="lv"></div>'; tellHeight();
  // Nov 22: YOUR LEVELS — the user's weekly volume-profile lines scored nightly vs the site's levels and random lines (paper only)
  fetch('levels_log.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(L){if(!L||!L.weeks||!L.weeks.length)return;
    var w=L.weeks[L.weeks.length-1],pct=function(o){return o&&o.touches?o.held_pct+'% held <span class="dim">('+o.held+' of '+o.touches+' · avg move $'+o.avg_move.toFixed(2)+')</span>':'<span class="dim">not reached yet</span>';};
    var CC={blue:'#4da3ff',yellow:'#f5c542',red:'#ff5a5a','orange dashed':'#ff8a2a'};
    var sw=function(c){return '<span style="display:inline-block;width:18px;border-top:3px '+(c.indexOf('dashed')>=0?'dashed':'solid')+' '+(CC[c]||'#aaa')+';vertical-align:middle;margin-right:6px"></span>';};
    var x='<h2>YOUR LEVELS · WEEK OF '+day(w.week).toUpperCase()+'</h2><p class="sub">Your volume-profile lines, scored every night on QQQ\u2019s 1-min bars (paper only — the card and your live trading never read them). A touch = within $0.25 after price was R away (R = 10% of the 10-day average range). Held = it bounced R back the way it came within 60 min; broke = it closed R through. '+(w.days.length?w.days.length+' trading day'+(w.days.length>1?'s':'')+' scored so far.':'First scores after Monday\u2019s close.')+'</p>';
    x+='<div class="verdict"><b>The bar to beat:</b> random lines drawn anywhere in the last 5 days\u2019 range held '+L.random_all.held_pct+'% of touches; the site\u2019s own levels (yesterday H/L/C, value area, walls, flip) held '+L.site_all['ALL site levels'].held_pct+'% since July. A level has an edge only if it holds clearly more than random.<br>This week — yours: '+pct(w.mine)+' · site levels: '+pct(w.site)+' · random: '+pct(w.random)+'</div>';
    var cols=Object.keys(w.byColor);
    if(cols.length) x+='<div class="scroll"><table><tr><th>Color group</th><th>touches</th><th>held</th><th>broke</th><th>chop</th><th>held %</th><th>avg move</th></tr>'+cols.map(function(k){var o=w.byColor[k];return '<tr><td>'+sw(k)+esc(k)+'</td><td>'+o.touches+'</td><td>'+o.held+'</td><td>'+o.broke+'</td><td>'+o.chop+'</td><td>'+(o.touches?o.held_pct+'%':'—')+'</td><td>'+(o.touches?'$'+o.avg_move.toFixed(2):'—')+'</td></tr>';}).join('')+'</table></div>';
    x+='<div class="scroll"><table><tr><th>Level</th><th>group</th><th>touches</th><th>what happened</th><th>closest</th></tr>'+w.levels.slice().sort(function(a,b){return b.px-a.px;}).map(function(l){
      var t=l.touches.map(function(q){return '<span class="'+(q.res==='held'?'pos':q.res==='broke'?'neg':'dim')+'">'+esc(q.day.slice(5)+' '+q.t+' from '+q.from+' · '+q.res+' · $'+q.move.toFixed(2))+'</span>';}).join('<br>');
      return '<tr><td><b>'+l.px.toFixed(2)+'</b></td><td>'+sw(l.color)+esc(l.color)+'</td><td>'+l.touches.length+'</td><td>'+(t||'<span class="dim">—</span>')+'</td><td>'+(l.closest==null?'—':l.closest===0?'touched':'$'+l.closest.toFixed(2))+'</td></tr>';}).join('')+'</table></div>';
    // the bot's own weekly volume levels (built from the 20 sessions before each Monday), scored since August
    if(L.bot_all&&L.bot_weeks&&L.bot_weeks.length){var BA=L.bot_all,bw=L.bot_weeks[L.bot_weeks.length-1],nW=L.bot_weeks.filter(function(q){return q.days.length;}).length;
      x+='<h2>THE BOT\u2019S VOLUME LEVELS · '+nW+' WEEKS SCORED</h2><p class="sub">Every week the bot saves its own levels from the volume profile of the 20 sessions before that Monday (no look-ahead): POC, value area high / low, the 10 biggest volume nodes and the 10 thinnest gaps. Same scoring as yours, vs random lines on the same days.</p>'+
        '<div class="scroll"><table><tr><th>Level type</th><th>touches</th><th>held</th><th>broke</th><th>held %</th><th>broke %</th><th>avg move</th></tr>'+Object.keys(BA).concat(['random']).map(function(k){var o=k==='random'?L.bot_random:BA[k];return '<tr><td>'+(k==='random'?'<span class="dim">random lines (same days)</span>':esc(k))+'</td><td>'+o.touches+'</td><td>'+o.held+'</td><td>'+o.broke+'</td><td>'+(o.touches?o.held_pct+'%':'—')+'</td><td>'+(o.touches?Math.round(100*o.broke/o.touches)+'%':'—')+'</td><td>'+(o.touches?'$'+o.avg_move.toFixed(2):'—')+'</td></tr>';}).join('')+'</table></div>'+
        '<details><summary>The bot\u2019s levels for the week of '+esc(day(bw.week))+' (from '+esc(bw.from.slice(5))+' – '+esc(bw.to.slice(5))+')</summary><div class="verdict">'+['POC','value area high','value area low','volume node','thin gap'].map(function(tp){var v=bw.levels.filter(function(l){return l.type===tp;});return v.length?'<b>'+esc(tp)+':</b> '+v.map(function(l){return l.px.toFixed(2)+(l.touches.length?' <span class="'+(l.touches.filter(function(q){return q.res==='held';}).length>=l.touches.filter(function(q){return q.res==='broke';}).length?'pos':'neg')+'">('+l.touches.length+'×)</span>':'');}).join(' · '):'';}).filter(Boolean).join('<br>')+'</div></details>';}
    var S=L.site_all;x+='<details><summary>The site\u2019s own levels since July (baseline)</summary><div class="scroll"><table><tr><th>Level</th><th>touches</th><th>held %</th><th>avg move</th></tr>'+Object.keys(S).map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+S[k].touches+'</td><td>'+S[k].held_pct+'%</td><td>$'+S[k].avg_move.toFixed(2)+'</td></tr>';}).join('')+'<tr><td>random lines</td><td>'+L.random_all.touches+'</td><td>'+L.random_all.held_pct+'%</td><td>$'+L.random_all.avg_move.toFixed(2)+'</td></tr></table></div></details>';
    document.getElementById('lv').innerHTML=x; tellHeight();
    // the saved volume profile (20 sessions) with your lines on it
    fetch('vprofile.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(V){if(!V||!V.composite)return;
      var P=V.composite,LV=(V.levels||[]).filter(function(q){return q.week===w.week;})[0],M={};(LV?LV.levels:[]).forEach(function(l){M[l.px]=l;});
      var agg=[],k=4;for(var i=0;i<P.vol.length;i+=k){var s2=0;for(var j=i;j<Math.min(P.vol.length,i+k);j++)s2+=P.vol[j];agg.push([P.lo+i*P.step,s2]);}
      var mx=Math.max.apply(null,agg.map(function(a){return a[1];})),lo=P.lo,hi=P.hi+P.step,H=Math.max(360,Math.min(900,Math.round((hi-lo)*6))),W=560,Y=function(px){return 10+(hi-px)/(hi-lo)*(H-20);},bh=Math.max(1,(H-20)/agg.length-0.5);
      var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:720px;background:#0c0710;border:1px solid rgba(255,255,255,.12);border-radius:8px">';
      agg.forEach(function(a){var inVA=a[0]>=P.va[0]&&a[0]<=P.va[1];g+='<rect x="70" y="'+(Y(a[0]+k*P.step)).toFixed(1)+'" width="'+(a[1]/mx*300).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+(inVA?'rgba(160,140,255,.55)':'rgba(160,140,255,.25)')+'"/>';});
      for(var t=Math.ceil(lo/10)*10;t<=hi;t+=10)g+='<text x="4" y="'+(Y(t)+4).toFixed(1)+'" fill="#8a7d92" font-size="11" font-family="monospace">'+t+'</text>';
      g+='<line x1="70" x2="380" y1="'+Y(P.poc).toFixed(1)+'" y2="'+Y(P.poc).toFixed(1)+'" stroke="#fff" stroke-width="1" stroke-dasharray="2 2"/><text x="384" y="'+(Y(P.poc)+4).toFixed(1)+'" fill="#fff" font-size="11">POC '+P.poc.toFixed(2)+'</text>';
      w.levels.forEach(function(l){if(l.px<lo||l.px>hi)return;var y=Y(l.px).toFixed(1),c=CC[l.color]||'#aaa',m=M[l.px]||{};g+='<line x1="70" x2="'+(W-150)+'" y1="'+y+'" y2="'+y+'" stroke="'+c+'" stroke-width="2"'+(l.color.indexOf('dashed')>=0?' stroke-dasharray="6 4"':'')+'/><text x="'+(W-146)+'" y="'+(+y+4)+'" fill="'+c+'" font-size="11">'+l.px.toFixed(2)+(m.pct_20d!=null?' · vol '+m.pct_20d+'%':'')+'</text>';});
      g+='</svg>';
      var t2='<h2>VOLUME PROFILE · LAST 20 SESSIONS ('+day(P.from).toUpperCase()+' – '+day(P.to).toUpperCase()+')</h2><p class="sub">Saved every night from the site\u2019s 1-min candles (each bar\u2019s volume spread over its range, $0.25 steps). Bars = volume at that price; brighter = the 70% value area. Your lines are drawn on it; \u201cvol %\u201d = how heavy that price is in this profile (100 = the heaviest price, 0 = almost nothing traded).</p>'+
        '<div class="verdict">POC '+P.poc.toFixed(2)+' · value area '+P.va[0].toFixed(2)+'–'+P.va[1].toFixed(2)+'<br>Biggest nodes: '+P.nodes.map(function(v){return v.toFixed(2);}).join(' · ')+'<br>Thinnest gaps: '+P.gaps.map(function(v){return v.toFixed(2);}).join(' · ')+'</div>'+g;
      if(LV) t2+='<div class="scroll"><table><tr><th>Your level</th><th>group</th><th>vol % (20-day, before the week)</th><th>nearest node</th>'+(LV.levels[0]&&LV.levels[0].daily.length?LV.levels[0].daily.map(function(q){return '<th>'+esc(q.day.slice(5))+' vol</th>';}).join(''):'')+'</tr>'+LV.levels.slice().sort(function(a,b){return b.px-a.px;}).map(function(l){
        return '<tr><td><b>'+l.px.toFixed(2)+'</b></td><td>'+sw(l.color)+esc(l.color)+'</td><td>'+(l.pct_20d==null?'outside':l.pct_20d+'%')+'</td><td>'+(l.nearest_node==null?'—':l.nearest_node.toFixed(2)+' <span class="dim">($'+l.node_dist.toFixed(2)+')</span>')+'</td>'+l.daily.map(function(q){return '<td>'+(q.vol?(q.vol/1e3).toFixed(0)+'k':'—')+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
      // daily auction: each day's value area vs the day before + what that has meant the next day
      var DD=Object.keys(V.days||{}).sort().filter(function(d){return V.days[d].auction;}),ST=V.auction_stats;
      if(DD.length){var VL={higher:'<span class="pos">HIGHER</span>',lower:'<span class="neg">LOWER</span>','overlap-up':'overlap ↑','overlap-down':'overlap ↓',inside:'inside (balance)',outside:'outside (expansion)'};
        t2+='<h2>DAILY AUCTION · VALUE VS THE DAY BEFORE</h2><p class="sub">Saved at every close. Value = where the day\u2019s 70% value area sits against yesterday\u2019s: higher / lower = value moved (initiative), overlap = rotating, inside = balance, outside = range expansion. Open / close = against yesterday\u2019s / today\u2019s value area.</p>';
        if(ST){var pc=function(a,b){return b?Math.round(100*a/b)+'%':'—';},O=ST.open;
          t2+='<div class="verdict"><b>What it has meant ('+DD.length+' days):</b><br>'+['above','inside','below'].filter(function(k){return O[k];}).map(function(k){return 'Opened '+k+' yesterday\u2019s value: '+O[k].days+' days · traded back inside it '+pc(O[k].back_inside,O[k].days)+' · closed up '+pc(O[k].closed_up,O[k].days);}).join('<br>')+
            '<br>80% rule (opened outside, held back inside 30 min → crossed to the far side): '+ST.r80.crossed+' of '+ST.r80.tried+' ('+pc(ST.r80.crossed,ST.r80.tried)+') · '+ST.r80.never+' outside opens never got back in'+
            '<br>After value moved: '+['higher','overlap-up','inside','outside','overlap-down','lower'].filter(function(k){return ST.after_value[k];}).map(function(k){var a=ST.after_value[k];return k+' → next day closed up '+pc(a.closed_up,a.days)+' ('+a.days+')';}).join(' · ')+'</div>';}
        t2+='<div class="scroll"><table><tr><th>Day</th><th>POC</th><th>value area</th><th>value vs yesterday</th><th>POC move</th><th>opened vs yesterday\u2019s value</th><th>closed vs its value</th></tr>'+DD.slice(-12).reverse().map(function(d){var X=V.days[d],A=X.auction;
          return '<tr><td>'+esc(day(d))+'</td><td>'+X.poc.toFixed(2)+'</td><td>'+X.va[0].toFixed(2)+'–'+X.va[1].toFixed(2)+' <span class="dim">($'+A.va_width.toFixed(0)+')</span></td><td>'+(VL[A.value]||esc(A.value))+'</td><td class="'+cl(A.poc_shift)+'">'+(A.poc_shift>=0?'+':'')+A.poc_shift.toFixed(2)+'</td><td>'+esc(A.open_vs_prior_va)+'</td><td>'+esc(A.close_vs_va)+'</td></tr>';}).join('')+'</table></div>';}
      var el=document.createElement('div');el.innerHTML=t2;document.getElementById('lv').appendChild(el);tellHeight();
    }).catch(function(){});
  }).catch(function(){});
  document.querySelectorAll('details').forEach(function(x){x.addEventListener('toggle',tellHeight);});
}
})();
</script></body></html>
