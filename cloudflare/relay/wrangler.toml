# GEX live relay: the logger PUTs each minute's live files here and the
# GEX Chart reads them back within seconds (GitHub Pages stays as the backup
# and the archive). Deployed by .github/workflows/relay_deploy.yml.
name = "gex-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
