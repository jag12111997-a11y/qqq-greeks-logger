# ============================================================
# QQQ Greeks Logger — MIDDAY burst
# ============================================================
# 12:15-1:30 PM Pacific: one snapshot every 1 minute, window +/-$7.
#
# GitHub cron can't fire every minute, so this ONE job starts at
# 12:15 and loops internally every 60 seconds for 75 minutes.
#   19:15 UTC = 12:15 PM PDT (summer). In winter it shifts to
#   11:15 AM PST until the cron is bumped.
# Runs to 1:30 on purpose: the free feed is ~15 min delayed, so the
# ~1:15 snapshot is what actually shows the 1:00 PM close.
# ============================================================

name: QQQ Greeks Logger - Midday

# Primary trigger is cron-job.org at 12:15 PM Pacific (weekdays) via workflow_dispatch.
# GitHub cron is added as a LATER BACKUP only: the guard step below skips it whenever
# the midday session already logged, so the two triggers never double-log — the backup
# only actually runs when the primary was missed (self-healing, no human needed).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '45 19 * * 1-5'   # ~12:45 PM PDT / 11:45 AM PST — BACKUP, guarded below

concurrency:
  group: qqq-midday
  cancel-in-progress: false

jobs:
  log-greeks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if this midday already logged (makes the cron backup safe)
        id: guard
        run: |
          DATE=$(TZ=America/Los_Angeles date +%F)
          F="data/$DATE/pm/qqq_greeks_calls_${DATE}_pm.csv"
          if [ -f "$F" ] && [ "$(wc -l < "$F")" -gt 6 ]; then
            echo "Already logged: $F ($(wc -l < "$F") lines). Skipping this run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No midday data yet for $DATE — running the logger."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run logger (12:15-1:30 PT, every 1 min, +/-$7)
        if: steps.guard.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SESSION: 'pm'
          WINDOW: '7'
          INTERVAL_SECONDS: '60'
          DURATION_SECONDS: '4500'
        run: python qqq_greeks_logger_alpaca.py

      - name: Commit updated data back to repo
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "qqq-logger-bot"
          git config user.email "actions@github.com"
          git add data market-dash/gex_live.json market-dash/auction_live.json
          git commit -m "Midday session $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
