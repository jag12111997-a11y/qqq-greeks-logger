# ============================================================
# QQQ Greeks Logger — MORNING burst
# ============================================================
# 6:45-8:45 AM Pacific: one snapshot every 60 seconds, window +/-$15.
#
# GitHub cron runs on UTC and can't schedule faster than every 5 min,
# so this ONE job starts at 6:45 and loops internally for 2 hours.
#   13:45 UTC = 6:45 AM PDT (summer). In winter it shifts to 5:45 AM
#   PST until the cron is bumped. GitHub may start the job a few
#   minutes late; once started, the 5-minute cadence is exact.
# ============================================================

name: QQQ Greeks Logger - Morning

# Primary trigger is cron-job.org at 6:45 AM Pacific (weekdays) via workflow_dispatch.
# GitHub cron is added as a LATER BACKUP only: the guard step below skips it whenever
# the morning already logged, so the two triggers never double-log — the backup only
# actually runs when the primary was missed (self-healing, no human needed).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 14 * * 1-5'   # ~7:30 AM PDT / 6:30 AM PST — BACKUP, guarded below

concurrency:
  group: qqq-morning
  cancel-in-progress: false

jobs:
  log-greeks:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if this morning already logged (makes the cron backup safe)
        id: guard
        run: |
          DATE=$(TZ=America/Los_Angeles date +%F)
          F="data/$DATE/am/qqq_greeks_calls_${DATE}_am.csv"
          if [ -f "$F" ] && [ "$(wc -l < "$F")" -gt 6 ]; then
            echo "Already logged: $F ($(wc -l < "$F") lines). Skipping this run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No morning data yet for $DATE — running the logger."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run logger (6:45-8:45 PT, every 5 min, +/-$15)
        if: steps.guard.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SESSION: 'am'
          WINDOW: '15'
          INTERVAL_SECONDS: '60'
          DURATION_SECONDS: '7200'
        run: python qqq_greeks_logger_alpaca.py

      - name: Commit updated data back to repo
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "qqq-logger-bot"
          git config user.email "actions@github.com"
          git add data market-dash/gex_live.json market-dash/auction_live.json
          git commit -m "Morning session $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
