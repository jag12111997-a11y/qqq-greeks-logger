name: Market Dash

on:
  schedule:
    # Two runs a day. The script decides am/pm from the PACIFIC clock at
    # runtime, so it tags itself correctly even if a run fires late.
    #   AM  = 12:00 AM - 11:59 AM PT
    #   PM  = 12:00 PM - 11:59 PM PT
    - cron: '30 13 * * 1-5'   # 6:30 AM PT  — pre-market read
    - cron: '30 20 * * 1-5'   # 1:30 PM PT  — right after the close: fresh prices
                              #               and sectors. The Cboe daily P/C
                              #               has NOT posted yet at this hour, so
                              #               the dashboard keeps P/C blank until
                              #               the evening run below fills it in.
    - cron: '30 1  * * 2-6'   # 6:30 PM PT  — evening run (01:30 UTC = 6:30 PM PT
                              #               the PRIOR day, hence Tue-Sat UTC =
                              #               Mon-Fri PT). This is late enough to
                              #               catch the Cboe daily P/C drop. Both
                              #               afternoon runs tag "pm", so this one
                              #               REPLACES the 1:30 PM line with the
                              #               version that has the settled P/C.
                              #   If P/C is still blank some evenings, the drop is
                              #   landing even later — push this hour back (e.g.
                              #   '30 2 * * 2-6' = 7:30 PM PT).
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-market-dash:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance webull

      - name: Run market dash fetch
        working-directory: market-dash
        env:
          # FRED fills CPI and the 2s10s curve.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Alpaca powers the GEX engine (full options chain, calls + puts).
          # The saved secret is named ALPACA_API_SECRET (that's what your
          # greeks logger used). Your .env files call it ALPACA_SECRET_KEY,
          # so the script sees it under BOTH names and reads whichever exists.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
        run: python market_dash_fetch.py

      - name: Commit new data back to repo
        run: |
          git config user.name "market-dash-bot"
          git config user.email "actions@github.com"
          git add market-dash/data market-dash/history.js
          git commit -m "Market dash $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push
