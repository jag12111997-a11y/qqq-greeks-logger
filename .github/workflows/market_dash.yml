name: Market Dash

on:
  schedule:
    # Two runs a day, on Eve's routine: 3 AM and 3 PM Pacific. The script
    # decides am/pm from the PACIFIC clock at runtime, so each run tags itself.
    #   AM = 12:00 AM - 11:59 AM PT   PM = 12:00 PM - 11:59 PM PT
    #
    # Times below are Pacific DAYLIGHT (UTC-7). GitHub cron is fixed UTC and does
    # NOT follow daylight saving, so from ~Nov-Mar these fire an hour earlier
    # (2 AM / 2 PM PST). To keep them exactly on 3 in winter, add 1 hour to each
    # UTC value then ('0 11 ...' and '0 23 ...').
    - cron: '0 10 * * 1-5'    # 3:00 AM PT  — overnight / pre-dawn snapshot
    - cron: '45 13 * * 1-5'   # 6:45 AM PT  — PRE-OPEN: fresh GEX map + morning P/C
                              #   right before the 7:17 entry window (winter: 5:45 PST).
    - cron: '25 10 * * 1-5'   # 3:25 AM PT  — BACKUP: GitHub cron can silently drop a run
    - cron: '25 22 * * 1-5'   # 3:25 PM PT  — BACKUP: upsert-per-day makes reruns harmless
    - cron: '0 22 * * 1-5'    # 3:00 PM PT  — after the close: fresh ETF prices.
                              #   The Cboe daily P/C posts LATER in the evening,
                              #   so it is NOT in this run. It gets picked up by
                              #   the NEXT day's 3 AM run, which by then has the
                              #   settled number. The dashboard keeps P/C dimmed
                              #   until that fresh value lands.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-market-dash:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance webull

      - name: Run market dash fetch
        working-directory: market-dash
        env:
          # FRED fills CPI and the 2s10s curve.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Alpaca powers the GEX engine (full options chain, calls + puts).
          # The saved secret is named ALPACA_API_SECRET (that's what your
          # greeks logger used). Your .env files call it ALPACA_SECRET_KEY,
          # so the script sees it under BOTH names and reads whichever exists.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
        run: python market_dash_fetch.py

      - name: Commit new data back to repo
        run: |
          git config user.name "market-dash-bot"
          git config user.email "actions@github.com"
          git add market-dash/data market-dash/history.js
          git commit -m "Market dash $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push
