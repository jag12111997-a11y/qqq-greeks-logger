name: GEX History - Rebuild saved days

# Builds market-dash/history/<day>.json for the GEX Chart's past-day view:
# every minute of each session, logged minutes as captured and missed minutes
# rebuilt from Alpaca's 1-minute option + stock bars (flagged "b": 1).
#   validate  rebuild minutes we DID log, from bars only, and compare with the
#             log (writes market-dash/history/_validation.json). No day files.
#   build     write the day files (blank days = every day in data/).
on:
  # Daily after the PM logger finishes (it runs to 1:30 PM PT). 23:10 UTC =
  # 4:10 PM PDT / 3:10 PM PST, clear of Market Dash's 22:00 and 22:25 UTC runs.
  schedule:
    - cron: '10 23 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate or build'
        required: true
        default: 'validate'
        type: choice
        options: [validate, build]
      days:
        description: 'Days, YYYY-MM-DD separated by spaces (blank = validate: last 5 logged days, build: every day)'
        required: false
        default: ''

concurrency:
  group: gex-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild saved days
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          MODE: ${{ inputs.mode }}
          DAYS: ${{ inputs.days }}
        run: |
          # Scheduled run (no inputs): build only the days that have no history
          # file yet, plus today. The build ends by refreshing the home-run paper
          # log and the live box's context (gex_history.py -> home_run.write()).
          if [ -z "$MODE" ]; then
            MODE=build
            DAYS=$(for d in $(ls -d data/????-??-?? | xargs -n1 basename); do [ -f "market-dash/history/$d.json" ] || printf '%s ' "$d"; done)
            [ -z "$DAYS" ] && DAYS=today
          fi
          if [ "$MODE" = "validate" ]; then
            if [ -z "$DAYS" ]; then DAYS=$(ls -d data/????-??-?? | tail -5 | xargs -n1 basename | tr '\n' ' '); fi
            python gex_history.py --validate $DAYS --publish
          else
            python gex_history.py ${DAYS:+--days $DAYS} --publish
          fi

      # v9.2 paper log: the SAME engine + morning map as the live Game Plan card, run on the day's final bars
      # and logger quotes. Writes market-dash/v92_log/<day>.json + index.json (the card's 10-morning meter).
      - name: v9.2 paper log
        if: always()
        run: |
          node market-dash/night_fetch.js > /tmp/night_written.txt || true   # high-IV layer: night-before numbers (relay, read-only)
          node market-dash/v92_paper_log.js > /tmp/v92_written.txt || true
          cat /tmp/night_written.txt >> /tmp/v92_written.txt
          cat /tmp/v92_written.txt
          python -c "from pathlib import Path; from publish_history import publish; p=[l.strip() for l in open('/tmp/v92_written.txt') if l.strip()]; print('published' if p and publish(Path('.').resolve(), p) else 'nothing new')"
