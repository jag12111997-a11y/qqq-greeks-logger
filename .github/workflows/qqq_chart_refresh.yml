name: QQQ Chart - Refresh Now

# One real snapshot for the dashboard chart without starting a 75-120 minute
# logger session. The regular morning and midday jobs remain the live cadence;
# this dispatch is the safe way to seed/repair the current candle file now.
on:
  workflow_dispatch: {}

concurrency:
  group: qqq-chart-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture one live QQQ snapshot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          WINDOW: '15'
          INTERVAL_SECONDS: '0'
          DURATION_SECONDS: '0'
        run: python qqq_greeks_logger_alpaca.py

      - name: Publish chart data
        run: |
          git config user.name "qqq-logger-bot"
          git config user.email "actions@github.com"
          git add market-dash/gex_live.json market-dash/gex_intraday.json market-dash/auction_live.json
          if [ -f market-dash/qqq_candle_history.json ]; then git add market-dash/qqq_candle_history.json; fi
          if [ -f market-dash/options_latest.json ]; then git add market-dash/options_latest.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Refresh live QQQ chart $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Abort any stuck rebase left over from a previous attempt
          git rebase --abort 2>/dev/null || true
          # Retry loop: handles concurrent pushes from other workflows
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || {
              echo "Rebase failed (attempt $attempt), cleaning up..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
              continue
            }
            git push origin HEAD:main && break || sleep $((attempt * 5))
          done
          echo "Publishing failed after 3 attempts" >&2
          exit 1
