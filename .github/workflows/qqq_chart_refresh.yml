name: QQQ Chart - Refresh Now

# One real snapshot for the dashboard chart without starting a 75-120 minute
# logger session. The regular morning and midday jobs remain the live cadence;
# this dispatch is the safe way to seed/repair the current candle file now.
on:
  workflow_dispatch: {}
  schedule:
    # Every 10 min, Mon-Fri, 13:00-20:50 UTC = 9:00a-4:50p ET (daylight time).
    # In standard-time months (Nov-Mar) that window is 8:00a-3:50p ET: change 13-20 to 14-21.
    - cron: '*/10 13-20 * * 1-5'

concurrency:
  group: qqq-chart-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture one live QQQ snapshot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          WINDOW: '15'
          INTERVAL_SECONDS: '0'
          DURATION_SECONDS: '0'
        run: python qqq_greeks_logger_alpaca.py
