name: Option bars - backfill frozen quotes

# Pulls Alpaca's historical 1-minute option bars (real trade prints) for contracts the user traded on days when the logger's
# quote feed froze, and saves market-dash/option_bars/<day>.csv. Then rebuilds the My trades replay.
#   days blank = auto: last 30 logged days where a traded contract's quotes froze and no bars file exists yet.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days, YYYY-MM-DD separated by spaces (blank = auto-detect)'
        required: false
        default: ''

concurrency:
  group: gex-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backfill + rebuild replay
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DAYS: ${{ inputs.days }}
        run: |
          if [ -z "$DAYS" ]; then python option_bars_backfill.py --auto > /tmp/bars_written.txt; else python option_bars_backfill.py $DAYS > /tmp/bars_written.txt; fi
          cat /tmp/bars_written.txt
          if [ -s /tmp/bars_written.txt ]; then node market-dash/my_replay_build.js >/dev/null && echo market-dash/my_replay.js >> /tmp/bars_written.txt; fi
          python -c "from pathlib import Path; from publish_history import publish; p=[l.strip() for l in open('/tmp/bars_written.txt') if l.strip()]; print('published' if p and publish(Path('.').resolve(), p) else 'nothing new')"
