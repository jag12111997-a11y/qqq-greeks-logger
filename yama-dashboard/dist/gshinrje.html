  // Compact strike-by-strike gamma profile that deliberately shares the
  // chart's qqqChartModel(). That keeps spot, walls, flip, regime and history
  // selection synchronized instead of mixing the live logger with an older map.
  function secQqqGexProfile(e, bodyOnly, chartModel) {
    var M = chartModel || qqqChartModel(e), g = M.g || {}, raw = get(g, "strikes", []) || [];
    var strikes = raw.map(function (s) {
      return { strike:Number(s.strike), net_gex:Number(s.net_gex),
               call_gex:Number(s.call_gex), put_gex:Number(s.put_gex) };
    }).filter(function (s) {
      return isFinite(s.strike) && isFinite(s.net_gex);
    }).sort(function (a, b) { return a.strike - b.strike; });

    if (!strikes.length) {
      var empty = '<div style="padding:80px 10px;text-align:center;color:var(--faint)">' +
        "Waiting for a real strike-by-strike GEX snapshot.</div>";
      return bodyOnly ? empty : sec("GEX · strike profile", empty)
        .replace("<section>", '<section class="qqq-gex-profile">');
    }

    var liveLogger = M.latest && LIVE_GEX && g === LIVE_GEX;
    var L = g.levels || {};
    var realFlip = !g.gamma_flip_method || g.gamma_flip_method === "zero crossing";
    var flip = realFlip ? Number(g.gamma_flip) : NaN;
    var spot = Number(M.spot);
    var domain = strikes.map(function (s) { return s.strike; });
    [spot, flip, Number(L.call_wall), Number(L.put_wall)].forEach(function (v) {
      if (isFinite(v)) domain.push(v);
    });
    var kMin = Math.min.apply(null, domain), kMax = Math.max.apply(null, domain);
    var span = Math.max(1, kMax - kMin), edge = Math.max(.35, span * .018);
    kMin -= edge; kMax += edge; span = kMax - kMin;

    // Price is the vertical axis, matching the QQQ chart beside this card.
    // Net gamma extends sideways from zero: positive to the right, negative
    // to the left. mountQqqChart() replaces the fallback strike spacing with
    // the chart series' real price coordinates once Lightweight Charts mounts.
    var W = 420, Hh = 470, padL = 40, padR = 12, padT = 10, plotBot = 444;
    var plotW = W - padL - padR, zero = padL + plotW / 2;
    var amp = plotW / 2;
    var plotH = plotBot - padT;
    var maxAbs = Math.max.apply(null, strikes.map(function (s) { return Math.abs(s.net_gex); })) || 1;
    function X(v) { return zero + (v / maxAbs) * amp; }
    function Y(k) { return padT + ((kMax - k) / span) * plotH; }
    var bh = Math.max(.8, Math.min(12, plotH / strikes.length * .68));
    var svg = "";
    [0, .5, 1].forEach(function (p) {
      var xx = padL + p * plotW;
      svg += '<line x1="' + xx.toFixed(1) + '" x2="' + xx.toFixed(1) + '" y1="' + padT +
        '" y2="' + plotBot + '" stroke="#171722"/>';
    });
    svg += '<line x1="' + zero.toFixed(1) + '" x2="' + zero.toFixed(1) + '" y1="' + padT +
      '" y2="' + plotBot + '" stroke="#343444" stroke-width="1.2"/>';
    strikes.forEach(function (s) {
      var x = X(s.net_gex), w = Math.max(.7, Math.abs(x - zero));
      svg += '<rect data-gex-strike="' + s.strike + '" x="' + Math.min(x, zero).toFixed(1) +
        '" y="' + (Y(s.strike) - bh / 2).toFixed(1) + '" width="' + w.toFixed(1) +
        '" height="' + bh.toFixed(1) + '" rx=".6" fill="' +
        (s.net_gex >= 0 ? "#00e676" : "#ff453a") + '" opacity=".88"><title>' +
        esc(String(s.strike)) + " · net " + esc(fmtBig(s.net_gex).replace(/<[^>]*>/g, "")) +
        " · calls " + esc(fmtBig(s.call_gex).replace(/<[^>]*>/g, "")) +
        " · puts " + esc(fmtBig(s.put_gex).replace(/<[^>]*>/g, "")) + "</title></rect>";
    });
    function marker(v, color, dash, id) {
      if (!isFinite(v) || v < kMin || v > kMax) return "";
      var y = Y(v).toFixed(1), attrs = id ? ' id="' + id + '-line"' : "";
      return '<line' + attrs + ' data-gex-marker-price="' + v + '" x1="' + padL +
        '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y +
        '" stroke="' + color + '" stroke-width="1.7"' + (dash ? ' stroke-dasharray="4 3"' : "") + '/>' +
        '<circle' + (id ? ' id="' + id + '-dot"' : "") + ' data-gex-marker-price="' + v +
        '" cx="' + zero.toFixed(1) + '" cy="' + y +
        '" r="2.6" fill="' + color + '"/>';
    }
    svg += marker(Number(L.put_wall), "#ff453a", true, "");
    svg += marker(Number(L.call_wall), "#00e676", true, "");
    svg += marker(flip, "#ffd600", false, "");
    svg += marker(spot, "#ff2be0", false, "qqq-gex-spot");
    svg += '<text data-gex-axis-price="' + (kMax - edge) + '" x="' + (padL - 5) + '" y="' + (Y(kMax - edge) + 3).toFixed(1) +
      '" text-anchor="end" fill="#55556b" font-size="9">' + num(kMax - edge, 0) + '</text>' +
      '<text data-gex-axis-price="' + ((kMin + kMax) / 2) + '" x="' + (padL - 5) + '" y="' + (Y((kMin + kMax) / 2) + 3).toFixed(1) +
      '" text-anchor="end" fill="#55556b" font-size="9">' + num((kMin + kMax) / 2, 0) + '</text>' +
      '<text data-gex-axis-price="' + (kMin + edge) + '" x="' + (padL - 5) + '" y="' + (Y(kMin + edge) + 3).toFixed(1) +
      '" text-anchor="end" fill="#55556b" font-size="9">' + num(kMin + edge, 0) + '</text>' +
      '<text x="' + padL + '" y="463" fill="#55556b" font-size="9">− GEX</text>' +
      '<text x="' + (W - padR) + '" y="463" text-anchor="end" fill="#55556b" font-size="9">+ GEX</text>';

    function level(label, value, color, id) {
      var v = Number(value), shown = isFinite(v) ? num(v, 2) : "&mdash;";
      var dist = isFinite(v) && isFinite(spot) && spot > 0
        ? ' <span style="color:var(--faint);font-size:9px">' + signed((v - spot) / spot * 100, 2, "%") + "</span>" : "";
      return '<div class="qqq-gex-level"><small style="color:' + color + '">' + esc(label) + '</small>' +
        '<b' + (id ? ' id="' + id + '"' : "") +
        (!id && isFinite(v) ? ' data-gex-level-price="' + v + '"' : "") + '>' + shown + dist + "</b></div>";
    }
    var pos = g.regime === "POSITIVE GAMMA", neg = g.regime === "NEGATIVE GAMMA";
    var regimeColor = pos ? "var(--up)" : neg ? "var(--down)" : "var(--dim)";
    var regimeRead = pos ? "dampening / pinning" : neg ? "amplifying / trending" : "regime unavailable";
    var stamp = g.generated_utc || g.fetched_utc || e.fetched_utc;
    var stampDate = toDate(stamp);
    var ageMin = stampDate ? Math.max(0, Math.round((Date.now() - stampDate.getTime()) / 60000)) : null;
    var freshness = ageMin === null ? "time unavailable" : ageMin <= 1 ? "updated now" : ageMin + "m old";
    var scope = liveLogger ? "LIVE 0DTE LOGGER" : "SAVED SESSION MAP";
    var body =
      '<div id="qqq-gex-profile" data-kmin="' + kMin + '" data-kmax="' + kMax +
        '" data-pad-top="' + padT + '" data-plot-height="' + plotH +
        '" data-view-height="' + Hh + '">' +
        '<div class="qqq-gex-meta"><span class="qqq-gex-source">' + scope + '</span><span>' +
          strikes.length + " strikes · " + esc(freshness) + '</span></div>' +
        '<div class="qqq-gex-regime" style="color:' + regimeColor + '"><div><b>' +
          esc(g.regime || "GAMMA UNAVAILABLE") + '</b><span>' +
          regimeRead + '</span></div>' +
          '<span>NET ' + (has(g.net_gex) ? fmtBig(Number(g.net_gex)) : "&mdash;") + '</span></div>' +
        '<div class="qqq-gex-align-spacer" aria-hidden="true"></div>' +
        '<div class="qqq-gex-plot"><svg viewBox="0 0 ' + W + " " + Hh + '" preserveAspectRatio="none" role="img" ' +
          'aria-label="Horizontal net gamma exposure bars aligned to the QQQ chart price axis, with live spot, gamma flip, call wall and put wall">' +
          svg + '</svg></div>' +
        '<div class="qqq-gex-levels">' +
          level(M.quoteFresh ? "Live QQQ" : (M.quoteLive ? "QQQ" : "Spot"), spot, "#ff2be0", "qqq-gex-spot-value") +
          level("Gamma flip", flip, "#ffd600", "") +
          level("Call wall", L.call_wall, "#00e676", "") +
          level("Put wall", L.put_wall, "#ff453a", "") +
        '</div>' +
        '<div class="qqq-gex-foot">Strike price runs vertically with the QQQ chart; green / red net-GEX bars extend right / left from zero. Lines use the same snapshot as the dealer-map overlays. ' +
          (liveLogger ? "Logger scope is the currently captured 0DTE strike window." : "Historical view uses the saved full-session options map.") +
          (stamp ? " · As of " + fmtTime(stamp) : "") + '</div>' +
        '<div id="qqq-gex-window-note" class="qqq-gex-window-note"></div>' +
      '</div>';
    if (bodyOnly) return body;
    return sec("GEX · synchronized strike profile", body)
      .replace("<section>", '<section class="qqq-gex-profile">');
  }

  // ── Q3: one synthesized read — MARKET STORY + CURRENT POSTURE + KEY LEVELS ──
  // Consolidates the per-section "Read" prose (now hidden via .flow .read) into a
  // single narrative built from the SAME computed signals the HUD/cockpit use.
  function secSynthesis(e, chartModel) {
    var S = nasdaqCommandModel(e, chartModel);
    var gx = S.g || {}, L = get(gx, "levels", {}) || {};
    var spot = (S.chart && isFinite(S.chart.spot)) ? S.chart.spot : (has(gx.spot) ? gx.spot : null);
    if (spot === null) return "";
    var sig = (S.chart && S.chart.sigLeft !== undefined) ? S.chart.sigLeft : null;
    var flip = has(gx.gamma_flip) ? gx.gamma_flip : null;
    var cw = has(L.call_wall) ? L.call_wall : null;
    var pw = has(L.put_wall) ? L.put_wall : null;
    var oi = has(L.highest_oi_strike) ? L.highest_oi_strike : null;
    var z = (S.q && has(S.q.z20)) ? S.q.z20 : null;
    var dv = S.dv, vr2 = S.vr2, sp = S.spread, vix = S.vix;
    var garch = get(e, "quant.garch");

    function tag(name, p, col) {
      if (p === null || !isFinite(p)) return "";
      var d = spot ? (p / spot - 1) * 100 : null;
      return '<span style="display:inline-block;background:rgba(140,20,20,0.090);border:1px solid ' + col +
        ';border-radius:7px;padding:3px 9px;margin:4px 6px 0 0;font-size:12px;color:var(--txt);white-space:nowrap">' +
        '<span style="color:' + col + '">' + esc(name) + '</span> ' + num(p, 2) +
        (d !== null ? ' <span style="color:' + (d >= 0 ? "#00e676" : "#ff453a") + ';font-size:11px">' + signed(d, 2, "%") + "</span>" : "") +
        "</span>";
    }

    var story = ["QQQ " + num(spot, 2) +
      (z !== null ? " · stretch z " + signed(z, 2) +
        (Math.abs(z) >= 1.5 ? " (extended)" : Math.abs(z) >= 1 ? " (stretched)" : " (mid-range)") : "")];
    if (has(gx.regime))
      story.push(S.gpos ? "dealers long gamma — flow dampens / pins toward the walls"
                        : "dealers short gamma — flow amplifies moves");
    var micro = [];
    if (dv !== null) micro.push(dv < 0.15 ? "geometry collapsed" : dv < 0.35 ? "geometry thin" : "geometry healthy");
    if (vr2 !== null) micro.push(vr2 > 1.1 ? "trending (VR " + num(vr2, 2) + ")" : vr2 < 0.9 ? "mean-reverting (VR " + num(vr2, 2) + ")" : "random walk");
    if (sp !== null) micro.push("edge " + signed(sp, 1, "pp") + " real−impl");
    if (ok(garch) && has(garch.regime) && has(garch.conditional_vol_pct))
      micro.push(String(garch.regime).toLowerCase() + " " + num(garch.conditional_vol_pct, 1, "%"));
    if (has(vix)) micro.push("VIX " + num(vix, 2));

    var upObj = cw !== null ? cw : (sig !== null ? spot * (1 + sig) : null);
    var downInv = pw !== null ? pw : (sig !== null ? spot * (1 - sig) : null);
    var magnet = oi !== null ? oi : flip;

    // Key levels row removed — magnet/flip/walls/±1σ are already drawn as the
    // labelled price lines on the chart, so the text pills were redundant.
    return '<div class="qqq-synthesis">' +
      '<div class="qqq-syn-row"><span class="qqq-syn-k">Market story</span><div class="qqq-syn-v">' +
        story.join(" · ") +
      "</div></div>" +
    "</div>";
  }

  // Options & market positioning — the strike×expiry heatmap + sectors donut.

  function secQqqOpening(e, chartModel) {

      return secWide("QQQ · price (no GEX snapshot for this day)",

  function destroyQqqChart() {
    if (!QQQ_TV) return;
    try {
      if (QQQ_VIEW_STATE.userAdjusted && QQQ_TV.chart && QQQ_TV.chart.timeScale) {
        var savedRange = QQQ_TV.chart.timeScale().getVisibleLogicalRange();
        if (savedRange && isFinite(savedRange.from) && isFinite(savedRange.to)) {
          QQQ_VIEW_STATE.logicalRange = { from:savedRange.from, to:savedRange.to };
        }
      }
    } catch (saveRangeErr) {}
    try { if (QQQ_TV.resize) QQQ_TV.resize.disconnect(); } catch (err) {}
    try {
      if (QQQ_TV.el && QQQ_TV.interactionHandler) {
        ["pointerdown", "pointermove", "wheel", "dblclick", "touchstart", "touchmove"].forEach(function (name) {
          QQQ_TV.el.removeEventListener(name, QQQ_TV.interactionHandler);
        });
      }
    } catch (interactionErr) {}
    try {
      if (QQQ_TV.rangeHandler && QQQ_TV.chart && QQQ_TV.chart.timeScale) {
        QQQ_TV.chart.timeScale().unsubscribeVisibleLogicalRangeChange(QQQ_TV.rangeHandler);
      }
    } catch (errRange) {}
    try { if (QQQ_TV.chart) QQQ_TV.chart.remove(); } catch (err2) {}
    QQQ_TV = null;
  }

  // Use Lightweight Charts' own price-to-pixel conversion so every GEX strike
  // lands on the same horizontal row as that price in the adjacent QQQ chart.
  // The SVG's built-in strike scale remains as a graceful fallback if the
  // library is unavailable or the cards stack on a narrow screen.
  function alignQqqGexProfile(series, chart) {
    var chartEl = document.getElementById("qqq-tv-chart");
    var profile = document.getElementById("qqq-gex-profile");
    if (!chartEl || !profile || !series || !series.priceToCoordinate) return;
    var plot = profile.querySelector ? profile.querySelector(".qqq-gex-plot") : null;
    var spacer = profile.querySelector ? profile.querySelector(".qqq-gex-align-spacer") : null;
    var svg = plot && plot.querySelector ? plot.querySelector("svg") : null;
    if (!plot || !spacer || !svg || !(chartEl.clientHeight > 0)) return;

    // On desktop the plotting rectangles begin on exactly the same row. When
    // the responsive layout stacks, collapse the spacer but keep the same scale.
    // A real block spacer avoids adjacent-margin collapsing and stays exact
    // after the profile is folded and reopened.
    var currentSpacer = parseFloat(spacer.style.height || "0") || 0;
    plot.style.height = chartEl.clientHeight + "px";
    var chartRect = chartEl.getBoundingClientRect();
    var plotRect = plot.getBoundingClientRect();
    var svgRect = svg.getBoundingClientRect();
    var stacked = window.innerWidth <= 1020 || plotRect.left <= chartRect.left + 20;
    var baseSvgTop = svgRect.top - currentSpacer;
    spacer.style.height = (stacked ? 0 : Math.max(0, Math.round(chartRect.top - baseSvgTop))) + "px";

    var viewH = Number(profile.getAttribute("data-view-height")) || 470;
    var svgHeight = svg.getBoundingClientRect().height || chartEl.clientHeight;
    var pxToView = viewH / svgHeight;
    var panePxH = chartEl.clientHeight;
    try {
      if (chart && chart.panes && chart.panes()[0] && chart.panes()[0].getHeight) {
        panePxH = chart.panes()[0].getHeight();
      } else if (chart && chart.timeScale && chart.timeScale().height) {
        panePxH -= chart.timeScale().height();
      }
    } catch (paneErr) {}
    var paneViewH = Math.max(0, panePxH) * pxToView;
    var kMin = Number(profile.getAttribute("data-kmin"));
    var kMax = Number(profile.getAttribute("data-kmax"));
    function priceY(price) {
      var c = series.priceToCoordinate(Number(price));
      return c === null || !isFinite(c) ? null : c * pxToView;
    }
    function inWindow(price) {
      return !isFinite(kMin) || !isFinite(kMax) || (price >= kMin && price <= kMax);
    }

    var bars = profile.querySelectorAll("[data-gex-strike]");
    for (var i = 0; i < bars.length; i++) {
      var strike = Number(bars[i].getAttribute("data-gex-strike"));
      var y = priceY(strike), h = Number(bars[i].getAttribute("height")) || 1;

  function qqqTimeBucket(time, timeframe) {
    var formatter = qqqTimeBucket.formatter || (qqqTimeBucket.formatter = new Intl.DateTimeFormat('en-US', {

      hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'

    var p = {};
    parts.forEach(function(part) { p[part.type] = part.value; });
    var day = Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)) / 1000;
    if (timeframe === '1D') return day;
    if (timeframe === '1W') return day - ((new Date(day * 1000).getUTCDay() + 6) % 7) * 86400;
    if (timeframe === '1M') return Date.UTC(Number(p.year), Number(p.month) - 1, 1) / 1000;

    var minutes = Number(p.hour) * 60 + Number(p.minute);

  }

  function qqqAggregateCandles(rows, timeframe) {
    var buckets = new Map();
    rows.slice().sort(function(a,b) { return a.time - b.time; }).forEach(function(bar) {
      var time = qqqTimeBucket(bar.time, timeframe);
      var candle = buckets.get(time);
      if (!candle) buckets.set(time, {
        time:time, open:bar.open, high:bar.high, low:bar.low,
        close:bar.close, volume:bar.volume || 0

      else {
        candle.high = Math.max(candle.high, bar.high);
        candle.low = Math.min(candle.low, bar.low);
        candle.close = bar.close;
        candle.volume += bar.volume || 0;
      }
    });
    return Array.from(buckets.values());
  }

  function qqqChartCandles(minuteRows, dailyRows, timeframe) {
    if (['1D','1W','1M'].indexOf(timeframe) < 0) return qqqAggregateCandles(minuteRows, timeframe);
    var byDay = new Map();
    // Real daily OHLC bars are authoritative for completed sessions.
    dailyRows.forEach(function(bar) {

      byDay.set(day, Object.assign({}, bar, {time:day + 16 * 3600}));
    });
    qqqAggregateCandles(minuteRows, '1D').forEach(function(bar) {

    });
    return qqqAggregateCandles(Array.from(byDay.values()), timeframe);

  function qqqMergeLiveCandle(src, M) {
    var rows = src.map(function (b) {
      return { time:b.time, open:b.open, high:b.high, low:b.low,
               close:b.close, volume:b.volume || 0, quoteBuilt:!!b.quoteBuilt };
    });
    if (!M.latest || !M.quoteFresh || !qqqMarketOpen() || M.quoteTime === null || !isFinite(M.spot)) return rows;
    var t = Math.floor(M.quoteTime / 60000) * 60;
    var last = rows.length ? rows[rows.length - 1] : null;
    if (last && t < last.time) return rows;
    if (last && t === last.time) {
      last.high = Math.max(last.high, M.spot);
      last.low = Math.min(last.low, M.spot);
      last.close = M.spot;
      last.quoteBuilt = true;
      return rows;
    }
    var contiguous = last && t - last.time <= 120;
    var open = contiguous ? last.close : M.spot;
    rows.push({ time:t, open:open, high:Math.max(open, M.spot),
                low:Math.min(open, M.spot), close:M.spot, volume:0, quoteBuilt:true });
    return rows;
  }

  function qqqHaCandles(src) {
    var out = [], pO = null, pC = null;
    for (var i = 0; i < src.length; i++) {
      var b = src[i], haC = (b.open + b.high + b.low + b.close) / 4;
      var haO = pO === null ? (b.open + b.close) / 2 : (pO + pC) / 2;
      out.push({ time:b.time, open:haO, high:Math.max(b.high, haO, haC),
                 low:Math.min(b.low, haO, haC), close:haC });
      pO = haO; pC = haC;
    }
    return out;
  }

  function qqqRawDisplay(src) {
    return src.map(function (b) {
      return { time:b.time, open:b.open, high:b.high, low:b.low, close:b.close };
    });
  }

  function qqqEma(src, period) {
    if (!src.length) return [];
    var k = 2 / (period + 1), value = src[0].close;
    return src.map(function (b, i) {
      value = i ? b.close * k + value * (1 - k) : b.close;
      return { time:b.time, value:value };
    });
  }

  function qqqAdl(src) {
    var ad = 0;
    return src.map(function (b) {
      var range = b.high - b.low;
      var clv = range > 0 ? ((b.close - b.low) - (b.high - b.close)) / range : 0;
      ad += clv * (b.volume || 0);
      return { time:b.time, value:ad };
    });
  }

  function qqqRsi(src, period) {
    var out = [], gains = 0, losses = 0, avgGain = 0, avgLoss = 0;
    period = period || 14;
    for (var i = 1; i < src.length; i++) {
      var d = src[i].close - src[i - 1].close;
      var gain = Math.max(0, d), loss = Math.max(0, -d);
      if (i <= period) {
        gains += gain; losses += loss;
        if (i < period) continue;
        avgGain = gains / period; avgLoss = losses / period;
      } else {
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
      }
      var value = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
      out.push({ time:src[i].time, value:value });
    }
    return out;
  }

  // Chart label overlay removed (2026-08-31) — reverted to plain TradingView chart.

  function updateMountedQqqQuote(e) {
    if (!e || idx !== FULL.length - 1 || QQQ_SESSION.past) return;
    var M = qqqChartModel(e);
    var leverageMeter = document.getElementById("qqq-leverage-meter");

            after.time !== before.time || after.close !== before.close ||
            after.high !== before.high || after.low !== before.low);
          if (changed) {
            QQQ_TV.rawCandles = mergedLive;
            var grouped = qqqChartCandles(mergedLive, QQQ_TV.dailySource, QQQ_TV.timeframe);
            var shown = QQQ_TV.mode === "ha" ? qqqHaCandles(grouped) : qqqRawDisplay(grouped);
            after = grouped[grouped.length - 1];

            }

            }
            if (QQQ_TV.indicatorSeries) {
              if (QQQ_TV.paneType === "volume") {
                QQQ_TV.indicatorSeries.update({ time:after.time, value:after.volume || 0,

              } else if (QQQ_TV.paneType === "adl") {
                var ad = qqqAdl(grouped);
                if (ad.length) QQQ_TV.indicatorSeries.update(ad[ad.length - 1]);
              } else if (QQQ_TV.paneType === "rsi") {

              }

            QQQ_TV.lastCandleTime = after.time;
            scheduleQqqGexAlignment(QQQ_TV.series, QQQ_TV.chart);
          }

        if (M.quoteFresh && qqqMarketOpen() && QQQ_TV.gexTrailSeries) {
          QQQ_TV.gexTrailSeries.forEach(function (trail) {
            var trailTime = qqqTimeBucket(quoteBarTime, QQQ_TV.timeframe);
            if (trailTime >= trail.time) {
              trail.series.update({ time:trailTime, value:trail.value });
              trail.time = trailTime;
            }

        if (QQQ_TV.spotLine) QQQ_TV.spotLine.applyOptions({ price: M.spot, title: M.quoteFresh ? "LIVE QQQ" : "QQQ" });
      } catch (err) {}
    }
    // Live-update the unified cockpit below the chart + GEX pair.
    try {
      var cockpitBlock = document.getElementById("qqq-cockpit-block");
      if (cockpitBlock) {
        var oldHub = cockpitBlock.querySelector(".qqq-quad-hub .qh-call");
        var oldCall = oldHub ? oldHub.textContent.trim() : "";
        cockpitBlock.innerHTML = secQuadrantCockpit(e, M);
        var newHub = cockpitBlock.querySelector(".qqq-quad-hub");
        var newCallEl = cockpitBlock.querySelector(".qqq-quad-hub .qh-call");
        var newCall = newCallEl ? newCallEl.textContent.trim() : "";

          newHub.classList.add("qqq-hub-pulse");
          newHub.addEventListener("animationend", function () {

    // The profile's cyan spot row follows the same 15-second browser quote as

    var profile = document.getElementById("qqq-gex-profile");
    var spotLine = document.getElementById("qqq-gex-spot-line");
    var spotDot = document.getElementById("qqq-gex-spot-dot");
    var spotValue = document.getElementById("qqq-gex-spot-value");
    var windowNote = document.getElementById("qqq-gex-window-note");
    if (profile && spotLine && spotDot) {
      var kMin = Number(profile.getAttribute("data-kmin"));
      var kMax = Number(profile.getAttribute("data-kmax"));
      var padTop = Number(profile.getAttribute("data-pad-top"));
      var plotHeight = Number(profile.getAttribute("data-plot-height"));
      if (isFinite(kMin) && isFinite(kMax) && kMax > kMin && isFinite(plotHeight)) {
        var outside = M.spot < kMin || M.spot > kMax;

        spotDot.style.display = outside ? "none" : "";
        spotLine.setAttribute("data-gex-marker-price", M.spot);
        spotDot.setAttribute("data-gex-marker-price", M.spot);

          spotDot.setAttribute("cy", y.toFixed(1));

          : "";

    }
    if (spotValue) spotValue.textContent = M.spot.toFixed(2);
    if (profile && profile.querySelectorAll) {
      var levelNodes = profile.querySelectorAll("[data-gex-level-price]");
      for (var i = 0; i < levelNodes.length; i++) {
        var levelPrice = Number(levelNodes[i].getAttribute("data-gex-level-price"));

    if (QQQ_TV && QQQ_TV.series) {
      scheduleQqqGexAlignment(QQQ_TV.series, QQQ_TV.chart);
    }
  }

  function secGexLive(e) {
    // Only on the latest session (it's a live, right-now read), only if we have data.
    if (!LIVE_GEX || idx !== FULL.length - 1 || !has(LIVE_GEX.net_gex)) return "";
    var g = LIVE_GEX, L = g.levels || {}, flip = g.gamma_flip;
    var pos = g.regime === "POSITIVE GAMMA";
    var body =

        ? row("Net vanna / charm", fmtBig(g.net_vannaex) + " / " + fmtBig(g.net_charmex))
        : row("Net vega / theta", fmtBig(g.net_vex) + " / " + fmtBig(g.net_tex)));

    var lines = [];
    lines.push(verdict(pos ? "var(--up)" : "var(--down)", pos
      ? "<b>Live &mdash; positive gamma.</b> Net GEX " + fmtBig(g.net_gex) +
        (has(g.distance_to_flip_pct) ? ", spot " + signed(g.distance_to_flip_pct, 2, "%") + " from the " + num(g.gamma_flip, 0) + " flip" : "") +
        ". Dealers are damping intraday &mdash; the fade-friendly, mean-reverting state, refreshed every 5 minutes as a real-time check on the twice-daily map above."
      : "<b>Live &mdash; negative gamma.</b> Net GEX " + fmtBig(g.net_gex) +
        ". Dealers are amplifying moves right now, so reversion is unreliable &mdash; stand fades down or wait for a clean flush before leaning on the mean."));
    lines.push("<div style='margin:5px 0'>Live GEX straight from your <b>5-min greeks logger</b> " +
      "(calls + puts), independent of the twice-daily API pull. If the API GEX card above is " +
      "missing or stale, this is your backup read of the same machine.</div>");
    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>" +
      esc(g.source || "logger") + ". OI is end-of-day; intraday moves come from spot + greeks. " +
      "Refreshes while the logger is running (mornings & midday PT).</div>");
    lines.push("<div style='margin:5px 0;color:var(--faint);font-size:11px'>Read this map as " +
      "<b>where the crowd's open interest &mdash; hence attention and reflexive reaction &mdash; is stacked</b>, " +
      "more than proof dealers are <i>forced</i> to defend a level: Cboe's desk measured the net 0DTE hedging " +
      "load at ~0.2% of daily liquidity (de minimis). Walls still tend to hold and break the way the map " +
      "suggests, but the mechanism is often crowd-reflexivity rather than forced hedging.</div>");

    return sec("GEX — LIVE · 0DTE · ±$15 strikes · 5-min logger", body,
      '<details class="read" open><summary><b>Read</b></summary><div>' +
      lines.join("") + "</div></details>");

  // ── TRADING COCKPIT ─────────────────────────────────────────────────────
  // A KDS-style glance board: every signal becomes a colour-coded ticket you
  // read in half a second (green = fade-friendly, amber = caution, red =
  // fade-hostile, grey = stale/off). Same real data the detailed cards use —
  // nothing new is invented here, it's the same numbers, just plated to glance.
  function cockpitVR(e) {                 // VR(2) for the fade-regime ticket
    var series = starSeries("pct_change").QQQ || [];
    var cut = H.indexOf(e);
    var upto = (cut >= 0) ? series.slice(0, cut + 1) : series;
    var r = upto.filter(function (v) { return typeof v === "number" && isFinite(v); })
                .map(function (v) { return Math.log(1 + v / 100); });
    var n = r.length;
    if (n < 12) return null;
    var mu = r.reduce(function (s, v) { return s + v; }, 0) / n;
    function varK(k) {
      var m = n - k + 1, acc = 0;
      for (var i = 0; i < m; i++) {
        var s = 0; for (var j = 0; j < k; j++) s += r[i + j];
        acc += (s - k * mu) * (s - k * mu);
      }
      return acc / m;
    }
    var v1 = varK(1);
    if (v1 <= 0) return null;
    return varK(2) / (2 * v1);
  }

  function qqqPlanBlock() {

      '<span style="letter-spacing:1px;text-transform:uppercase;font-size:9.5px;color:var(--warn)">The box</span> · ' +

      '15-min time-stop · flat 12:45 PT</div>';

  function secQuadrantCockpit(e, chartModel) {
    var S = nasdaqCommandModel(e, chartModel);
    var gx = S.g || {}, L = get(gx, "levels", {}) || {};
    var mk = S.mk, q = S.q, vix = S.vix;
    var spot = (S.chart && isFinite(S.chart.spot)) ? S.chart.spot : null;
    var used = S.chart.used;

    // ── node builder ──
    function qn(label, big, sub, borderCol, textCol, small) {
      return '<div class="qqq-qnode' + (small ? " sm" : "") + '" style="border-color:' + borderCol + '; color:' + textCol + ';">' +
        '<div class="qk">' + esc(label) + '</div>' +
        '<div class="qv">' + big + '</div>' +
        (sub ? '<div class="qs">' + sub + '</div>' : '') +
        '</div>';
    }

    // ── Q1 TOP-LEFT: HOSTILE SIGNALS ──
    var q1 = '<div class="qqq-quad-title" style="color:var(--down);">' +
      '<span class="qdot" style="background:var(--down)"></span>Hostile</div>';

    var dv = S.dv;
    if (dv !== null) {
      q1 += qn("√det(G)", num(dv, 3),
        dv < 0.15 ? "collapsed" : dv < 0.35 ? "thin" : "healthy",
        dv < 0.15 ? "rgba(255,69,58,.5)" : dv < 0.35 ? "rgba(255,214,0,.4)" : "rgba(0,230,118,.35)",
        dv < 0.15 ? "var(--down)" : dv < 0.35 ? "var(--warn)" : "var(--up)");
    } else {
      q1 += qn("√det(G)", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    var vr2 = S.vr2;
    if (vr2 !== null) {
      q1 += qn("VR(2)", num(vr2, 2),
        vr2 > 1.1 ? "trending" : vr2 < 0.9 ? "mean-revert" : "random",
        vr2 > 1.1 ? "rgba(255,69,58,.5)" : vr2 < 0.9 ? "rgba(0,230,118,.35)" : "rgba(107,60,104,.4)",
        vr2 > 1.1 ? "var(--down)" : vr2 < 0.9 ? "var(--up)" : "var(--dim)");
    } else {
      q1 += qn("VR(2)", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    if (has(gx.regime)) {
      var gpos = gx.regime === "POSITIVE GAMMA";
      q1 += qn("Gamma", gpos ? "+γ" : "−γ",
        (gpos ? "dampen" : "amplify") + (has(gx.net_gex) ? " · " + fmtBig(gx.net_gex) : ""),
        gpos ? "rgba(0,230,118,.35)" : "rgba(255,69,58,.5)",
        gpos ? "var(--up)" : "var(--down)");
    } else {
      q1 += qn("Gamma", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    if (used !== null && isFinite(used)) {
      var uPct = Math.round(used * 100);
      q1 += qn("Range", uPct + "%",
        used < 0.5 ? "room left" : used < 1 ? "half spent" : "blown 1σ",
        used >= 1 ? "rgba(255,69,58,.5)" : used >= 0.5 ? "rgba(255,214,0,.4)" : "rgba(0,230,118,.35)",
        used >= 1 ? "var(--down)" : used >= 0.5 ? "var(--warn)" : "var(--up)");
    } else {
      q1 += qn("Range", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    // ── Q2 TOP-RIGHT: SUPPORTING SIGNALS ──
    var q2 = '<div class="qqq-quad-title" style="color:var(--up); justify-content:flex-end;">' +
      'Supporting<span class="qdot" style="background:var(--up)"></span></div>';

    var qz = q && has(q.z20) ? q.z20 : null;
    if (qz !== null) {
      q2 += qn("Stretch", "z " + signed(qz, 2),
        Math.abs(qz) >= 1.5 ? "extended" : Math.abs(qz) >= 1 ? "stretched" : "mid-range",
        "rgba(0,230,118,.4)", "var(--up)");
    } else {
      q2 += qn("Stretch", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    var sp = S.spread;
    if (sp !== null) {
      q2 += qn("Edge", signed(sp, 1, "pp"),
        "real − impl",
        sp > 0 ? "rgba(0,230,118,.4)" : "rgba(255,69,58,.4)",
        sp > 0 ? "var(--up)" : "var(--down)");
    } else {
      q2 += qn("Edge", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    var _tq = mk.TQQQ, _sq = mk.SQQQ;
    if (_tq && has(_tq.z20) && _sq && has(_sq.z20)) {
      var lean = (_tq.z20 - _sq.z20) / 2;
      var leanW = lean >= 0.5 ? "callish" : lean <= -0.5 ? "bearish" : "balanced";
      q2 += qn("Leverage", signed(lean, 2),
        leanW + " · T" + signed(_tq.z20, 1) + " S" + signed(_sq.z20, 1),
        "rgba(255,43,224,.4)", "var(--accent)");
    } else {
      q2 += qn("Leverage", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    var cw = has(L.call_wall) ? L.call_wall : null;
    var pw = has(L.put_wall) ? L.put_wall : null;
    if (cw !== null || pw !== null) {
      q2 += qn("Walls",
        "C" + (cw !== null ? num(cw, 0) : "—") + " / P" + (pw !== null ? num(pw, 0) : "—"),
        "±γ MAX",
        "rgba(0,230,118,.25)", "var(--up)");

      q2 += qn("Walls", "—", "waiting", "rgba(107,60,104,.4)", "var(--faint)");
    }

    // ── Q3 BOTTOM-LEFT: AUCTION & FLOW ──
    var q3 = '<div class="qqq-quad-title" style="color:var(--info);">' +
      '<span class="qdot" style="background:var(--info)"></span>Auction &amp; Flow</div>';

    var A = (idx === FULL.length - 1 && !QQQ_SESSION.past) ? LIVE_AUCTION : null;
    var haveA = A && (has(A.ad_z) || has(A.vol_pace));

    if (haveA && has(A.ad_z)) {
      q3 += qn("ADL", "z " + signed(A.ad_z, 2),
        A.ad_z > 0 ? "accum" : "distrib",
        A.ad_z > 0 ? "rgba(41,182,246,.35)" : "rgba(255,69,58,.35)",
        A.ad_z > 0 ? "var(--up)" : "var(--down)", true);
    } else {
      q3 += qn("ADL", "—", "waiting", "rgba(41,182,246,.2)", "var(--faint)", true);
    }

    if (haveA && has(A.vol_pace)) {
      q3 += qn("Volume", num(A.vol_pace, 2) + "×",
        "pace",
        "rgba(41,182,246,.2)", "var(--dim)", true);
    } else {
      q3 += qn("Volume", "—", "waiting", "rgba(41,182,246,.2)", "var(--faint)", true);
    }

    if (LIVE_GEX && has(LIVE_GEX.net_gex) && !QQQ_SESSION.past) {
      q3 += qn("GEX", fmtBig(LIVE_GEX.net_gex),
        has(LIVE_GEX.net_dex) ? "DEX " + fmtBig(LIVE_GEX.net_dex) : "",
        "rgba(41,182,246,.25)", "var(--txt)", true);
    } else if (has(gx.net_gex)) {
      q3 += qn("GEX", fmtBig(gx.net_gex), "last close", "rgba(41,182,246,.15)", "var(--faint)", true);
    } else {
      q3 += qn("GEX", "—", "waiting", "rgba(41,182,246,.15)", "var(--faint)", true);
    }

    if (has(gx.gamma_ratio)) {
      q3 += qn("G Ratio", num(gx.gamma_ratio, 3), "", "rgba(41,182,246,.15)", "var(--faint)", true);
    } else {
      q3 += qn("G Ratio", "—", "", "rgba(41,182,246,.15)", "var(--faint)", true);
    }

    // ── Q4 BOTTOM-RIGHT: CONTEXT & CATALYST ──
    var q4 = '<div class="qqq-quad-title" style="color:var(--purple); justify-content:flex-end;">' +
      'Context &amp; Catalyst<span class="qdot" style="background:var(--purple)"></span></div>';

    var garch = get(e, "quant.garch");
    if (ok(garch) && has(garch.regime)) {
      q4 += qn("GARCH", has(garch.conditional_vol_pct) ? num(garch.conditional_vol_pct, 1, "%") : String(garch.regime).toLowerCase(),
        String(garch.regime).toLowerCase(),
        "rgba(41,182,246,.25)", "var(--info)", true);
    } else {
      q4 += qn("GARCH", "—", "waiting", "rgba(41,182,246,.2)", "var(--faint)", true);
    }

    var o2 = e.options;
    if (ok(o2) && has(o2.total_pc)) {
      var pcVal = o2.total_pc;
      var pcWord = pcVal >= 1.15 ? "put-heavy" : pcVal >= 0.95 ? "balanced" : pcVal >= 0.75 ? "call-lean" : "call-heavy";
      q4 += qn("P/C Skew", pcWord,
        num(pcVal, 2),
        "rgba(41,182,246,.2)", "var(--info)", true);
    } else {
      q4 += qn("P/C Skew", "—", "waiting", "rgba(41,182,246,.2)", "var(--faint)", true);
    }

    if (has(gx.net_vannaex)) {
      q4 += qn("Vanna/Charm", fmtBig(gx.net_vannaex),
        "charm " + (has(gx.net_charmex) ? fmtBig(gx.net_charmex) : "—"),
        "rgba(179,136,255,.35)", "var(--purple)", true);
    } else {
      q4 += qn("Vanna/Charm", "—", "2nd-order", "rgba(179,136,255,.2)", "var(--faint)", true);
    }

    var catAll = get(e, "calendar.us_high_impact", []);
    if (catAll && catAll.length) {
      var todayD = String(e.entry_date || "").slice(0, 10);
      var upC = catAll.filter(function (ev) { return String(ev.date || "").slice(0, 10) >= todayD; })
                      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
      if (!upC.length) upC = catAll.slice();
      var nx = upC[0];
      var nxName = String(nx.title || "event").replace(/\s*[—-]\s.*$/, "")
        .replace(/\b(m\/m|y\/y|q\/q)\b/ig, " ").replace(/\s+/g, " ").trim();
      var isToday = String(nx.date || "").slice(0, 10) === todayD;
      q4 += qn("Catalyst", nxName.length > 14 ? nxName.slice(0, 13) + "…" : nxName,
        isToday ? "TODAY" : fmtDate(String(nx.date).slice(0, 10)).replace(/<[^>]*>/g, ""),
        isToday ? "rgba(255,214,0,.4)" : "rgba(255,214,0,.25)",
        isToday ? "var(--warn)" : "var(--dim)", true);
    } else {
      q4 += qn("Catalyst", "—", "none", "rgba(107,60,104,.3)", "var(--faint)", true);
    }

    // ── CENTER HUB ──
    var hubBg, hubBorder;
    if (S.call === "STAND DOWN") {
      hubBg = "radial-gradient(circle, rgba(255,69,58,.1) 0%, transparent 70%)";
      hubBorder = "rgba(255,69,58,.35)";
    } else if (S.call === "LEAN FADE") {
      hubBg = "radial-gradient(circle, rgba(0,230,118,.08) 0%, transparent 70%)";
      hubBorder = "rgba(0,230,118,.35)";
    } else {
      hubBg = "radial-gradient(circle, rgba(255,214,0,.08) 0%, transparent 70%)";
      hubBorder = "rgba(255,214,0,.3)";
    }
    var callEmoji = S.call === "STAND DOWN" ? "✋ " : S.call === "LEAN FADE" ? "✅ " : "⚠️ ";
    var storyBits = [];
    if (qz !== null) storyBits.push("z " + signed(qz, 2));
    if (has(gx.regime)) storyBits.push(S.gpos ? "+γ pin" : "−γ amplify");

    var hub = '<div class="qqq-quad-hub-wrap"><div class="qqq-quad-hub" style="background:' + hubBg +
      ';border:2px solid ' + hubBorder + '">' +
      '<div class="qh-label">The Call</div>' +
      '<div class="qh-call" style="color:' + S.callColor + '">' + callEmoji + S.call.charAt(0) + S.call.slice(1).toLowerCase() + '</div>' +
      '<div class="qh-count">' + S.hostile + ' hostile · ' + S.friendly + ' friendly</div>' +
      (storyBits.length ? '<div class="qh-story">' + storyBits.join(" · ") + '</div>' : '') +
      '</div></div>';

    // ── COMPASS ROW — key prices ──
    var compass = '<div class="qqq-compass-row">';
    if (has(gx.gamma_flip)) {
      var flipDist = spot ? signed((gx.gamma_flip / spot - 1) * 100, 2, "%") : "";
      compass += '<div class="qqq-compass-chip" style="border-color:var(--accent); color:var(--accent);">' +
        '<div class="ck">γ Flip</div><div class="cv">$' + num(gx.gamma_flip, 2) + '</div>' +
        (flipDist ? '<div class="cs">' + flipDist + '</div>' : '') + '</div>';
    }
    if (spot !== null) {
      var qMove = q && has(q.pct_change) ? spot - spot / (1 + q.pct_change / 100) : null;
      compass += '<div class="qqq-compass-chip" style="border-color:var(--up); color:var(--up);">' +
        '<div class="ck">QQQ Live</div><div class="cv">$' + num(spot, 2) + '</div>' +
        (qMove !== null ? '<div class="cs">' + (qMove >= 0 ? "+$" : "−$") + Math.abs(qMove).toFixed(2) + '</div>' : '') +
        '</div>';
    }
    var ema9 = (typeof window._qqqEma9Last === "number") ? window._qqqEma9Last : null;
    var ema20 = (typeof window._qqqEma20Last === "number") ? window._qqqEma20Last : null;
    if (ema9 !== null || ema20 !== null) {
      compass += '<div class="qqq-compass-chip" style="border-color:var(--warn); color:var(--warn);">' +
        '<div class="ck">EMA 9 / 20</div><div class="cv" style="font-size:11px">' +
        (ema9 !== null ? num(ema9, 2) : "—") + ' / ' + (ema20 !== null ? num(ema20, 2) : "—") +
        '</div></div>';
    }
    if (vix !== null) {
      compass += '<div class="qqq-compass-chip" style="border-color:var(--dim); color:var(--dim);">' +
        '<div class="ck">VIX</div><div class="cv">' + num(vix, 2) + '</div></div>';
    }
    compass += '</div>';

    // THE BOX strip
    var box = qqqPlanBlock().replace('border-radius:7px', 'border-radius:0')
      .replace('margin-top:4px', 'margin-top:0')
      .replace('border:1px solid', 'border:1px solid var(--line);border-top:0;border-left:1px solid');

    // Story strip
    var synth = secSynthesis(e, chartModel);
    var storyHtml = '';
    if (synth) {
      var storyMatch = synth.match(/class="qqq-syn-v">(.*?)<\/div>/);
      var storyText = storyMatch ? storyMatch[1] : '';
      storyHtml = '<div class="qqq-story-strip">' +
        '<span class="sy-k">Story</span>' +
        '<span>' + storyText + '</span></div>';
    }

    // Signal legend
    var legend = '<div class="qqq-signal-legend">' +
      '<span><span class="ldot" style="background:var(--down)"></span>hostile</span>' +
      '<span><span class="ldot" style="background:var(--warn)"></span>caution</span>' +
      '<span><span class="ldot" style="background:var(--up)"></span>friendly</span>' +
      '<span><span class="ldot" style="background:var(--info)"></span>context</span>' +
      '<span><span class="ldot" style="background:var(--purple)"></span>greeks</span>' +
      '</div>';

    // Keep all four quadrants, the call and the price compass in one block.
    var cockpit = '<div id="qqq-quad-cockpit" class="qqq-quad-cockpit">' +
      '<div class="qqq-quad qqq-quad-tl">' + q1 + '</div>' +
      hub +
      '<div class="qqq-quad qqq-quad-tr">' + q2 + '</div>' +
      '<div class="qqq-quad qqq-quad-bl">' + q3 + '</div>' +
      '<div class="qqq-quad qqq-quad-br">' + q4 + '</div>' +
      compass +
      '</div>';
    return cockpit + box + storyHtml + legend;
  }

  // Full model detail — used by the deep dive "QQQ · full model detail" section.
  // The glance view is secQuadrantCockpit() above; this one keeps the
  // auction/context/news tiles for the expanded panel.
  function secCockpit(e, chartModel, omitPlan) {
    var S = nasdaqCommandModel(e, chartModel);
    function tile(label, big, sub, cn) {
      // Auction and Context use the exact same chip as the command signals.
      var tone = cn === "flat" ? "info" : (cn || "dim");
      return '<span class="qqq-hud-chip ' + tone + '">' +
        '<span class="k">' + esc(label) + "</span>" +
        '<span class="v">' + big + "</span>" +
        (sub ? '<span class="sub">' + sub + "</span>" : "") +
        "</span>";
    }

    // Compact pairwise-correlation table for any symbol set (glance version of
    // the Market Dash correlation card). Same Pearson math, no dollar-move bars.
    function corrPanel(symbols, title) {
      var nH = H.length;
      var ser = {};
      symbols.forEach(function (s) { ser[s] = []; });
      H.forEach(function (entry) {
        var by = {};
        (entry.watchlist || []).forEach(function (w) { by[w.symbol] = w; });
        symbols.forEach(function (s) { var w = by[s]; ser[s].push(w && has(w.pct_change) ? w.pct_change : null); });
      });
      var pairs = [];
      for (var a = 0; a < symbols.length; a++) {
        for (var b = a + 1; b < symbols.length; b++) {
          var xs = [], ys = [];
          for (var i = 0; i < nH; i++) {
            if (ser[symbols[a]][i] !== null && ser[symbols[b]][i] !== null) {
              xs.push(ser[symbols[a]][i]); ys.push(ser[symbols[b]][i]);
            }
          }
          if (xs.length < 5) continue;
          var mx = xs.reduce(function (p, c2) { return p + c2; }, 0) / xs.length;
          var my = ys.reduce(function (p, c2) { return p + c2; }, 0) / ys.length;
          var sxy = 0, sxx = 0, syy = 0;
          for (var k = 0; k < xs.length; k++) {
            var dx = xs[k] - mx, dy = ys[k] - my;
            sxy += dx * dy; sxx += dx * dx; syy += dy * dy;
          }
          if (!sxx || !syy) continue;
          pairs.push({ a: symbols[a], b: symbols[b], r: sxy / Math.sqrt(sxx * syy), n: xs.length });
        }
      }
      if (!pairs.length) {
        return '<div style="font-size:11px;color:var(--faint);margin:2px 0 10px">' + esc(title) +
          " &mdash; needs ~5 shared sessions per pair; filling in as the logger runs.</div>";
      }
      pairs.sort(function (p1, p2) { return Math.abs(p2.r) - Math.abs(p1.r); });
      var out = '<div style="font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:6px">' + esc(title) + "</div>" +
        "<table><tr><th>Pair</th><th style='text-align:right'>Correlation</th>" +
        "<th style='text-align:right'>Sessions</th></tr>";
      pairs.slice(0, 10).forEach(function (p) {
        var col = p.r > 0.5 ? "var(--up)" : p.r < -0.5 ? "var(--down)" : "var(--dim)";
        out += "<tr><td>" + p.a + " / " + p.b + "</td>" +
          '<td class="num" style="color:' + col + '">' + p.r.toFixed(2) + "</td>" +
          '<td class="num" style="color:var(--faint)">' + p.n + "</td></tr>";
      });
      return out + '</table><div style="height:12px"></div>';
    }

    var tiles = "";

    var g = S.geometry;
    if (ok(g) && has(g.diversification_volume)) {
      var vol = g.diversification_volume;
      tiles += tile("Regime √det(G)", num(vol, 3),
        vol < 0.15 ? "collapsed · stand down" : vol < 0.35 ? "thin · trade small" : "healthy · fades ok",
        vol < 0.15 ? "down" : vol < 0.35 ? "warn" : "up");
    }

    var vr2 = S.vr2;
    if (vr2 !== null) {
      tiles += tile("Fade regime VR(2)", num(vr2, 2),
        vr2 < 0.9 ? "mean-revert · fade" : vr2 > 1.1 ? "trending · hostile" : "random · no edge",
        vr2 < 0.9 ? "up" : vr2 > 1.1 ? "down" : "dim");
    }

    // The merged cockpit must agree with the live chart/profile on the newest
    // session, while historical selections keep their saved GEX map.
    var gx = S.g;
    if (ok(gx) && has(gx.regime)) {
      var pos = gx.regime === "POSITIVE GAMMA";
      tiles += tile("Gamma regime", pos ? "+γ" : "−γ",
        (pos ? "dampen · fade ok" : "amplify · hostile") +
        (has(gx.gamma_flip) ? " · flip " + num(gx.gamma_flip, 0) : ""),
        pos ? "up" : "down");
    }

    var ri = S.realized;
    if (ok(ri) && has(ri.spread_pct)) {
      var sp = ri.spread_pct;
      tiles += tile("Realized − implied", signed(sp, 1, "pp"),
        sp > 0 ? "your edge · long γ paid" : "seller's tape",
        sp > 0 ? "up" : "down");
    }

    var mk = S.mk;
    var vix = S.vix, q = S.q;
    if (has(vix) && q && has(q.last) && has(q.pct_change)) {
      var exp = vix / Math.sqrt(252) / 100;
      var used = exp > 0 ? Math.abs(q.pct_change) / (exp * 100) : 0;
      tiles += tile("Range used", (used * 100).toFixed(0) + "%",
        used < 0.5 ? "room left" : used < 1 ? "half spent" : "blown 1σ",
        used < 0.5 ? "up" : used < 1 ? "warn" : "down");
    }

    // Rich detail line from a GEX snapshot: net · flip(+dist) · walls · spot.
    function gexDetail(G) {
      var L = G.levels || {};
      var bits = [];
      if (has(G.net_gex)) bits.push("net " + fmtBig(G.net_gex));
      if (has(G.gamma_flip)) bits.push("flip " + num(G.gamma_flip, 0) +
        (has(G.distance_to_flip_pct) ? " " + signed(G.distance_to_flip_pct, 2, "%") : ""));
      var walls = [];
      if (has(L.call_wall)) walls.push(num(L.call_wall, 0));
      if (has(L.put_wall)) walls.push(num(L.put_wall, 0));
      var line2 = [];
      if (walls.length) line2.push("walls " + walls.join(" / "));
      if (has(G.spot)) line2.push("spot " + num(G.spot, 2));
      return bits.join(" · ") + (line2.length ? "<br>" + line2.join(" · ") : "");
    }
    if (LIVE_GEX && has(LIVE_GEX.net_gex)) {
      var ts = Date.parse(String(LIVE_GEX.generated_utc || "").replace(" ", "T") + "Z");
      var ageMin = isFinite(ts) ? (Date.now() - ts) / 60000 : 1e9;
      var lpos = LIVE_GEX.regime === "POSITIVE GAMMA";
      if (ageMin > 30) {
        // Logger off (after hours) — still show the last REAL reading, greyed,
        // with its age and detail — never a dead "STALE".
        var ageTxt = !isFinite(ts) ? "no stamp"
          : ageMin >= 120 ? Math.round(ageMin / 60) + "h ago"
          : Math.round(ageMin) + "m ago";
        tiles += tile("Live GEX", lpos ? "+γ" : "−γ",
          "0DTE ±$15 · last logged " + ageTxt + "<br>" + gexDetail(LIVE_GEX), "dim");
      } else {
        tiles += tile("Live GEX", lpos ? "+γ" : "−γ",
          "0DTE ±$15 · " + (lpos ? "dampen" : "amplify") + " · live<br>" + gexDetail(LIVE_GEX),
          lpos ? "up" : "down");
      }
    } else if (ok(gx) && has(gx.regime)) {
      // No live snapshot — fall back to the twice-daily API GEX (≤30d ±10%, different engine).
      var fpos = gx.regime === "POSITIVE GAMMA";
      tiles += tile("Live GEX", fpos ? "+γ" : "−γ",
        "≤30d ±10% · last close<br>" + gexDetail(gx), "dim");
    }

    if (!tiles) tiles = '<div style="color:var(--faint);font-size:13px;padding:20px">No live signals for this session yet.</div>';

    var stamp = '<div style="display:flex;justify-content:space-between;align-items:baseline;' +
      'font-size:12px;color:var(--dim);margin:2px 0 10px">' +
      '<span style="letter-spacing:2px">𝜎u𝜎 — NASDAQ COCKPIT</span>' +
      '<span>' + (q && has(q.last) ? "QQQ " + num(q.last, 2) + "  ·  " : "") + "entry window 7:17 PT</span></div>";

    // ── THE CALL — synthesis read (a LEAN, not a command; signal not validated) ──
    var hostile = [], friendly = [];
    if (ok(g) && has(g.diversification_volume)) {
      if (g.diversification_volume < 0.15) hostile.push("regime collapsed");
      else if (g.diversification_volume >= 0.35) friendly.push("regime healthy");
    }
    if (ok(gx) && has(gx.regime)) {
      if (gx.regime === "POSITIVE GAMMA") friendly.push("positive gamma");
      else hostile.push("negative gamma");
    }
    if (vr2 !== null) {
      if (vr2 > 1.1) hostile.push("trending");
      else if (vr2 < 0.9) friendly.push("mean-reverting");
    }
    var banner;
    if (!hostile.length && !friendly.length) {
      banner = '<div style="border:1px dashed var(--line);border-radius:12px;padding:18px;' +
        'margin-bottom:12px;text-align:center;color:var(--faint);font-size:12px;letter-spacing:2.5px">' +
        "THE CALL &mdash; waiting on signals</div>";
    } else {
      var lean, ccol;
      if (hostile.length >= 2) { lean = "Stand down"; ccol = "var(--down)"; }
      else if (friendly.length >= 2 && hostile.length === 0) { lean = "Lean fade"; ccol = "var(--up)"; }
      else { lean = "Mixed"; ccol = "var(--warn)"; }
      var drivers = (hostile.length ? hostile : friendly).slice(0, 3).join(" + ");
      var caveat = "";
      if (ok(ri) && has(ri.spread_pct)) {
        caveat = ri.spread_pct > 0
          ? "realized > implied — your long gamma is paid"
          : "implied ≥ realized — theta works against you";
      }
      banner = '<div style="border-left:4px solid ' + ccol + ';background:rgba(140,20,20,0.090);' +
        'border-radius:12px;padding:15px 20px;margin-bottom:12px">' +
        '<div style="font-size:10.5px;letter-spacing:2px;color:var(--dim);text-transform:uppercase">The call</div>' +
        '<div style="font-size:22px;font-weight:700;color:' + ccol + ';margin-top:2px;line-height:1.15">' +
        '<span style="vertical-align:1px">&#9679;</span> ' + lean + "</div>" +
        '<div style="font-size:13px;color:var(--dim);margin-top:5px">' + drivers +
        (caveat ? '. <span style="color:var(--faint)">' + caveat + "</span>" : "") +
        '</div><div style="font-size:10.5px;color:var(--faint);margin-top:3px;letter-spacing:1px">' +
        "a lean, not a command &mdash; signal still validating</div></div>";
    }

    var grid = '<div style="margin-top:16px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
      'text-transform:uppercase;margin-bottom:6px">Signals</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">' +
      tiles + "</div>";

    var legend = '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--dim)">' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--up);vertical-align:-1px"></span> fade-friendly</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--warn);vertical-align:-1px"></span> caution</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--down);vertical-align:-1px"></span> fade-hostile</span>' +
      '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--dim);vertical-align:-1px"></span> stale/off</span></div>';

    // ── Auction (IEX) — VWAP · ADL · Opening range · Volume ──
    // Live from the 60s logger's QQQ 1-min IEX bars (auction_live.json). IEX is a
    // tape SUBSET, so tiles note IEX — not the exact consolidated tape. Imagery-
    // first: on the latest session the box ALWAYS renders — greyed "waiting"
    // shells until the session's first logger run writes real data, which then
    // drops into place. The placeholder shows "—", never a fake value.
    var auctBlk = "";
    if (idx === FULL.length - 1) {
      var A = LIVE_AUCTION;
      var haveA = A && (has(A.vwap) || has(A.ad_z) || has(A.or30_high) || has(A.vol_pace));
      var at = "", aStale = false, aAgeTxt = "";
      if (haveA) {
        var ats = Date.parse(String(A.generated_utc || "").replace(" ", "T") + "Z");
        var aAge = isFinite(ats) ? (Date.now() - ats) / 60000 : 1e9;
        aStale = aAge > 30;
        aAgeTxt = !isFinite(ats) ? "no stamp"
          : aAge >= 120 ? Math.round(aAge / 60) + "h ago"
          : Math.round(aAge) + "m ago";
        var aTag = aStale ? " · " + aAgeTxt : "";
        // VWAP tile removed — now a line on the chart.
        at += tile("ADL", has(A.ad_z) ? "z " + signed(A.ad_z, 2) : "—",
          (has(A.ad_z) ? (A.ad_z > 0 ? "accum · gate open" : "distrib · gate shut") : "gate"),
          (aStale || !has(A.ad_z)) ? "dim" : (A.ad_z > 0 ? "up" : "down"));
        // Opening range tile removed — now OR high/low lines on the chart.
        at += tile("Volume", has(A.vol_pace) ? num(A.vol_pace, 2) + "×" : "—",
          "pace vs session avg",
          (aStale || !has(A.vol_pace)) ? "dim" : (A.vol_pace >= 1.3 ? "warn" : A.vol_pace <= 0.7 ? "dim" : "flat"));
      } else {
        // placeholder shells — layout on screen now, real numbers slot in next run
        var wait = "waiting for this session";
        at = tile("VWAP", "—", wait + " · IEX", "dim") +
             tile("ADL", "—", "gate · " + wait, "dim") +
             tile("Opening range", "—", "OR30 · " + wait, "dim") +
             tile("Volume", "—", wait + " · IEX", "dim");
      }
      auctBlk = '<div style="margin-top:6px;font-size:10.5px;color:var(--dim);letter-spacing:1px;' +
        'text-transform:uppercase;margin-bottom:4px">Auction — IEX' +
        (aStale ? ' <span style="color:var(--faint);letter-spacing:0">· last logged ' + aAgeTxt + '</span>' : '') +
        '</div><div class="qqq-command-chips">' +
        at + "</div>";
    }

    // ── Context tiles: risk/timing first, mechanics next, reference last. ──
    var ctxUrgent = "", ctxMechanics = "", ctxSecondary = "";
    var g2 = get(e, "quant.garch");
    if (ok(g2) && has(g2.regime) && has(g2.conditional_vol_pct)) {
      ctxUrgent += tile("Vol regime (GARCH)", num(g2.conditional_vol_pct, 1, "%"),
        String(g2.regime).toLowerCase() +
        (has(g2.unconditional_vol_pct) ? " · uncond " + num(g2.unconditional_vol_pct, 1, "%") : ""),
        /HIGH/i.test(g2.regime) ? "warn" : "info");
    }
    // Expected move tile removed — same ±1σ shown in Key levels above.
    var o2 = e.options;
    if (ok(o2) && has(o2.total_pc)) {
      var t = o2.total_pc;
      var lean = t >= 1.15 ? "put-heavy" : t >= 0.95 ? "balanced" : t >= 0.75 ? "call-lean" : "very call-heavy";
      var ieTxt = (has(o2.index_pc) && has(o2.equity_pc))
        ? " · " + signed(o2.index_pc - o2.equity_pc, 2) + " idx−eq" : "";
      ctxMechanics += tile("P/C skew", num(t, 2), lean + ieTxt,

  // ---------- LIVE PRICES (client-side, browser-only) ----------
  // The twice-daily GitHub run writes a FROZEN snapshot of prices. This layer

  // watchlist, and the sector donut: every time the page is open it pulls
  // real-time quotes from Finnhub (a browser-friendly free quote API) and
  // refreshes on a timer. PURELY ADDITIVE: if a fetch fails (offline, key over
  // quota, source down) the snapshot values stay exactly as they were. It never
  // blanks and never shows NaN.
  function startLivePrices() {
    // ---- TWEAK ZONE ----
    // Free Finnhub API key. Read-only stock/ETF quotes, rate-limited (60/min).
    // It is PUBLIC in this file by design (client-side runs in your browser). If
    // it ever gets abused, regenerate a new one free at finnhub.io and paste it
    // here in place of this one.
    var FINNHUB_KEY = "d9l0n6hr01qoc1b3pu0gd9l0n6hr01qoc1b3pu10";
    // --------------------
    var BASE = "https://finnhub.io/api/v1/quote?symbol=";
    var LIVE = {};              // symbol -> {last, pct, srcTime(ms)}

    // ── QQQ Buy / Sell volume tracker ──────────────────────────
    // Approximates buy vs sell pressure by tracking QQQ price direction
    // on each poll. Price up → buy tick, price down → sell tick.
    // Resets at midnight ET each day.
    var QQQ_VOL_TRACKER = {
      buyTicks: 0, sellTicks: 0,
      lastPrice: null,
      resetDate: null,
      history: []          // {time, buy, sell} snapshots for the mini sparkline
    };
    window.QQQ_VOL_TRACKER = QQQ_VOL_TRACKER;

    function trackQqqVolume(price) {
      if (typeof price !== 'number' || price <= 0) return;
      // Reset at new ET trading day
      var etDate = new Date().toLocaleDateString('en-US', { timeZone: 'America/New_York' });
      if (QQQ_VOL_TRACKER.resetDate !== etDate) {
        QQQ_VOL_TRACKER.buyTicks = 0;
        QQQ_VOL_TRACKER.sellTicks = 0;
        QQQ_VOL_TRACKER.lastPrice = null;
        QQQ_VOL_TRACKER.history = [];
        QQQ_VOL_TRACKER.resetDate = etDate;
      }
      if (QQQ_VOL_TRACKER.lastPrice !== null) {
        var delta = price - QQQ_VOL_TRACKER.lastPrice;
        if (delta > 0) QQQ_VOL_TRACKER.buyTicks++;
        else if (delta < 0) QQQ_VOL_TRACKER.sellTicks++;
        // snapshot every tick for sparkline
        QQQ_VOL_TRACKER.history.push({
          time: Date.now(),
          buy: QQQ_VOL_TRACKER.buyTicks,
          sell: QQQ_VOL_TRACKER.sellTicks
        });
        // keep last 200 snapshots max
        if (QQQ_VOL_TRACKER.history.length > 200) QQQ_VOL_TRACKER.history.shift();
      }
      QQQ_VOL_TRACKER.lastPrice = price;
    }
    var everOk = false;

    // Every symbol the latest session shows: the watchlist rows (stars + the
    // rest) AND the sector-ETF tickers behind the donut. Index products like
    // DXY and VIX are not on Finnhub's free tier — they come back empty and stay
    // on the snapshot, no harm done.
    function wantedSymbols() {
      var set = {};
      if (FULL.length) {
        var latest = FULL[FULL.length - 1];
        (latest.watchlist || []).forEach(function (r) {
          if (r && r.symbol) set[r.symbol] = 1;
        });
        ((latest.sectors && latest.sectors.rows) || []).forEach(function (r) {
          if (r && r.ticker) set[r.ticker] = 1;
        });
      }
      return Object.keys(set);
    }

    function fetchOne(sym) {
      return fetch(BASE + sym + "&token=" + FINNHUB_KEY)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (q) {
          // Finnhub quote: c=current, d=$ change, dp=% change, t=unix seconds.
          // c is 0 for an unknown symbol or before the first print — skip those.
          if (!q || typeof q.c !== "number" || q.c <= 0) return;
          LIVE[sym] = {
            last: q.c,
            pct:  (typeof q.dp === "number") ? q.dp : null,
            srcTime: (typeof q.t === "number" && q.t > 0) ? q.t * 1000 : null
          };
          if (sym === "QQQ") trackQqqVolume(q.c);
        })
        .catch(function () { /* offline / blocked / bad symbol -> keep snapshot */ });
    }

    // VIX isn't on Finnhub's free tier — pull it live (~15-min delayed) from
    // Cboe's public delayed-quote CDN so the VIX tile AND everything keyed off it
    // (range used, expected move, touch odds) refresh every minute. Fails silently
    // if the CDN blocks cross-origin, in which case VIX just keeps the snapshot.
    function fetchVix() {
      return fetch("https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json?t=" + Date.now(),

  return Object.keys(m).sort();
}

// ── Filter lots by date range ──
function _filterLots(filter){
  if(filter==='ALL') return null; // signal to use PERF directly
  var from,to='9999-12-31';
  if(filter==='1W'){from=_daysAgo(7);}
  else if(filter==='1M'){from=_daysAgo(30);}
  else if(filter==='3M'){from=_daysAgo(90);}
  else if(filter==='6M'){from=_daysAgo(180);}
  else if(filter==='YTD'){from=_yearStart();}
  else{from=filter+'-01';to=filter+'-31';}// month like "2026-06"
  var out=[];
  for(var i=0;i<PERF_LOTS.length;i++){
    var d=PERF_LOTS[i][L.DATE];
    if(d>=from&&d<=to) out.push(PERF_LOTS[i]);
  }
  return out;
}

// ═══════════════════════════════════════════════
// COMPUTE PERF-LIKE OBJECT FROM FILTERED LOTS
// ═══════════════════════════════════════════════
function _computePerf(lots){
  if(!lots||!lots.length) return null;

  // ── Equity ──
  var dayMap={};
  lots.forEach(function(l){
    var d=l[L.DATE];
    if(!dayMap[d]) dayMap[d]={trade_date:d,day_pnl:0,lots:0,wins:0};
    dayMap[d].day_pnl+=l[L.PNL];
    dayMap[d].lots++;
    if(l[L.WL]===1) dayMap[d].wins++;
  });
  var equity=Object.values(dayMap).sort(function(a,b){return a.trade_date<b.trade_date?-1:1;});
  var cum=0;
  equity.forEach(function(e){cum+=e.day_pnl;e.cum_pnl=cum;});

  // ── Winrate ──
  var total=lots.length, wins=0, losses=0, be=0, net=0;
  var byType={call:{total:0,wins:0,pnl:0},put:{total:0,wins:0,pnl:0}};
  lots.forEach(function(l){
    net+=l[L.PNL];
    if(l[L.WL]===1) wins++;
    else if(l[L.WL]===-1) losses++;
    else be++;
    var t=TYPE_LABELS[l[L.TYPE]];
    byType[t].total++;
    if(l[L.WL]===1) byType[t].wins++;
    byType[t].pnl+=l[L.PNL];
  });
  var winrate={total:total,wins:wins,losses:losses,be:be,net_pnl:Math.round(net),
    expectancy:total?Math.round(net/total*100)/100:0,
    by_type:[{option_type:'call',total:byType.call.total,wins:byType.call.wins,pnl:Math.round(byType.call.pnl)},
             {option_type:'put',total:byType.put.total,wins:byType.put.wins,pnl:Math.round(byType.put.pnl)}]};

  // ── Edges ──
  var edgeMap={};
  lots.forEach(function(l){
    var key=TYPE_LABELS[l[L.TYPE]]+'_'+HOLD_LABELS[l[L.HOLD]];
    if(!edgeMap[key]) edgeMap[key]={option_type:TYPE_LABELS[l[L.TYPE]],hold_bucket:HOLD_LABELS[l[L.HOLD]],n:0,wins:0,gross_win:0,gross_loss:0,pnl:0};
    edgeMap[key].n++;
    if(l[L.WL]===1){edgeMap[key].wins++;edgeMap[key].gross_win+=l[L.PNL];}
    else if(l[L.PNL]<0) edgeMap[key].gross_loss+=l[L.PNL];
    edgeMap[key].pnl+=l[L.PNL];
  });
  var edges=Object.values(edgeMap);
  edges.sort(function(a,b){return b.pnl-a.pnl;});

  // ── Heatmap ──
  var heatMap={};
  lots.forEach(function(l){
    var key=DOW_LABELS[l[L.DOW]]+'_'+SES_LABELS[l[L.SES]];
    if(!heatMap[key]) heatMap[key]={dow:DOW_LABELS[l[L.DOW]],dow_num:l[L.DOW]+1,session:SES_LABELS[l[L.SES]],n:0,wins:0,pnl:0};
    heatMap[key].n++;
    if(l[L.WL]===1) heatMap[key].wins++;
    heatMap[key].pnl+=l[L.PNL];
  });
  var heatmap=Object.values(heatMap);

  // ── Hold time ──
  var holdMap={};
  HOLD_LABELS.forEach(function(hb){holdMap[hb]={hold_bucket:hb,n:0,wins:0,pnl:0};});
  lots.forEach(function(l){
    var hb=HOLD_LABELS[l[L.HOLD]];
    holdMap[hb].n++;
    if(l[L.WL]===1) holdMap[hb].wins++;
    holdMap[hb].pnl+=l[L.PNL];
  });
  var hold_time=HOLD_LABELS.map(function(hb){
    var h=holdMap[hb];
    h.avg_pnl=h.n?Math.round(h.pnl/h.n*100)/100:0;
    return h;
  });

  // ── R Distribution ──
  var buckets=[
    {bucket:'-$200 to -$100',lo:-Infinity,hi:-100},
    {bucket:'-$100 to -$50',lo:-100,hi:-50},
    {bucket:'-$50 to $0',lo:-50,hi:0},
    {bucket:'$0 to $50',lo:0,hi:50},
    {bucket:'$50 to $100',lo:50,hi:100},
    {bucket:'$100 to $200',lo:100,hi:200},
    {bucket:'$200 to $500',lo:200,hi:500},
    {bucket:'$500+',lo:500,hi:Infinity}
  ];
  var r_dist=buckets.map(function(b){return{bucket:b.bucket,n:0,pnl:0,_lo:b.lo,_hi:b.hi};});
  lots.forEach(function(l){
    var p=l[L.PNL];
    for(var i=0;i<r_dist.length;i++){
      if(p>=r_dist[i]._lo&&p<r_dist[i]._hi){r_dist[i].n++;r_dist[i].pnl+=p;break;}
    }
  });
  // Edge case: exactly 0 goes in -$50 to $0
  // $500+ bucket: >=500
  r_dist.forEach(function(b){delete b._lo;delete b._hi;});

  // ── Monthly ──
  var mMap={};
  lots.forEach(function(l){
    var m=l[L.DATE].slice(0,7);
    if(!mMap[m]) mMap[m]={month:m,pnl:0,lots:0,wins:0};
    mMap[m].pnl+=l[L.PNL];mMap[m].lots++;
    if(l[L.WL]===1) mMap[m].wins++;
  });
  var monthly=Object.values(mMap).sort(function(a,b){return a.month<b.month?-1:1;});

  // ── Revenge (simplified: re-entry within 5min after a loss) ──
  var revN=0,revWins=0,revPnl=0,normN=0,normWins=0,normPnl=0;
  for(var i=0;i<lots.length;i++){
    var isRevenge=false;
    if(i>0&&lots[i-1][L.WL]===-1){
      var prevExit=lots[i-1][L.EXIT],curEntry=lots[i][L.ENTRY];
      if(prevExit&&curEntry){
        var pe=new Date(prevExit.replace(' ','T')),ce=new Date(curEntry.replace(' ','T'));
        var diff=(ce-pe)/60000;
        if(diff>=0&&diff<=5) isRevenge=true;
      }
    }
    if(isRevenge){revN++;if(lots[i][L.WL]===1)revWins++;revPnl+=lots[i][L.PNL];}
    else{normN++;if(lots[i][L.WL]===1)normWins++;normPnl+=lots[i][L.PNL];}
  }
  var revenge=[
    {category:'normal',n:normN,wins:normWins,pnl:Math.round(normPnl),avg_pnl:normN?Math.round(normPnl/normN*100)/100:0},
    {category:'revenge',n:revN,wins:revWins,pnl:Math.round(revPnl),avg_pnl:revN?Math.round(revPnl/revN*100)/100:0}
  ];

  // ── Streaks ──
  var streaks=[], curStreak=null;
  lots.forEach(function(l){
    var type=l[L.WL]===1?'win':'loss';
    if(l[L.WL]===0) type='loss'; // breakeven = loss for streaks
    if(!curStreak){curStreak={streak_type:type,streak_len:1,started:l[L.ENTRY],ended:l[L.EXIT]};}
    else if(curStreak.streak_type===type){curStreak.streak_len++;curStreak.ended=l[L.EXIT];}
    else{streaks.push(curStreak);curStreak={streak_type:type,streak_len:1,started:l[L.ENTRY],ended:l[L.EXIT]};}
  });
  if(curStreak) streaks.push(curStreak);
  streaks.sort(function(a,b){return b.streak_len-a.streak_len;});
  var current_streak=curStreak?{streak_type:curStreak.streak_type,streak_len:curStreak.streak_len}:{streak_type:'loss',streak_len:0};
  var maxW=0,maxL=0;
  streaks.forEach(function(s){if(s.streak_type==='win'&&s.streak_len>maxW)maxW=s.streak_len;if(s.streak_type==='loss'&&s.streak_len>maxL)maxL=s.streak_len;});

  return {equity:equity,winrate:winrate,edges:edges,heatmap:heatmap,
    revenge:revenge,streaks:streaks.slice(0,20),current_streak:current_streak,
    max_win_streak:maxW,max_loss_streak:maxL,r_dist:r_dist,hold_time:hold_time,
    rules:PERF.rules,monthly:monthly};
}

// ═══════════════════════════════════════════════
// GET DATA FOR A WIDGET (filtered or ALL)
// ═══════════════════════════════════════════════
function _getPerfData(widgetId){
  var f=PERF_FILTER[widgetId]||'ALL';
  if(f==='ALL') return PERF;
  var lots=_filterLots(f);
  if(!lots||!lots.length) return null;
  return _computePerf(lots);
}

// ═══════════════════════════════════════════════
// FILTER BAR
// ═══════════════════════════════════════════════
function _filterBar(widgetId){
  var cur=PERF_FILTER[widgetId]||'ALL';
  var presets=['1W','1M','3M','6M','YTD','ALL'];
  var months=_getMonths();
  var isMonth=cur.length===7&&cur.indexOf('-')===4; // "2026-06" format

  var html='<div style="display:flex;align-items:center;gap:3px;margin-bottom:6px;flex-wrap:wrap">';
  presets.forEach(function(p){
    var active=cur===p;
    var bg=active?'rgba(0,229,204,0.18)':'rgba(140,20,20,0.08)';
    var col=active?'#00e5cc':'rgba(200,160,160,0.5)';
    var bdr=active?'1px solid rgba(0,229,204,0.3)':'1px solid rgba(140,20,20,0.12)';
    html+='<button onclick="perfSetFilter(\''+widgetId+'\',\''+p+'\')" style="background:'+bg+';color:'+col+';border:'+bdr+';border-radius:3px;padding:2px 6px;font-size:8px;font-family:ui-monospace,monospace;cursor:pointer;letter-spacing:0.05em">'+p+'</button>';
  });
  // Month dropdown
  html+='<select onchange="perfSetFilter(\''+widgetId+'\',this.value)" style="background:rgba(140,20,20,0.08);color:'+(isMonth?'#00e5cc':'rgba(200,160,160,0.5)')+';border:1px solid '+(isMonth?'rgba(0,229,204,0.3)':'rgba(140,20,20,0.12)')+';border-radius:3px;padding:2px 4px;font-size:8px;font-family:ui-monospace,monospace;cursor:pointer">';
  html+='<option value=""'+(isMonth?'':' selected')+'>Month</option>';
  months.forEach(function(m){
    var label=m.slice(2); // "25-06"
    html+='<option value="'+m+'"'+(cur===m?' selected':'')+'>'+label+'</option>';
  });
  html+='</select>';
  html+='</div>';
  return html;
}

// ── Global filter setter + re-render ──
function perfSetFilter(widgetId, value){
  if(!value) return;
  PERF_FILTER[widgetId]=value;
  // Find widget instances with this definitionId via the layout data
  var lay=activeLayout();
  if(!lay||!lay.widgets) return;
  lay.widgets.forEach(function(w){
    if(w.definitionId===widgetId){
      var el=document.querySelector('.widget[data-wid="'+w.id+'"] .widget-body');
      if(el) el.innerHTML=PERF_WIDGETS[widgetId]();
    }
  });
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function perfSvg(w, h) { return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">'; }
function perfNum(n) { return n >= 0 ? '+$'+Math.abs(Math.round(n)).toLocaleString() : '-$'+Math.abs(Math.round(n)).toLocaleString(); }
function perfPct(n, d) { return d ? (100*n/d).toFixed(1)+'%' : '0%'; }
function perfLabel(t) { return '<div style="color:rgba(200,160,160,0.45);font-size:8px;letter-spacing:0.15em;margin-bottom:3px">'+t+'</div>'; }

// ═══════════════════════════════════════════════
// WIDGET 1: PERFORMANCE
// ═══════════════════════════════════════════════
function renderPerformanceWidget() {
  var D=_getPerfData('perf-performance');
  var css='font-family:ui-monospace,monospace;font-size:10px;display:grid;gap:6px;height:100%;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto auto;';
  var html='<div style="'+css+'">';
  html+='<div style="grid-column:1/-1">'+_filterBar('perf-performance')+'</div>';
  if(!D){html+='<div style="grid-column:1/-1;color:rgba(200,160,160,0.5);font-size:11px;padding:20px;text-align:center">No trades in this period</div></div>';return html;}
  html+='<div style="grid-column:1/-1">'+_miniEquity(D)+'</div>';
  html+='<div style="padding:2px">'+_compactWinRate(D)+'</div>';
  html+='<div style="padding:2px">'+perfLabel('MONTHLY')+_compactMonthly(D)+'</div>';
  html+='<div style="padding:2px">'+perfLabel('EDGES & LEAKS')+_compactEdges(D)+'</div>';
  html+='<div style="padding:2px">'+perfLabel('HOLD TIME')+_compactHoldTime(D)+perfLabel('R DISTRIBUTION')+_compactRDist(D)+'</div>';
  html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('SESSION HEATMAP')+_compactHeatmap(D)+'</div>';
  html+='</div>';
  return html;
}

// ═══════════════════════════════════════════════
// WIDGET 2: DISCIPLINE
// ═══════════════════════════════════════════════
function renderDisciplineWidget() {
  var D=_getPerfData('perf-discipline');
  var css='font-family:ui-monospace,monospace;font-size:10px;display:grid;gap:6px;height:100%;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto;';
  var html='<div style="'+css+'">';
  html+='<div style="grid-column:1/-1">'+_filterBar('perf-discipline')+'</div>';
  if(!D){html+='<div style="grid-column:1/-1;color:rgba(200,160,160,0.5);font-size:11px;padding:20px;text-align:center">No trades in this period</div></div>';return html;}
  html+='<div style="padding:2px">'+_compactRevenge(D)+'</div>';
  html+='<div style="padding:2px">'+_compactStreaks(D)+'</div>';
  html+='<div style="grid-column:1/-1;padding:2px">'+_compactRules(D)+'</div>';
  html+='<div style="grid-column:1/-1;padding:2px">'+perfLabel('SESSION HEATMAP')+_compactHeatmap(D)+'</div>';
  html+='</div>';
  return html;
}

// ═══════════════════════════════════════════════
// SECTION RENDERERS (all take data param D)
// ═══════════════════════════════════════════════

function _miniEquity(D) {
  var d=D.equity;
  if(!d||!d.length) return '';
  var W=520,H=120,pad={top:8,right:46,bottom:18,left:4};
  var pW=W-pad.left-pad.right,pH=H-pad.top-pad.bottom;
  var yMin=Infinity,yMax=-Infinity;
  for(var i=0;i<d.length;i++){if(d[i].cum_pnl<yMin)yMin=d[i].cum_pnl;if(d[i].cum_pnl>yMax)yMax=d[i].cum_pnl;}
  var yPad=(yMax-yMin)*0.1||100;yMin-=yPad;yMax+=yPad;
  function x(i){return pad.left+i/(Math.max(1,d.length-1))*pW;}
  function y(v){return pad.top+(1-(v-yMin)/(yMax-yMin))*pH;}
  var svg=perfSvg(W,H);
  for(var g=0;g<=3;g++){
    var gy=pad.top+g/3*pH,gv=yMax-g/3*(yMax-yMin);
    svg+='<line x1="'+pad.left+'" y1="'+gy.toFixed(1)+'" x2="'+(pad.left+pW)+'" y2="'+gy.toFixed(1)+'" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>';
    svg+='<text x="'+(W-pad.right+3)+'" y="'+(gy+3).toFixed(1)+'" fill="rgba(255,255,255,0.2)" font-size="7" font-family="ui-monospace,monospace">'+perfNum(Math.round(gv))+'</text>';
  }
  if(yMin<0&&yMax>0){var zy=y(0);svg+='<line x1="'+pad.left+'" y1="'+zy.toFixed(1)+'" x2="'+(pad.left+pW)+'" y2="'+zy.toFixed(1)+'" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" stroke-dasharray="3,3"/>';}
  var pts='';for(var i=0;i<d.length;i++){pts+=x(i).toFixed(1)+','+y(d[i].cum_pnl).toFixed(1)+' ';}
  var last=d[d.length-1].cum_pnl;
  var aCol=last>=0?'0,229,204':'204,17,17';
  var lCol=last>=0?'#00e5cc':'#cc1111';
  svg+='<polygon points="'+x(0).toFixed(1)+','+y(0).toFixed(1)+' '+pts+x(d.length-1).toFixed(1)+','+y(0).toFixed(1)+'" fill="rgba('+aCol+',0.06)"/>';
  var path='M';for(var i=0;i<d.length;i++){path+=(i?'L':'')+x(i).toFixed(1)+','+y(d[i].cum_pnl).toFixed(1);}
  svg+='<path d="'+path+'" fill="none" stroke="'+lCol+'" stroke-width="1.5"/>';
  svg+='<circle cx="'+x(d.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="2.5" fill="'+lCol+'"/>';
  svg+='<text x="'+x(d.length-1).toFixed(1)+'" y="'+(y(last)-6).toFixed(1)+'" fill="'+lCol+'" font-size="9" font-family="ui-monospace,monospace" text-anchor="middle" font-weight="600">'+perfNum(Math.round(last))+'</text>';
  var step=Math.max(1,Math.floor(d.length/5));
  for(var i=0;i<d.length;i+=step){svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-3)+'" fill="rgba(255,255,255,0.18)" font-size="6" font-family="ui-monospace,monospace" text-anchor="middle">'+d[i].trade_date.slice(5)+'</text>';}
  svg+='</svg>';
  return svg;
}

function _compactWinRate(D) {
  var d=D.winrate;if(!d||!d.total)return '';
  var wr=(100*d.wins/d.total).toFixed(1);
  var html='<div style="text-align:center">';
  html+='<div style="font-size:28px;font-weight:700;color:#00e5cc;line-height:1">'+wr+'%</div>';
  html+='<div style="font-size:8px;color:rgba(200,160,160,0.45);margin:1px 0 6px">WIN RATE · '+d.total+' lots</div>';
  html+='<div style="display:flex;gap:8px;justify-content:center;font-size:9px">';
  html+='<span style="color:rgba(200,160,160,0.45)">Net</span><span style="color:'+(d.net_pnl>=0?'#00e5cc':'#cc1111')+'">'+perfNum(d.net_pnl)+'</span>';
  html+='<span style="color:rgba(200,160,160,0.45)">Exp</span><span style="color:'+(d.expectancy>=0?'#00e5cc':'#cc1111')+'">'+perfNum(d.expectancy)+'/lot</span>';
  html+='</div>';
  if(d.by_type){
    html+='<div style="display:flex;gap:10px;justify-content:center;margin-top:4px;font-size:8px">';
    d.by_type.forEach(function(t){
      if(!t.total) return;
      var twr=(100*t.wins/t.total).toFixed(1);
      html+='<span style="color:rgba(200,160,160,0.4)">'+t.option_type+'s '+twr+'% <span style="color:'+(t.pnl>=0?'#00e5cc':'#cc1111')+'">'+perfNum(t.pnl)+'</span></span>';
    });
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function _compactMonthly(D) {
  var d=D.monthly;if(!d||!d.length)return '';
  var maxAbs=0;d.forEach(function(m){if(Math.abs(m.pnl)>maxAbs)maxAbs=Math.abs(m.pnl);});
  var W=240,H=90,pad={top:4,right:4,bottom:16,left:4};
  var pW=W-pad.left-pad.right,pH=H-pad.top-pad.bottom;
  var barW=pW/d.length-2;
  var zeroY=pad.top+pH/2;
  var svg=perfSvg(W,H);
  svg+='<line x1="'+pad.left+'" y1="'+zeroY.toFixed(1)+'" x2="'+(pad.left+pW)+'" y2="'+zeroY.toFixed(1)+'" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" stroke-dasharray="2,2"/>';
  d.forEach(function(m,i){
    var bx=pad.left+i*(pW/d.length)+1;
    var bh=maxAbs?Math.abs(m.pnl)/maxAbs*(pH/2):0;
    var col=m.pnl>=0?'rgba(0,229,204,0.55)':'rgba(204,17,17,0.45)';
    var by=m.pnl>=0?zeroY-bh:zeroY;
    svg+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+Math.max(1,barW).toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="1" fill="'+col+'"/>';
    if(i%2===0||d.length<=8){svg+='<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(H-2)+'" fill="rgba(200,160,160,0.3)" font-size="6" font-family="ui-monospace,monospace" text-anchor="middle">'+m.month.slice(5)+'</text>';}
  });
  svg+='</svg>';
  return svg;
}

function _compactEdges(D) {
  var d=D.edges;if(!d||!d.length)return '';
  var maxAbs=0;d.forEach(function(e){if(Math.abs(e.pnl)>maxAbs)maxAbs=Math.abs(e.pnl);});
  var html='';
  d.slice(0,6).forEach(function(e){
    var pct=maxAbs?Math.abs(e.pnl)/maxAbs*100:0;
    var col=e.pnl>=0?'#00e5cc':'#cc1111';
    var bgCol=e.pnl>=0?'rgba(0,229,204,0.12)':'rgba(204,17,17,0.12)';
    html+='<div style="margin-bottom:2px">';
    html+='<div style="display:flex;justify-content:space-between;font-size:9px">';
    html+='<span style="color:rgba(230,200,200,0.8)">'+e.option_type+' · '+e.hold_bucket+'</span>';
    html+='<span style="color:'+col+';font-weight:600">'+perfNum(e.pnl)+'</span></div>';
    html+='<div style="height:3px;background:rgba(140,20,20,0.08);border-radius:2px;margin:1px 0">';
