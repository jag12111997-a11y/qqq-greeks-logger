var SD={candles:null,loading:false,err:null,at:0};
var _sdFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function _sdET(t){var o={};_sdFmt.formatToParts(new Date(t*1000)).forEach(function(x){o[x.type]=x.value;});return {d:o.year+'-'+o.month+'-'+o.day,m:(+o.hour%24)*60+(+o.minute)};}
function _sdNum(v){return typeof v==='number'&&isFinite(v);}
function _sdF(v,d){return _sdNum(v)?v.toFixed(d==null?2:d):'—';}
function _sdBig(v){if(!_sdNum(v))return '—';var a=Math.abs(v);return (v<0?'-':'')+(a>=1e9?(a/1e9).toFixed(2)+'B':(a/1e6).toFixed(0)+'M');}
function _sdHM(m){var h=Math.floor(m/60),mm=m%60;return (h>12?h-12:h)+':'+(mm<10?'0':'')+mm+(h>=12?'p':'a');}
function _sdLoad(){
  if(SD.loading||(SD.at&&Date.now()-SD.at<300000))return;
  SD.loading=true;
  fetch(new URL('../../market-dash/qqq_candle_history.json',location.href).href+'?t='+Date.now())
    .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json();})
    .then(function(j){SD.candles=j;SD.err=null;})
    .catch(function(e){SD.err='Candle data could not load ('+e.message+').';})
    .then(function(){SD.loading=false;SD.at=Date.now();_sdRedrawAll();});
}
function _sdBuild(){
  var days={};function day(d){return days[d]||(days[d]={date:d});}
  var c=SD.candles||{};
  (c.daily||[]).forEach(function(k){var r=day(_sdET(k.time).d);r.o=k.open;r.h=k.high;r.l=k.low;r.c=k.close;r.v=k.volume;r.src='daily';});
  var mins={};
  (c.minute||[]).forEach(function(k){var e=_sdET(k.time);if(e.m<570||e.m>=960)return;(mins[e.d]=mins[e.d]||[]).push({m:e.m,k:k});});
  Object.keys(mins).forEach(function(d){
    var a=mins[d].sort(function(x,y){return x.m-y.m;}),r=day(d),b={};
    r.o=a[0].k.open;r.c=a[a.length-1].k.close;r.h=-Infinity;r.l=Infinity;r.v=0;r.src='minute';
    a.forEach(function(x){var k=x.k;r.h=Math.max(r.h,k.high);r.l=Math.min(r.l,k.low);r.v+=k.volume||0;
      var s=570+Math.floor((x.m-570)/10)*10;var q=b[s]||(b[s]={m:s,o:k.open,h:k.high,l:k.low,c:k.close,v:0});q.c=k.close;q.h=Math.max(q.h,k.high);q.l=Math.min(q.l,k.low);q.v+=k.volume||0;});
    r.up=0;r.dn=0;r.big=null;
    Object.keys(b).forEach(function(s){var q=b[s];if(q.c>q.o)r.up++;else if(q.c<q.o)r.dn++;if(!r.big||q.v>r.big.v)r.big={m:+s,v:q.v};});
    r.bars=Object.keys(b).length;
    r.b10=Object.keys(b).map(function(s){return b[s];}).sort(function(x,y){return x.m-y.m;});
    r.mins=a;
  });
  (window.MARKET_DASH_HISTORY||[]).forEach(function(e){
    if(!e||!e.entry_date)return;var r=day(e.entry_date);
    if(r.snap==='pm'&&e.session!=='pm')return;
    var q=e.quant||{},rv=q.realized_vs_implied||{},g=e.gex||{},lv=g.levels||{};
    r.snap=e.session||'pm';
    r.hv=_sdNum(rv.realized_vol_pct)?rv.realized_vol_pct:q.qqq_realized_vol_21d_pct;r.iv=rv.implied_vol_pct;
    r.flip=g.gamma_flip;r.flipFb=/nearest/i.test(g.gamma_flip_method||'');r.ngex=g.net_gex;r.cw=lv.call_wall;r.pw=lv.put_wall;r.reg=g.regime;
  });
  return Object.keys(days).sort().map(function(d){
    var r=days[d];
    if(_sdNum(r.o)&&_sdNum(r.c)&&_sdNum(r.h)&&_sdNum(r.l)){var rg=r.h-r.l,mv=r.c-r.o;r.rng=rg;r.mv=mv;r.trend=(rg===0||Math.abs(mv)<0.25*rg)?'Balanced':(mv>0?'Up':'Down');}
    return r;
  });
}
var SD_TFS=[1,5,10,15,30,60];
function _sdTfLabel(tf){return tf>=60?(tf/60)+'-HOUR':tf+'-MIN';}
// re-bucket a day's 1-minute candles into tf-minute candles
function _sdAgg(r,tf){
  if(!r.mins||!r.mins.length)return r;
  var b={},out=Object.assign({},r);
  r.mins.forEach(function(x){var k=x.k,s=570+Math.floor((x.m-570)/tf)*tf;var q=b[s]||(b[s]={m:s,o:k.open,h:k.high,l:k.low,c:k.close,v:0});q.c=k.close;q.h=Math.max(q.h,k.high);q.l=Math.min(q.l,k.low);q.v+=k.volume||0;});
  out.b10=Object.keys(b).map(function(s){return b[s];}).sort(function(x,y){return x.m-y.m;});
  out.up=0;out.dn=0;out.big=null;
  out.b10.forEach(function(q){if(q.c>q.o)out.up++;else if(q.c<q.o)out.dn++;if(!out.big||q.v>out.big.v)out.big={m:q.m,v:q.v};});
  out.bars=out.b10.length;out.tf=tf;return out;
}

function renderWidgetBody(defId, widget) {

  }

  }
  
  var e = currentEntry();
  if (!e) return '<div class="loading">No data available</div>';
  
  // Strip sec() wrapper and move READ sections to bottom
  function stripSec(html) {
    if (!html) return '<div class="loading">No data for this widget</div>';
    var s = html;
    s = s.replace(/^<section[^>]*>/, '');
    s = s.replace(/<\/section>$/, '');
    // Move .read sections to bottom — they use <details class="read">
    var reads = [];
    s = s.replace(/<details class="read"[^>]*>[\s\S]*?<\/details>/g, function(m) {
      reads.push(m);
      return '';
    });
    if (reads.length) {
      // Collapse them by default (remove 'open' attr) and group at bottom
      var collapsed = reads.map(function(r) {
        return r.replace('<details class="read" open>', '<details class="read">');
      }).join('');
      s += collapsed;
    }
    return s;
  }
  
  var align;

    case 'bull-bear-neutral':
      align = secAlignment(e);
      return stripSec(finalRegime(e, align));
    case 'gex-profile':          return stripSec(secGex(e));
    case 'historical-percentile':return stripSec(secGeometry(e));
    case 'volatility-regime':    return stripSec(secQuant(e));
    case 'market-story':
      align = secAlignment(e);
      return stripSec(finalRegime(e, align));
    case 'range-position':       return stripSec(secTouchFlow(e));
    case 'momentum-state':       return stripSec(secFadeRegime(e));
    case 'range-used':           return stripSec(secRangeUsed(e));

      align = secAlignment(e);

    return {id:r.expiration+'-'+kind+'-'+n('strike'),expiration:r.expiration,kind:kind,strike:n('strike'),spot:n('spot'),bid:n('bid'),ask:n('ask'),mid:n('bid')>0&&n('ask')>=n('bid')?(n('bid')+n('ask'))/2:null,delta:n('delta'),gamma:n('gamma'),theta:n('theta'),iv:n('iv')===null?null:n('iv')*100,volume:n('volume'),stamp:r.run_time};
  });
}
function _exitLoadHistory(date){
  if(EXIT_HISTORY[date])return;
  var state=EXIT_HISTORY[date]={loading:true,rows:[],failed:false};
  return Promise.all(['am','pm'].flatMap(function(session){return ['calls','puts'].map(function(side){
    var path='../../data/'+date+'/'+session+'/qqq_greeks_'+side+'_'+date+'_'+session+'.csv';
    return fetch(new URL(path,location.href).href+'?t='+Date.now()).then(function(r){if(r.status===404)return '';if(!r.ok)throw Error('History unavailable');return r.text();}).then(function(t){return t?_exitCsv(t,side==='calls'?'call':'put'):[];}).catch(function(){state.failed=true;return [];});
  });})).then(function(groups){state.rows=groups.flat();state.loading=false;renderAllWidgets();});
}
function _exitHistorical(saved){
  var time=_exitTime(saved.entryTime,'America/Los_Angeles');
  if(!isFinite(time))return {contracts:[],message:'Choose a valid entry date and time.'};
  var date=saved.entryTime.slice(0,10), history=EXIT_HISTORY[date];
  if(!history){_exitLoadHistory(date);return {contracts:[],message:'Loading historical option snapshots…'};}
  if(history.loading)return {contracts:[],message:'Loading historical option snapshots…'};
  var matches={};
  history.rows.forEach(function(c){
    var t=Date.parse(c.stamp.replace(' ','T')+'Z'),age=time-t;
    if(age>=0&&age<=120000&&(!matches[c.id]||c.stamp>matches[c.id].stamp))matches[c.id]=c;
  });
  var stamps=history.rows.map(function(c){return Date.parse(c.stamp.replace(' ','T')+'Z');}).filter(Number.isFinite).sort(function(a,b){return a-b;});
  var format=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit',second:'2-digit'});
  var message='No snapshot was recorded within two minutes before your entry time.';
  if(!stamps.length)message='No option history is available for '+date+'.';
  else {
    message+=' Available records on '+date+': '+format.format(stamps[0])+'–'+format.format(stamps[stamps.length-1])+' Pacific (there may be gaps).';
    if(time<stamps[0])message+=' Your entry is earlier than the first saved record.';
    else if(time>stamps[stamps.length-1])message+=' Your entry is after the last saved record.';
  }
  message+=' Check the date and time, or choose Live quotes to return to the latest snapshot. Historical estimates require a saved record; current quotes cannot replace it.';
  if(history.failed)message='Some history could not be loaded. Click Use entry time to retry. '+message;
  return {contracts:Object.values(matches),message:message};
}
function _exitAttr(value) { return esc(String(value == null ? '' : value)).replace(/"/g, '&quot;'); }
function _exitExpired(contract, now) {
  if (!contract) return false;
  var parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(now || new Date());
  var p={};parts.forEach(function(part){p[part.type]=part.value;});
  var today=p.year+'-'+p.month+'-'+p.day;
  return contract.expiration < today || (contract.expiration === today && Number(p.hour) >= 16);
}
function _exitSelected(root) {
  var select=root.querySelector('[data-exit-field="contract"]');
  var option=select && select.selectedOptions[0];
  try { return option && option.dataset.contract ? JSON.parse(option.dataset.contract) : null; } catch(err) { return null; }
}

function _exitEstimate(mid,delta,gamma,move){
  var v=mid+delta*move+0.5*gamma*move*move;
  if(!isFinite(v)||delta*(delta+gamma*move)<0||Math.abs(delta+gamma*move)>1)return null;
  return Math.max(0,v);
}
function _exitMoney(v){return v==null?'—':'$'+v.toFixed(2);}

function _exitSpot(cur,saved){
  if(!saved || saved.spotMode!=='custom')return cur.spot;
  var spot=Number(saved.customSpot);
  return isFinite(spot)&&spot>0 ? spot : null;
}

function _exitCalcResults(cur,entryVal,movesVal,saved){
  if(!cur)return '<div class="loading">Choose a contract.</div>';
  if(_exitExpired(cur,saved&&saved.timeMode==='entry'?new Date(_exitTime(saved.entryTime,'America/Los_Angeles')):undefined))return '<div class="loading">This contract has expired. Choose a current expiration.</div>';
  if(cur.mid===null||cur.delta===null||cur.gamma===null)return '<div style="padding:16px 0;text-align:center;color:var(--dim,#bda7ab);font-size:12px">Incomplete quote — choose another contract.</div>';
  if(!entryVal||!String(entryVal).trim())return '<div style="padding:16px 0;text-align:center;color:var(--dim,#bda7ab);font-size:12px">Enter your purchase price ↑</div>';
  var entry=Number(entryVal);
  if(!isFinite(entry)||entry<=0)return '<div style="color:#ff8995;font-size:12px">Entry must be positive.</div>';
  var spot=_exitSpot(cur,saved);
  if(spot===null)return '<div class="loading">Enter a positive custom QQQ spot price or click Live.</div>';
  var raw=String(movesVal||'6.50, 3.25, 1.625, 0.81, 0.40').trim();
  var moves=raw.split(/[,;\s]+/).map(Number);
  if(!raw||moves.some(function(m){return !isFinite(m)||m<=0||m>=spot;}))return '<div style="color:#ff8995;font-size:12px">Invalid moves.</div>';

  var price=function(n){return '$'+(Math.round((n+Number.EPSILON*Math.max(1,Math.abs(n)))*100)/100).toFixed(2);};
  var level=function(m,isStop){
    var s=isStop?-Math.sign(cur.delta)*m:Math.sign(cur.delta)*m;
    var est=_exitEstimate(saved&&saved.timeMode==='entry'?entry:cur.mid,cur.delta,cur.gamma,spot+s-cur.spot);
    var qqq='QQQ '+price(spot+s);
    if(est===null)return '<td>'+qqq+'<small style="display:block;color:var(--dim,#bda7ab);font-size:9px;margin-top:2px">Outside range</small></td>';
    var pnl=est-entry;
    var cls=pnl<0?'color:#ff8995':'color:#00e5cc';
    return '<td>'+qqq+'<strong style="display:block;font-size:15px;margin-top:2px;'+cls+'">'+price(est)+'</strong><small style="display:block;color:var(--dim,#bda7ab);font-size:9px;margin-top:1px">'+(pnl>=0?'+':'−')+price(Math.abs(pnl))+' ('+( pnl>=0?'+':'')+( pnl/entry*100).toFixed(1)+'%)'+(est===0?' · $0 floor':'')+'</small></td>';
  };

  var t='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed"><thead><tr><th style="text-align:left;padding:6px 6px 6px 0;color:var(--dim,#c8b8b8);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;width:16%">Move</th><th style="text-align:left;padding:6px 6px 6px 0;color:var(--dim,#c8b8b8);font-size:9px;text-transform:uppercase;letter-spacing:0.5px">Stop side</th><th style="text-align:left;padding:6px 6px 6px 0;color:var(--dim,#c8b8b8);font-size:9px;text-transform:uppercase;letter-spacing:0.5px">Target side</th></tr></thead><tbody>';
  for(var i=0;i<moves.length;i++){
    t+='<tr><td style="padding:8px 6px 8px 0;border-top:1px solid var(--bdr,#382029);vertical-align:top">$'+moves[i]+'</td>'+level(moves[i],true)+level(moves[i],false)+'</tr>';
  }
  t+='</tbody></table></div>';
  t+='<div style="font-size:9px;color:var(--dim,#bda7ab);margin-top:4px">P/L before fees. Stops use adverse QQQ direction; puts reverse it.</div>';
  return t;
}

function renderGexChart(e, widget) {
  // Use the combined layout from secQqqOpening — chart + GEX profile side-by-side,
  // cockpit strip, and options positioning, matching the reference dashboard.
  if (typeof window.secQqqOpening !== 'function') {
    return '<div class="loading">Chart engine not loaded</div>';
  }
  // secQqqOpening returns a <section class="wide qqq-market-card"> wrapper.
  // Extract just the inner body for the widget by stripping the outer section.
  var G = gsPrepare(e, widget);
  var full = window.secQqqOpening(G.entry);
  var html = full.replace(/^<section[^>]*>/, '').replace(/<\/section>\s*$/, '');
  var gsB = gsBelow(G, widget), gsCut = html.indexOf('<div id="qqq-cockpit-block"');
  html = gsControls(G, widget) + gsHeadline(G, widget) + (gsCut >= 0 ? html.slice(0, gsCut) + gsB + html.slice(gsCut) : html + gsB);

  // Collapsible notebook panel at the bottom
  html += '<details class="gex-notebook-panel" style="flex-shrink:0;border-top:1px solid var(--line);margin-top:4px">';
  html += '<summary style="cursor:pointer;padding:4px 8px;font-size:10px;color:var(--accent);letter-spacing:1px;user-select:none;list-style:none;display:flex;align-items:center;gap:6px">';
  html += '<span style="font-size:8px">▶</span> TRADING NOTEBOOK</summary>';

  html += '</details>';

  setTimeout(function() {

}

function renderAcceptanceRejection(e) {
  var m = e.markets || {};
  var qqq = m.QQQ || {};
  var last = qqq.last || 0;
  var prevClose = qqq.prev_close || 0;
  var pctChg = qqq.pct_change || 0;
  var gex = e.gex || {};
  var levels = gex.levels || {};
  var callWall = levels.call_wall || 0;
  var putWall = levels.put_wall || 0;
  var flip = gex.gamma_flip || 0;

  var html = '<h2>Acceptance / Rejection</h2>';

  // Key level tests
  var tests = [];
  if (callWall > 0) {
    var distCall = ((last - callWall) / callWall * 100).toFixed(2);
    tests.push({ level: 'Call Wall $' + num(callWall), dist: distCall, status: Math.abs(distCall) < 0.5 ? 'TESTING' : (distCall > 0 ? 'ABOVE' : 'BELOW') });
  }
  if (putWall > 0) {
    var distPut = ((last - putWall) / putWall * 100).toFixed(2);
    tests.push({ level: 'Put Wall $' + num(putWall), dist: distPut, status: Math.abs(distPut) < 0.5 ? 'TESTING' : (distPut > 0 ? 'ABOVE' : 'BELOW') });
  }
  if (flip > 0) {
    var distFlip = ((last - flip) / flip * 100).toFixed(2);
    tests.push({ level: 'Gamma Flip $' + num(flip), dist: distFlip, status: Math.abs(distFlip) < 0.5 ? 'TESTING' : (distFlip > 0 ? 'ABOVE' : 'BELOW') });
  }
  if (prevClose > 0) {
    tests.push({ level: 'Prev Close $' + num(prevClose), dist: pctChg.toFixed(2), status: pctChg > 0.1 ? 'ACCEPTED' : pctChg < -0.1 ? 'REJECTED' : 'FLAT' });
  }

  tests.forEach(function(t) {
    var statusCol = t.status === 'TESTING' ? 'var(--warn)' : t.status === 'ABOVE' || t.status === 'ACCEPTED' ? 'var(--up)' : t.status === 'REJECTED' ? 'var(--down)' : 'var(--flat)';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px">';
    html += '<span style="color:var(--dim)">' + t.level + '</span>';
    html += '<span style="color:' + statusCol + ';font-weight:600;letter-spacing:1px;font-size:11px">' + t.status + '</span>';
    html += '</div>';
  });

  html += '<div style="margin-top:10px;font-size:11px;color:var(--dim)">Distance from last: ' + signed(pctChg) + '% from prev close</div>';
  return html;
}

function renderSupportResistance(e) {

function renderSimilarSessions(e) {
  // Compare current entry to historical entries
  var html = '<h2>Similar Sessions</h2>';
  var qqq = (e.markets || {}).QQQ || {};
  var curPct = qqq.pct_change || 0;
  var curVix = ((e.markets || {}).VIX || {}).last || 0;
  var garch = (e.quant || {}).garch || {};
  var curVol = garch.conditional_vol_pct || 0;

  html += '<div style="font-size:11px;color:var(--dim);margin-bottom:10px">Sessions with similar QQQ move & vol regime</div>';

  // Find similar sessions from FULL history
  var matches = [];
  for (var i = 0; i < FULL.length - 1; i++) {
    var h = FULL[i];
    var hqqq = ((h.markets || {}).QQQ || {});
    var hPct = hqqq.pct_change || 0;
    var hVol = ((h.quant || {}).garch || {}).conditional_vol_pct || 0;
    var pctDiff = Math.abs(curPct - hPct);
    var volDiff = Math.abs(curVol - hVol);
    if (pctDiff < 0.5 && volDiff < 3) {
      matches.push({ date: h.entry_date, session: h.session || 'am', pct: hPct, vol: hVol, score: pctDiff + volDiff / 10 });
    }
  }
  matches.sort(function(a, b) { return a.score - b.score; });
  matches = matches.slice(0, 8);

  if (matches.length === 0) {
    html += '<div class="na">No similar sessions found in history</div>';
  } else {
    html += '<table><tr><th>Date</th><th style="text-align:right">QQQ %</th><th style="text-align:right">Vol</th></tr>';
    matches.forEach(function(m) {
      html += '<tr><td>' + esc(m.date) + ' ' + m.session + '</td>';
      html += '<td class="num" style="color:' + (m.pct >= 0 ? 'var(--up)' : 'var(--down)') + '">' + signed(m.pct) + '%</td>';
      html += '<td class="num">' + m.vol.toFixed(1) + '%</td></tr>';
    });
    html += '</table>';
    html += '<div style="margin-top:8px;font-size:11px;color:var(--dim)">' + matches.length + ' matches (±0.5% move, ±3% vol)</div>';
  }
  return html;
}

function renderAlerts(e) {
  var html = '<h2>Alerts</h2>';
  var alerts = [];

  // Auto-generate alerts from data
  var qqq = (e.markets || {}).QQQ || {};
  var vix = (e.markets || {}).VIX || {};
  var gex = e.gex || {};
  var garch = ((e.quant || {}).garch || {});
  var levels = gex.levels || {};

  if (Math.abs(qqq.pct_change || 0) > 1.5) alerts.push({ severity: 'high', msg: 'QQQ moved ' + signed(qqq.pct_change) + '% — large daily move' });
  if ((vix.last || 0) > 25) alerts.push({ severity: 'high', msg: 'VIX at ' + num(vix.last) + ' — elevated fear' });
  if ((vix.last || 0) < 14) alerts.push({ severity: 'low', msg: 'VIX at ' + num(vix.last) + ' — complacency zone' });

  var distFlip = gex.gamma_flip && qqq.last ? Math.abs((qqq.last - gex.gamma_flip) / gex.gamma_flip * 100) : 99;
  if (distFlip < 0.5) alerts.push({ severity: 'high', msg: 'QQQ near gamma flip ($' + num(gex.gamma_flip) + ')' });
  if (distFlip < 1.5 && distFlip >= 0.5) alerts.push({ severity: 'med', msg: 'QQQ approaching gamma flip ($' + num(gex.gamma_flip) + ')' });

  if (garch.regime === 'HIGH VOL') alerts.push({ severity: 'med', msg: 'GARCH regime: HIGH VOL (' + (garch.conditional_vol_pct || 0).toFixed(1) + '%)' });

  var distCall = levels.call_wall && qqq.last ? Math.abs((qqq.last - levels.call_wall) / levels.call_wall * 100) : 99;
  if (distCall < 0.3) alerts.push({ severity: 'med', msg: 'Price testing call wall ($' + num(levels.call_wall) + ')' });

  var distPut = levels.put_wall && qqq.last ? Math.abs((qqq.last - levels.put_wall) / levels.put_wall * 100) : 99;
  if (distPut < 0.3) alerts.push({ severity: 'high', msg: 'Price testing put wall ($' + num(levels.put_wall) + ')' });

  // Check custom user alerts
  try {
    var custom = JSON.parse(localStorage.getItem('gshinrje-custom-alerts') || '[]');
    custom.forEach(function(ca) {
      var price = qqq.last || 0;
      if (ca.dir === 'above' && price >= ca.price) {
        alerts.push({ severity: 'high', msg: '⚡ ' + ca.label + ' — QQQ above $' + num(ca.price), custom: true });
      } else if (ca.dir === 'below' && price <= ca.price) {
        alerts.push({ severity: 'high', msg: '⚡ ' + ca.label + ' — QQQ below $' + num(ca.price), custom: true });
      } else {
        alerts.push({ severity: 'low', msg: '⏸ ' + ca.label + ' — watching $' + num(ca.price) + ' (' + ca.dir + ')', custom: true });
      }
    });
  } catch(ex) {}

  if (alerts.length === 0) {
    alerts.push({ severity: 'low', msg: 'All quiet — no triggered alerts' });
  }

  alerts.sort(function(a, b) { var order = { high: 0, med: 1, low: 2 }; return (order[a.severity] || 2) - (order[b.severity] || 2); });

  alerts.forEach(function(a) {
    var dot = a.severity === 'high' ? '🔴' : a.severity === 'med' ? '🟡' : '🟢';
    html += '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px">';
    html += '<span style="font-size:10px;flex:none;margin-top:2px">' + dot + '</span>';
    html += '<span style="flex:1;color:var(--txt)">' + esc(a.msg) + '</span>';
    if (a.custom) html += '<span onclick="removeCustomAlert(\'' + esc(a.label) + '\')" style="cursor:pointer;font-size:10px;color:var(--faint)" title="Remove">✕</span>';
    html += '</div>';
  });

  // Add custom alert form
  html += '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">';
  html += '<div style="font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Add Price Alert</div>';

  html += '<input id="alertPrice" placeholder="Price" type="number" step="0.01" style="flex:1;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:4px 5px;font-size:10px" />';

  html += '</div></div>';

  return html;
}

function addCustomAlert() {
  var label = document.getElementById('alertLabel');
  var price = document.getElementById('alertPrice');
  var dir = document.getElementById('alertDir');
  if (!label || !price || !label.value.trim() || !price.value) return;
  try {
    var custom = JSON.parse(localStorage.getItem('gshinrje-custom-alerts') || '[]');
    custom.push({ label: label.value.trim(), price: parseFloat(price.value), dir: dir.value });
    localStorage.setItem('gshinrje-custom-alerts', JSON.stringify(custom));
    render();
  } catch(ex) {}
}

function removeCustomAlert(label) {
  try {
    var custom = JSON.parse(localStorage.getItem('gshinrje-custom-alerts') || '[]');
    custom = custom.filter(function(a) { return a.label !== label; });
    localStorage.setItem('gshinrje-custom-alerts', JSON.stringify(custom));
    render();
  } catch(ex) {}
}

// ── Combined Notebook Widget (Trade Journal + Notes + Scorecard + Observations) ──
var notebookDrafts = Object.create(null);
function notebookAttr(value) { return esc(value == null ? '' : String(value)).replace(/"/g, '&quot;'); }
function readNotebookDraft(key, date) {
  if (notebookDrafts[key]) return notebookDrafts[key];
  var draft;
  try { draft = JSON.parse(localStorage.getItem(key)); } catch (err) {}
  if (!draft || typeof draft !== 'object' || Array.isArray(draft)) draft = {};
  if (!draft.fields || typeof draft.fields !== 'object') draft.fields = {};
  if (!draft.scores || typeof draft.scores !== 'object') draft.scores = {};
  // Import the old Save-button notes without deleting the originals.
  try {
    if (draft.fields.notes == null) draft.fields.notes = localStorage.getItem('gshinrje-quicknotes') || '';
    if (draft.fields.observations == null) draft.fields.observations = localStorage.getItem('gshinrje-notes-' + date) || '';
  } catch (err) {}
  if (!draft.entryDate) draft.entryDate = notebookToday();
  notebookDrafts[key] = draft;
  return draft;
}
function saveNotebookDraft(root) {
  var key = root.dataset.notebookKey;
  var draft = notebookDrafts[key];
  var status = root.querySelector('[data-notebook-status]');
  try {
    var savedAt = new Date().toISOString();
    localStorage.setItem(key, JSON.stringify(Object.assign({}, draft, { updatedAt: savedAt })));
    draft.updatedAt = savedAt;
    if (status) status.textContent = 'Draft saved on this device · ' + notebookTime(savedAt);
  } catch (err) {
    if (status) status.textContent = 'Could not save. Copy your text before leaving this page.';
  }
}
document.addEventListener('input', function(event) {
  var field = event.target.closest('[data-notebook-field]');
  if (!field) return;
  var root = field.closest('[data-notebook-root]');
  notebookDrafts[root.dataset.notebookKey].fields[field.dataset.notebookField] = field.value;
  saveNotebookDraft(root);
});
function scoreNotebook(button) {
  var root = button.closest('[data-notebook-root]');
  var name = button.dataset.notebookScore;
  notebookDrafts[root.dataset.notebookKey].scores[name] = Number(button.dataset.score);
  button.parentElement.querySelectorAll('button').forEach(function(item) {
    var selected = item === button;
    item.setAttribute('aria-pressed', selected);
    item.style.background = selected ? 'var(--accent)' : 'var(--line)';
    item.style.color = selected ? '#000' : 'var(--dim)';
  });
  saveNotebookDraft(root);
}
var NOTEBOOK_ARCHIVE_KEY = 'gshinrje-notebook-archive-v1';
function notebookToday() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function notebookTime(value) {
  return value && isFinite(Date.parse(value)) ? new Date(value).toLocaleString() : '';
}
function notebookArchive() {
  var raw = localStorage.getItem(NOTEBOOK_ARCHIVE_KEY);
  if (!raw) return [];
  var entries = JSON.parse(raw);
  if (!Array.isArray(entries)) throw new Error('Invalid notebook archive');
  return entries;
}
function notebookStatus(root, message) {
  root.querySelector('[data-notebook-status]').textContent = message;
}
function setNotebookDate(input) {
  var root = input.closest('[data-notebook-root]');
  notebookDrafts[root.dataset.notebookKey].entryDate = input.value;
  saveNotebookDraft(root);
}
function archiveNotebook(button) {
  var root = button.closest('[data-notebook-root]');
  var key = root.dataset.notebookKey, draft = notebookDrafts[key];
  var date = root.querySelector('[data-notebook-date]').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { notebookStatus(root, 'Choose an entry date before saving.'); return; }
  if (!Object.values(draft.fields).some(function(v) { return String(v || '').trim(); }) && !Object.keys(draft.scores).length) {
    notebookStatus(root, 'Write a note or add a score before saving an entry.'); return;
  }
  var now = new Date().toISOString();
  try {
    var entries = notebookArchive();
    entries.push({ id: (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : now + '-' + Math.random().toString(36).slice(2), date: date, savedAt: now, sourceWidget: key,
      fields: JSON.parse(JSON.stringify(draft.fields)), scores: JSON.parse(JSON.stringify(draft.scores)) });
    localStorage.setItem(NOTEBOOK_ARCHIVE_KEY, JSON.stringify(entries));
  } catch (err) { notebookStatus(root, 'Entry could not be saved. Export a backup before leaving this page.'); return; }
  draft.lastEntrySavedAt = now;
  saveNotebookDraft(root);
  root.querySelector('[data-notebook-last-entry]').textContent = 'Last entry saved: ' + notebookTime(now);
  notebookStatus(root, 'Entry saved for ' + date + ' · ' + notebookTime(now));
  document.querySelectorAll('[data-notebook-root]').forEach(function(other) {
    var filter = other.querySelector('[data-notebook-browse-date]');
    if (other === root) filter.value = date;
    browseNotebook(filter);
  });
}
function browseNotebook(input) {
  var root = input.closest('[data-notebook-root]');
  var list = root.querySelector('[data-notebook-entries]');
  try {
    var entries = notebookArchive().filter(function(entry) { return !input.value || entry.date === input.value; });
    entries.sort(function(a, b) { return String(b.date).localeCompare(String(a.date)) || String(b.savedAt).localeCompare(String(a.savedAt)); });
    list.innerHTML = entries.length ? entries.map(function(entry) {
      var h = '<details style="border:1px solid var(--line);border-radius:4px;padding:8px;margin-top:6px"><summary style="cursor:pointer">' + esc(entry.date) + ' · Saved ' + esc(notebookTime(entry.savedAt)) + '</summary>';
      Object.keys(entry.fields || {}).forEach(function(field) {
        var value = entry.fields[field];
        if (value != null && String(value).trim()) h += '<div style="margin-top:8px"><strong>' + esc(field) + '</strong><div style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(String(value)) + '</div></div>';
      });
      Object.keys(entry.scores || {}).forEach(function(name) { h += '<div style="margin-top:6px">' + esc(name) + ': ' + esc(String(entry.scores[name])) + '/5</div>'; });
      return h + '</details>';
    }).join('') : '<p>No saved entries' + (input.value ? ' for ' + esc(input.value) : ' yet') + '. Use Save entry to add one.</p>';
  } catch (err) { list.textContent = 'Could not read saved entries. Export a backup to preserve the stored data.'; }
}
function openNotebookArchive(panel) {
  if (panel.open) browseNotebook(panel.querySelector('[data-notebook-browse-date]'));
}
function exportNotebook(button) {
  var root = button.closest('[data-notebook-root]');
  try {
    var stored = {};
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key === NOTEBOOK_ARCHIVE_KEY || key === 'gshinrje-quicknotes' || key.startsWith('gshinrje-notebook-v1-') || key.startsWith('gshinrje-notes-')) stored[key] = localStorage.getItem(key);
    }
    var backup = { format: 'gshinrje-notebook-backup', version: 1, exportedAt: new Date().toISOString(), stored: stored, currentDrafts: notebookDrafts };
    var url = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = 'trading-notebook-' + notebookToday() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
    notebookStatus(root, 'Backup download started. Keep the JSON file in a safe place.');
  } catch (err) { notebookStatus(root, 'Could not export. Copy your notes before leaving this page.'); }
}

function renderNotebook(e, widget) {
  var key = 'gshinrje-notebook-v1-' + (widget ? widget.id : 'shared');
  var draft = readNotebookDraft(key, e.entry_date || 'today');
  var controlStyle = 'width:100%;box-sizing:border-box;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:6px;font:11px ui-monospace,monospace';
  function textarea(field, placeholder, height) {
    return '<textarea aria-label="' + notebookAttr(placeholder) + '" data-notebook-field="' + field + '" placeholder="' + notebookAttr(placeholder) + '" style="' + controlStyle + ';height:' + height + 'px;resize:vertical">' + esc(draft.fields[field] || '') + '</textarea>';
  }
  function section(name, label) { return '<section data-notebook-section="' + name + '" style="margin-top:18px;padding-top:12px;border-top:1px solid var(--line)"><h3 style="font-size:13px;color:var(--accent);margin:0 0 10px">' + label + '</h3>'; }
  var html = '<div data-notebook-root data-notebook-key="' + notebookAttr(key) + '" style="width:100%;height:100%;overflow:auto;box-sizing:border-box;padding:2px">';
  html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><label>Entry date <input aria-label="Entry date" data-notebook-date type="date" value="' + notebookAttr(draft.entryDate) + '" onchange="setNotebookDate(this)" style="color-scheme:dark;padding:6px"></label><button type="button" onclick="archiveNotebook(this)" style="padding:8px 12px;border:1px solid var(--accent);border-radius:4px;background:rgba(0,229,204,0.08);color:var(--accent);font:inherit;cursor:pointer">Save entry</button><button type="button" onclick="exportNotebook(this)" style="padding:8px 12px;border:1px solid var(--accent);border-radius:4px;background:rgba(0,229,204,0.08);color:var(--accent);font:inherit;cursor:pointer">Export backup</button></div>';
  html += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px">Drafts autosave on this device. Save entry keeps a dated copy of your notebook. Each save adds a new copy.</div>';
  html += '<div data-notebook-last-entry style="font-size:11px;margin-bottom:8px">' + (draft.lastEntrySavedAt ? 'Last entry saved: ' + esc(notebookTime(draft.lastEntrySavedAt)) : 'No dated entry saved from this notebook yet.') + '</div>';
  html += '<details ontoggle="openNotebookArchive(this)" style="border:1px solid var(--line);padding:8px;margin-bottom:10px"><summary style="cursor:pointer;padding:4px">Browse by date</summary><label style="display:block;margin-top:8px">Saved entry date <input aria-label="Browse saved entry date" data-notebook-browse-date type="date" onchange="browseNotebook(this)" style="color-scheme:dark;padding:6px"></label><button type="button" style="margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--text-secondary);font:inherit;cursor:pointer" onclick="var input=this.parentElement.querySelector(\'[data-notebook-browse-date]\');input.value=\'\';browseNotebook(input)">Show all entries</button><div data-notebook-entries style="font-size:12px"></div></details>';
  html += section('notes', 'Notes') + textarea('notes', 'Scratch pad...', 160) + '</section>';
  html += section('scorecard', 'Scorecard') + '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">Rate your process (not your P/L)</div>';
  ['Waited for setup','Followed thesis','Sized correctly','Managed risk','No revenge trades','Accepted outcome'].forEach(function(name) {
    html += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0"><span style="flex:1;font-size:11px">' + name + '</span><div style="display:flex;gap:2px">';
    for (var score = 1; score <= 5; score++) {
      var selected = draft.scores[name] === score;
      html += '<button aria-label="' + name + ': ' + score + '/5" aria-pressed="' + selected + '" data-notebook-score="' + name + '" data-score="' + score + '" onclick="scoreNotebook(this)" style="border:none;border-radius:2px;cursor:pointer;background:' + (selected ? 'var(--accent)' : 'var(--line)') + ';color:' + (selected ? '#000' : 'var(--dim)') + '">' + score + '</button>';
    }
    html += '</div></div>';
  });
  html += '</section>' + section('observations', 'Observations') + textarea('observations', 'What do you notice?', 140) + '</section>';
  html += '<div data-notebook-status role="status" style="font-size:10px;color:var(--text-secondary);margin-top:6px">' + (draft.updatedAt ? 'Draft saved on this device · ' + esc(notebookTime(draft.updatedAt)) : 'Drafts save automatically on this device') + '</div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">Stored in this browser’s website data. No automatic sync between devices. Export a backup before clearing website data.</div></div>';
  return html;
}

    html += `<button class="tab ${isActive ? 'active' : ''}" onclick="switchTab('${lay.id}')" ondblclick="startRenameTab('${lay.id}')" oncontextmenu="tabContext(event,'${lay.id}')">`;

    if (editingTabId === lay.id) {
      html += `<input class="tab-name-input" id="tabInput" value="${esc(lay.name)}" onblur="commitRename()" onkeydown="renameKey(event)">`;
    } else {
      html += esc(lay.name);
    }
    if (isActive && state.layouts.length > 1) {
      html += `<span class="close-tab" onclick="event.stopPropagation(); deleteTab('${lay.id}')">✕</span>`;
    }
    html += '</button>';
  });

  // New tab button
  html += '<button class="btn-new-tab" onclick="addTab()" title="New layout">+</button>';

  // Layouts manager button
  html += '<button class="btn-layouts" onclick="openLayoutManager()" title="Manage layouts">';
  html += '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>';
  html += 'Layouts</button>';

  html += '<div class="app-title">གཤིན་རྗེ</div>';
  html += '<div class="tab-divider" style="margin-left:8px"></div>';
  html += '<button class="btn-add-widget" onclick="togglePanel()"><span style="font-size:14px">+</span> Widget</button>';
  bar.innerHTML = html;

  // Focus rename input
  if (editingTabId) {
    var inp = document.getElementById('tabInput');
    if (inp) { inp.focus(); inp.select(); }
  }

  // Context menu
  renderCtxMenu();
}

function renderCtxMenu() {
  var old = document.getElementById('ctxMenuEl');
  if (old) old.remove();
  if (!ctxMenu) return;

  var div = document.createElement('div');
  div.id = 'ctxMenuEl';
  div.className = 'ctx-menu';
  div.style.left = ctxMenu.x + 'px';
  div.style.top = ctxMenu.y + 'px';

  var html = `<button class="ctx-item" onclick="startRenameTab('${ctxMenu.layoutId}')">Rename</button>`;
  html += `<button class="ctx-item" onclick="duplicateTab('${ctxMenu.layoutId}')">Duplicate</button>`;
  if (state.layouts.length > 1) {
    html += `<button class="ctx-item danger" onclick="deleteTab('${ctxMenu.layoutId}')">Delete</button>`;
  }
  div.innerHTML = html;
  document.body.appendChild(div);

  setTimeout(() => {
    document.addEventListener('click', closeCtx, { once: true });
  }, 0);
}

function closeCtx() { ctxMenu = null; renderCtxMenu(); }
function tabContext(e, id) { e.preventDefault(); ctxMenu = { x: e.clientX, y: e.clientY, layoutId: id }; renderCtxMenu(); }
function switchTab(id) { state.activeLayoutId = id; render(); }

function addTab() {
  var lay = { id: uid(), name: `Layout ${state.layouts.length + 1}`, widgets: [] };
  state.layouts.push(lay);
  state.activeLayoutId = lay.id;
  render();
}

function deleteTab(id) {
  if (state.layouts.length <= 1) return;
  state.layouts = state.layouts.filter(l => l.id !== id);
  if (state.activeLayoutId === id) state.activeLayoutId = state.layouts[0].id;
  ctxMenu = null;
  render();
}

function duplicateTab(id) {
  var src = state.layouts.find(l => l.id === id);
  if (!src) return;
  var copy = { id: uid(), name: src.name + ' (copy)', widgets: deepCopy(src.widgets).map(w => ({ ...w, id: uid() })) };
  state.layouts.push(copy);
  state.activeLayoutId = copy.id;
  ctxMenu = null;
  render();
}

function startRenameTab(id) { editingTabId = id; ctxMenu = null; renderTabs(); }

function commitRename() {
  var inp = document.getElementById('tabInput');
  if (inp && editingTabId) {
    var val = inp.value.trim();
    if (val) {
      var lay = state.layouts.find(l => l.id === editingTabId);
      if (lay) lay.name = val;
    }
  }
  editingTabId = null;
  render();
}

function renameKey(e) {
  if (e.key === 'Enter') commitRename();
  if (e.key === 'Escape') { editingTabId = null; renderTabs(); }
}

// ── Canvas ──
function renderCanvas() {
  var canvas = document.getElementById('canvas');
  var lay = activeLayout();

  if (lay.widgets.length === 0) {
    canvas.innerHTML = '<div class="empty-state"><div><h2>Blank canvas</h2><p>Click <span>+ Widget</span> to get started</p></div></div>';
    return;
  }

  var html = '';
  lay.widgets.forEach((w, idx) => {
    var def = findDef(w.definitionId);
    var linkColor = LINK_COLORS.find(c => c.key === w.linkGroup);
    var name = def ? def.name : w.definitionId;
    var question = def ? def.question : '';

    html += `<div class="widget${w.locked ? ' locked-widget' : ''}" style="left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${idx + 1}" data-wid="${w.id}" onpointerdown="bringToFront('${w.id}')">`;

    // Header
    html += `<div class="widget-header" onpointerdown="startDrag(event, '${w.id}')" ondblclick="toggleFullscreen('${w.id}')">`;
    if (linkColor) {
      html += `<div class="link-dot" style="background:${linkColor.hex}"></div>`;
    }
    html += `<span class="widget-name">${esc(name)}</span>`;
    html += '<div class="widget-controls">';

    // Ticker
    html += `<input class="widget-input" value="${esc(w.ticker)}" onchange="setTicker('${w.id}', this.value)" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()">`;

    // Timeframe
    html += `<select aria-label="${w.definitionId === 'gex-chart' ? 'Candle timeframe' : 'Timeframe'}" class="widget-select" onchange="setTimeframe('${w.id}', this.value)" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()">`;
    TIMEFRAMES.forEach(tf => {
      html += `<option value="${tf}" ${tf === w.timeframe ? 'selected' : ''}>${tf}</option>`;
    });
    html += '</select>';

    // Link group
    html += `<select class="widget-select" onchange="setLinkGroup('${w.id}', this.value)" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()" title="Link group">`;
    html += `<option value="" ${!w.linkGroup ? 'selected' : ''}>—</option>`;
    LINK_COLORS.forEach(c => {
      html += `<option value="${c.key}" ${w.linkGroup === c.key ? 'selected' : ''}>${c.key}</option>`;
    });
    html += '</select>';

    // Lock, Fullscreen, Duplicate & Close
    html += `<button class="widget-btn lock-btn${w.locked ? ' locked' : ''}" onclick="event.stopPropagation(); toggleLock('${w.id}')" title="Lock position">${w.locked ? '🔒' : '🔓'}</button>`;
    html += `<button class="widget-btn fullscreen-btn" onclick="event.stopPropagation(); toggleFullscreen('${w.id}')" title="Fullscreen">⛶</button>`;
    html += `<button class="widget-btn" onclick="event.stopPropagation(); dupWidget('${w.id}')" title="Duplicate">⧉</button>`;
    html += `<button class="widget-btn close" onclick="event.stopPropagation(); removeWidget('${w.id}')" title="Remove">✕</button>`;

    html += '</div></div>'; // controls, header

    // Body
    html += `<div class="widget-body">${renderWidgetContent(w.definitionId, w)}</div>`;

    // Resize handles — all edges and corners
    for (var edge of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) {
      html += `<div class="resize-handle ${edge}" onpointerdown="startResize(event, '${w.id}', '${edge}')" aria-hidden="true"></div>`;
    }

    html += '</div>'; // widget
  });

  canvas.innerHTML = html;
}

// ── Widget actions ──
function addWidget(defId) {
  var def = findDef(defId);
  if (!def) return;
  var lay = activeLayout();
  lay.widgets.push({
    id: uid(), definitionId: defId,
    x: snap(40 + Math.random() * 120), y: snap(40 + Math.random() * 120),
    w: def.dw, h: def.dh,
    ticker: 'QQQ', timeframe: defId === 'gex-chart' ? '1m' : '1D', linkGroup: null, settings: {}
  });
  render();
}

function removeWidget(id) {
  var lay = activeLayout();
  lay.widgets = lay.widgets.filter(w => w.id !== id);
  render();
}

function dupWidget(id) {
  var lay = activeLayout();
  var src = lay.widgets.find(w => w.id === id);
  if (!src) return;
  var copy = deepCopy(src);
  copy.id = uid();
  copy.x = src.x + 40;
  copy.y = src.y + 40;
  lay.widgets.push(copy);
  render();
}

function toggleLock(id) {
  var lay = activeLayout();
  var w = lay.widgets.find(w => w.id === id);
  if (!w) return;
  w.locked = !w.locked;
  var el = document.querySelector(`.widget[data-wid="${id}"]`);
  if (el) {
    el.classList.toggle('locked-widget', w.locked);
    var btn = el.querySelector('.lock-btn');
    if (btn) { btn.classList.toggle('locked', w.locked); btn.innerHTML = w.locked ? '🔒' : '🔓'; }
  }
  save();
}

var fullscreenId = null;
function toggleFullscreen(id) {
  var el = document.querySelector(`.widget[data-wid="${id}"]`);
  if (!el) return;
  if (fullscreenId === id) {
    el.classList.remove('fullscreen');
    var w = activeLayout().widgets.find(w => w.id === id);
    if (w) { el.style.left = w.x+'px'; el.style.top = w.y+'px'; el.style.width = w.w+'px'; el.style.height = w.h+'px'; }
    fullscreenId = null;
  } else {
    if (fullscreenId) {
      var prev = document.querySelector(`.widget[data-wid="${fullscreenId}"]`);
      if (prev) { prev.classList.remove('fullscreen'); var pw = activeLayout().widgets.find(w => w.id === fullscreenId); if (pw) { prev.style.left=pw.x+'px'; prev.style.top=pw.y+'px'; prev.style.width=pw.w+'px'; prev.style.height=pw.h+'px'; } }
    }
    el.classList.add('fullscreen');
    fullscreenId = id;
  }
}

function setTicker(id, val) {
  var lay = activeLayout();
  var widget = lay.widgets.find(w => w.id === id);
  if (!widget) return;
  var ticker = val.toUpperCase();
  widget.ticker = ticker;
  // Propagate to link group
  if (widget.linkGroup) {
    lay.widgets.forEach(w => { if (w.linkGroup === widget.linkGroup) w.ticker = ticker; });
  }
  save();
  // Update all ticker inputs without full re-render (avoids losing focus)
  document.querySelectorAll('.widget').forEach(el => {
    var wid = el.dataset.wid;
    var w = lay.widgets.find(w => w.id === wid);
    if (w) el.querySelector('.widget-input').value = w.ticker;
  });
}

function setTimeframe(id, val) {
  var lay = activeLayout();
  var w = lay.widgets.find(w => w.id === id);
  if (w) w.timeframe = val;
  render();
}

function setLinkGroup(id, val) {
  var lay = activeLayout();
  var w = lay.widgets.find(w => w.id === id);
  if (w) w.linkGroup = val || null;
  render();
}

function bringToFront(id) {
  var lay = activeLayout();
  var idx = lay.widgets.findIndex(w => w.id === id);
  if (idx < 0) return;
  lay.widgets.push(lay.widgets.splice(idx, 1)[0]);
  document.querySelectorAll('.widget').forEach(el => {
    var wid = el.dataset.wid;
    var zi = lay.widgets.findIndex(w => w.id === wid);
    el.style.zIndex = zi + 1;
  });
  save();
}

// ── Pointer movement and resizing (mouse, touch, and pen) ──
var widgetGesture = null;
function startDrag(e, id) {
  if (e.target.closest('input, select, button, a, textarea, [contenteditable]')) return;
  startWidgetGesture(e, id, 'move');
}

function startResize(e, id, edge) {
  startWidgetGesture(e, id, edge || 'se');
}

function startWidgetGesture(e, id, mode) {
  if (widgetGesture || e.isPrimary === false || e.button !== 0) return;
  var w = activeLayout().widgets.find(w => w.id === id);
  var el = document.querySelector(`.widget[data-wid="${id}"]`);
  if (!w || w.locked || !el || el.classList.contains('fullscreen')) return;
  e.preventDefault();
  e.stopPropagation();
  bringToFront(id);
  var canvas = document.getElementById('canvas');
  widgetGesture = {
    w, el, mode, pointerId: e.pointerId, target: e.currentTarget,
    startX: e.clientX, startY: e.clientY,
    x: w.x, y: w.y, width: w.w, height: w.h,
    canvas, scrollLeft: canvas ? canvas.scrollLeft : 0, scrollTop: canvas ? canvas.scrollTop : 0
  };
  el.classList.add('widget-interacting');
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.addEventListener('lostpointercapture', endWidgetGesture);
  document.addEventListener('pointermove', moveWidgetGesture, { passive: false });
  document.addEventListener('pointerup', endWidgetGesture);
  document.addEventListener('pointercancel', endWidgetGesture);
  window.addEventListener('blur', endWidgetGesture);
}

function moveWidgetGesture(e) {
  var g = widgetGesture;
  if (!g || e.pointerId !== g.pointerId) return;
  e.preventDefault();
  var dx = e.clientX - g.startX + (g.canvas ? g.canvas.scrollLeft - g.scrollLeft : 0);
  var dy = e.clientY - g.startY + (g.canvas ? g.canvas.scrollTop - g.scrollTop : 0);
  var x = g.x, y = g.y, width = g.width, height = g.height;
  if (g.mode === 'move') {
    x = Math.max(0, snap(g.x + dx));
    y = Math.max(0, snap(g.y + dy));
  } else {
    if (g.mode.includes('e')) width = Math.max(200, snap(g.width + dx));
    if (g.mode.includes('s')) height = Math.max(120, snap(g.height + dy));
    // Keep the opposite edge fixed, even at the canvas boundary or minimum size.
    if (g.mode.includes('w')) {
      x = Math.max(0, Math.min(g.x + g.width - 200, snap(g.x + dx)));
      width = g.x + g.width - x;
    }
    if (g.mode.includes('n')) {
      y = Math.max(0, Math.min(g.y + g.height - 120, snap(g.y + dy)));
      height = g.y + g.height - y;
    }
  }
  Object.assign(g.w, { x, y, w: width, h: height });
  Object.assign(g.el.style, { left: x + 'px', top: y + 'px', width: width + 'px', height: height + 'px' });
}

function endWidgetGesture(e) {
  var g = widgetGesture;
  if (!g || (e && e.pointerId !== undefined && e.pointerId !== g.pointerId)) return;
  if (e && e.type === 'pointerup') moveWidgetGesture(e);
  widgetGesture = null;
  g.el.classList.remove('widget-interacting');
  g.target.removeEventListener('lostpointercapture', endWidgetGesture);
  document.removeEventListener('pointermove', moveWidgetGesture);
  document.removeEventListener('pointerup', endWidgetGesture);
  document.removeEventListener('pointercancel', endWidgetGesture);
  window.removeEventListener('blur', endWidgetGesture);
  if (g.target.hasPointerCapture(g.pointerId)) g.target.releasePointerCapture(g.pointerId);
  save();
}

// ── Add Widget Panel ──
var expandedCat = null;
var searchText = '';

function togglePanel() { panelOpen = !panelOpen; renderPanel(); }

function renderPanel() {
  var old = document.getElementById('addPanel');
  if (old) old.remove();
  var oldBd = document.getElementById('panelBackdrop');
  if (oldBd) oldBd.remove();

  if (!panelOpen) return;

  // Backdrop
  var bd = document.createElement('div');
  bd.id = 'panelBackdrop';
  bd.className = 'panel-backdrop';
  bd.onclick = () => { panelOpen = false; renderPanel(); };
  document.body.appendChild(bd);

  // Panel
  var panel = document.createElement('div');
  panel.id = 'addPanel';
  panel.className = 'add-panel';

  var lower = searchText.toLowerCase();

  var html = '<div class="add-panel-header"><h2>Add Widget</h2><button class="add-panel-close" onclick="panelOpen=false; renderPanel()">✕</button></div>';
  html += `<input class="search-box" id="panelSearch" placeholder="Search widgets..." value="${esc(searchText)}" oninput="searchText=this.value; renderPanel()">`;
  html += '<div class="cat-list">';

  var totalShown = 0;
  CATEGORIES.forEach(cat => {
    var widgets = cat.widgets.filter(w => !w.hidden);
    if (searchText) {
      widgets = widgets.filter(w => w.name.toLowerCase().includes(lower) || w.question.toLowerCase().includes(lower));
    }
    if (widgets.length === 0) return;
    totalShown += widgets.length;
    var isOpen = searchText || expandedCat === cat.id;
    html += `<details class="cat-group"${isOpen ? ' open' : ''}>`;
    html += `<summary class="cat-header" onclick="expandedCat = expandedCat === '${cat.id}' ? null : '${cat.id}'">${esc(cat.label)}<span class="cat-count">${widgets.length}</span></summary>`;
    html += '<div class="cat-widgets">';
    widgets.forEach(w => {
      html += `<button class="widget-option" onclick="addWidget('${w.id}'); panelOpen=false; renderPanel()">`;
      html += `<div class="wo-name">${esc(w.name)}</div>`;
      html += `<div class="wo-q">${esc(w.question)}</div></button>`;
    });
    html += '</div></details>';
  });

  if (totalShown === 0) {
    html += `<div class="no-results">No widgets match "${esc(searchText)}"</div>`;
  }

  html += '</div>';
  panel.innerHTML = html;
  document.body.appendChild(panel);

  var srch = document.getElementById('panelSearch');
  if (srch) srch.focus();
}

// ── Toast ──
function showToast(msg) {
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ── Export / Import ──
function exportLayouts() {
  var json = JSON.stringify(state, null, 2);
  navigator.clipboard.writeText(json).then(() => showToast('Layouts copied to clipboard')).catch(() => {
    var blob = new Blob([json], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gshinrje-layouts.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('Layouts downloaded');
  });
}

function importLayouts() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = function() {
    var file = inp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!imported.layouts || !Array.isArray(imported.layouts)) { showToast('Invalid file — no layouts found'); return; }
        state = imported;
        save();
        render();
        if (layoutManagerOpen) renderLayoutManager();
        showToast('Layouts imported (' + imported.layouts.length + ')');
      } catch(err) { showToast('Import failed — bad JSON'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ── Layout Manager ──
var lmRenameId = null;

function openLayoutManager() {
  layoutManagerOpen = true;
  renderLayoutManager();
}

function closeLayoutManager() {
  layoutManagerOpen = false;
  lmRenameId = null;
  var el = document.getElementById('layoutManager');
  if (el) el.remove();
}

function renderLayoutManager() {
  var old = document.getElementById('layoutManager');
  if (old) old.remove();
  if (!layoutManagerOpen) return;

  var overlay = document.createElement('div');
  overlay.id = 'layoutManager';
  overlay.className = 'lm-overlay';

  var html = '<div class="lm-header"><h2>Layouts</h2>';
  html += '<div class="lm-toolbar">';
  html += '<button class="lm-tool-btn" onclick="exportLayouts()">↑ Export</button>';
  html += '<button class="lm-tool-btn" onclick="importLayouts()">↓ Import</button>';
  html += '</div>';
  html += '<button class="lm-close" onclick="closeLayoutManager()">✕</button></div>';
  html += '<div class="lm-grid">';

  state.layouts.forEach(lay => {
    var isActive = lay.id === state.activeLayoutId;
    var count = lay.widgets.length;
    html += `<div class="lm-card ${isActive ? 'active' : ''}" onclick="lmSwitch('${lay.id}')">`;
    html += `<canvas class="lm-preview" data-layout-id="${lay.id}" width="480" height="280"></canvas>`;
    html += '<div class="lm-card-info"><div>';

    if (lmRenameId === lay.id) {
      html += `<input class="tab-name-input" style="width:120px;font-size:13px" id="lmRenameInput" value="${esc(lay.name)}" onblur="lmCommitRename()" onkeydown="lmRenameKey(event)" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">`;
    } else {
      html += `<div class="lm-card-name">${esc(lay.name)}</div>`;
    }
    html += `<div class="lm-card-count">${count} widget${count !== 1 ? 's' : ''}</div>`;
    html += '</div><div class="lm-card-actions">';
    html += `<button class="lm-card-btn" onclick="event.stopPropagation(); lmStartRename('${lay.id}')" title="Rename">✎</button>`;
    html += `<button class="lm-card-btn" onclick="event.stopPropagation(); lmDuplicate('${lay.id}')" title="Duplicate">⧉</button>`;
    if (state.layouts.length > 1) {
      html += `<button class="lm-card-btn danger" onclick="event.stopPropagation(); lmDelete('${lay.id}')" title="Delete">✕</button>`;
    }
    html += '</div></div></div>';
  });

  // New layout card
  html += '<div class="lm-new-card" onclick="lmNewLayout()"><span class="lm-new-label">+ New Layout</span></div>';

  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  // Draw mini previews on each canvas
  state.layouts.forEach(lay => {
    var cvs = document.querySelector(`canvas[data-layout-id="${lay.id}"]`);
    if (cvs) drawPreview(cvs, lay);
  });

  // Focus rename input if active
  if (lmRenameId) {
    var inp = document.getElementById('lmRenameInput');
    if (inp) { inp.focus(); inp.select(); }
  }
}

function drawPreview(canvas, layout) {
  var ctx = canvas.getContext('2d');
  var cw = canvas.width;
  var ch = canvas.height;

  // Background
  ctx.fillStyle = '#050000';
  ctx.fillRect(0, 0, cw, ch);

  if (layout.widgets.length === 0) {
    ctx.fillStyle = 'rgba(140,40,40,0.15)';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Empty', cw / 2, ch / 2 + 4);
    return;
  }

  // Find bounding box to scale preview
  var minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  layout.widgets.forEach(w => {
    if (w.x < minX) minX = w.x;
    if (w.y < minY) minY = w.y;
    if (w.x + w.w > maxX) maxX = w.x + w.w;
    if (w.y + w.h > maxY) maxY = w.y + w.h;
  });

  var bw = maxX - minX || 1;
  var bh = maxY - minY || 1;
  var pad = 20;
  var scale = Math.min((cw - pad * 2) / bw, (ch - pad * 2) / bh);
  var ox = pad + ((cw - pad * 2) - bw * scale) / 2 - minX * scale;
  var oy = pad + ((ch - pad * 2) - bh * scale) / 2 - minY * scale;

  layout.widgets.forEach(w => {
    var rx = ox + w.x * scale;
    var ry = oy + w.y * scale;
    var rw = w.w * scale;
    var rh = w.h * scale;

    // Widget body
    ctx.fillStyle = '#0d0305';
    ctx.strokeStyle = 'rgba(140,20,20,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(rx, ry, rw, rh, 3);
    ctx.fill();
    ctx.stroke();

    // Header bar
    var headerH = Math.max(4, rh * 0.12);
    ctx.fillStyle = 'rgba(140,20,20,0.15)';
    ctx.fillRect(rx, ry, rw, headerH);

    // Link dot
    if (w.linkGroup) {
      var lc = LINK_COLORS.find(c => c.key === w.linkGroup);
      if (lc) {
        ctx.fillStyle = lc.hex;
        ctx.beginPath();
        ctx.arc(rx + 6, ry + headerH / 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  });
}

function lmSwitch(id) {
  if (lmRenameId) return;
  state.activeLayoutId = id;
  save();
  closeLayoutManager();
  render();
}

function lmNewLayout() {
  var lay = { id: uid(), name: `Layout ${state.layouts.length + 1}`, widgets: [] };
  state.layouts.push(lay);
  state.activeLayoutId = lay.id;
  save();
  closeLayoutManager();
  render();
}

function lmDuplicate(id) {
  var src = state.layouts.find(l => l.id === id);
  if (!src) return;
  var copy = { id: uid(), name: src.name + ' (copy)', widgets: deepCopy(src.widgets).map(w => ({ ...w, id: uid() })) };
  state.layouts.push(copy);
  save();
  renderLayoutManager();
}

function lmDelete(id) {
  if (state.layouts.length <= 1) return;
  state.layouts = state.layouts.filter(l => l.id !== id);
  if (state.activeLayoutId === id) state.activeLayoutId = state.layouts[0].id;
  save();
  renderLayoutManager();
}

function lmStartRename(id) {
  lmRenameId = id;
  renderLayoutManager();
}

function lmCommitRename() {
  var inp = document.getElementById('lmRenameInput');
  if (inp && lmRenameId) {
    var val = inp.value.trim();
    if (val) {
      var lay = state.layouts.find(l => l.id === lmRenameId);
      if (lay) lay.name = val;
    }
  }
  lmRenameId = null;
  save();
  renderLayoutManager();
}

function lmRenameKey(e) {
  if (e.key === 'Enter') lmCommitRename();
  if (e.key === 'Escape') { lmRenameId = null; renderLayoutManager(); }
}

// ── Init ──
render();
loadHistoryData();
loadExitContracts();
setInterval(loadExitContracts, 60000);

// Refresh clock widgets every second
setInterval(function() {
  document.querySelectorAll('.widget').forEach(function(el) {
    var wid = el.dataset.wid;
    var lay = activeLayout();
    var w = lay.widgets.find(function(w) { return w.id === wid; });
    if (w && w.definitionId === 'clock-session') {
      var body = el.querySelector('.widget-body');
      if (body) body.innerHTML = renderWidgetContent('clock-session');
    }
  });
}, 1000);

</script>
