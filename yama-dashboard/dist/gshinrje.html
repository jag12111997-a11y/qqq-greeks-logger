<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>གཤིན་རྗེ</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deepest: #020000;
  --bg-dark: #080203;
  --bg-panel: #0d0305;
  --bg-widget: #100407;
  --bg-header: rgba(140,20,20,0.12);
  --border: rgba(140,20,20,0.25);
  --border-light: rgba(140,20,20,0.12);
  --text-bright: #e8d8d8;
  --text-primary: rgba(230,200,200,0.85);
  --text-secondary: rgba(200,160,160,0.65);
  --text-muted: rgba(160,80,80,0.40);
  --text-ghost: rgba(140,40,40,0.18);
  --text-faint: rgba(140,40,40,0.10);
  --hover: rgba(140,20,20,0.15);
  --hover-strong: rgba(140,20,20,0.25);
  --red: #cc1111;
  --accent: #00e5cc;
  --font: ui-monospace, SFMono-Regular, Menlo, monospace;
}

html, body { height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg-deepest); color: var(--text-primary); }

/* ── Tab bar ── */
.tab-bar {
  display: flex; align-items: center; height: 40px; gap: 2px;
  border-bottom: 1px solid var(--border); background: var(--bg-dark); padding: 0 8px;
  user-select: none;
}
.btn-add-widget {
  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
  border-radius: 6px; background: var(--hover-strong); border: none; cursor: pointer;
  font-size: 12px; font-weight: 500; color: var(--text-primary); margin-right: 8px;
  font-family: var(--font); transition: background 0.15s;
}
.btn-add-widget:hover { background: rgba(140,20,20,0.30); color: var(--text-bright); }
.tab-divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
.tab {
  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
  border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-muted); background: transparent; font-family: var(--font); transition: all 0.15s;
  position: relative;
}
.tab:hover { background: var(--hover); color: var(--text-secondary); }
.tab.active { background: var(--hover-strong); color: var(--text-bright); }
.tab .close-tab {
  font-size: 10px; color: var(--text-muted); opacity: 0; margin-left: 2px;
  transition: opacity 0.15s, color 0.15s; cursor: pointer;
}
.tab:hover .close-tab { opacity: 1; }
.tab .close-tab:hover { color: var(--text-secondary); }
.tab-name-input {
  width: 70px; background: transparent; border: none; outline: none;
  font-size: 12px; color: var(--text-bright); font-family: var(--font);
}
.btn-new-tab {
  display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
  border-radius: 6px; border: none; cursor: pointer; font-size: 14px;
  color: var(--text-muted); background: transparent; font-family: var(--font); transition: all 0.15s;
}
.btn-new-tab:hover { background: var(--hover); color: var(--text-secondary); }
.btn-layouts {
  display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px;
  border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-muted); background: transparent; font-family: var(--font); transition: all 0.15s;
  margin-left: 8px;
}
.btn-layouts:hover { background: var(--hover); color: var(--text-secondary); }
.btn-layouts svg { width: 14px; height: 14px; }
.app-title {
  margin-left: auto; padding-right: 8px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; color: rgba(140,40,40,0.25);
}

/* ── Context menu ── */
.ctx-menu {
  position: fixed; z-index: 200; min-width: 140px; padding: 4px 0;
  border-radius: 8px; border: 1px solid var(--border); background: #0d0305;
  box-shadow: 0 8px 30px rgba(0,0,0,0.7);
}
.ctx-item {
  display: block; width: 100%; padding: 6px 12px; border: none; background: none;
  font-size: 12px; color: var(--text-secondary); text-align: left; cursor: pointer;
  font-family: var(--font); transition: background 0.1s;
}
.ctx-item:hover { background: var(--hover); color: var(--text-bright); }
.ctx-item.danger { color: rgba(204,17,17,0.7); }
.ctx-item.danger:hover { color: var(--red); }

/* ── Canvas ── */
.canvas {
  flex: 1; position: relative; overflow: auto;
  background-image: radial-gradient(circle, rgba(140,20,20,0.08) 1px, transparent 1px);
  background-size: 20px 20px;
}
.empty-state {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.empty-state h2 { font-size: 18px; font-weight: 500; color: rgba(0,229,204,0.35); }
.empty-state p { margin-top: 4px; font-size: 12px; color: rgba(0,229,204,0.20); }
.empty-state span { color: rgba(0,229,204,0.40); }

/* ── Widget ── */
.widget {
  position: absolute; display: flex; flex-direction: column;
  border-radius: 8px; border: 1px solid var(--border); background: var(--bg-widget);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: box-shadow 0.15s;
  overflow: hidden; min-height: 0;
}
.widget:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.4); }
.widget-header {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px;
  border-bottom: 1px solid var(--border-light); background: var(--bg-header);
  border-radius: 8px 8px 0 0; cursor: grab; flex-shrink: 0; user-select: none;
}
.widget-header:active { cursor: grabbing; }
.link-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.widget-name { font-size: 11px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.widget-controls { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.widget-input {
  width: 52px; padding: 2px 6px; border-radius: 4px; border: none;
  background: rgba(140,20,20,0.10); color: var(--text-primary); font-size: 10px;
  font-weight: 600; text-align: center; font-family: var(--font); outline: none;
}
.widget-input:focus { background: rgba(140,20,20,0.15); }
.widget-select {
  padding: 2px 4px; border-radius: 4px; border: none;
  background: rgba(140,20,20,0.10); color: var(--text-secondary); font-size: 10px;
  font-family: var(--font); outline: none; cursor: pointer;
}
.widget-select option { background: #0d0305; color: #e8d8d8; }
.widget-btn {
  display: flex; align-items: center; justify-content: center; width: 20px; height: 20px;
  border-radius: 4px; border: none; cursor: pointer; font-size: 10px;
  color: var(--text-muted); background: transparent; font-family: var(--font); transition: all 0.1s;
}
.widget-btn:hover { background: rgba(140,20,20,0.15); color: var(--text-secondary); }
.widget-btn.close:hover { background: rgba(204,17,17,0.25); color: var(--red); }
.widget-btn.locked { color: var(--accent); opacity: 0.8; }
.widget-btn.fullscreen-btn:hover { color: var(--accent); }
.widget.fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 9999 !important; border-radius: 0; }
.widget.fullscreen .resize-handle, .widget.locked-widget .resize-handle { display: none; }
.widget.locked-widget .widget-header { cursor: default; }
.widget-body {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 12px; min-height: 0;
}
.widget-body .placeholder { text-align: center; }
.widget-body .placeholder .name { font-size: 14px; font-weight: 500; color: rgba(140,40,40,0.25); }
.widget-body .placeholder .question { margin-top: 4px; font-size: 11px; color: var(--text-ghost); max-width: 200px; line-height: 1.4; }
/* Resize targets cover every edge, with larger corners for diagonal resizing. */
.widget { overflow: visible; }
.widget-body { border-radius: 0 0 8px 8px; }
.resize-handle {
  position: absolute; z-index: 5; touch-action: none; user-select: none;
  -webkit-user-select: none;
}
.resize-handle.n, .resize-handle.s { left: 10px; right: 10px; height: 12px; cursor: ns-resize; }
.resize-handle.n { top: -6px; }
.resize-handle.s { bottom: -6px; }
.resize-handle.e, .resize-handle.w { top: 10px; bottom: 10px; width: 12px; cursor: ew-resize; }
.resize-handle.e { right: -6px; }
.resize-handle.w { left: -6px; }
.resize-handle.ne, .resize-handle.nw, .resize-handle.se, .resize-handle.sw { width: 22px; height: 22px; z-index: 6; }
.resize-handle.ne, .resize-handle.se { right: -10px; }
.resize-handle.nw, .resize-handle.sw { left: -10px; }
.resize-handle.ne, .resize-handle.nw { top: -10px; }
.resize-handle.se, .resize-handle.sw { bottom: -10px; }
.resize-handle.ne, .resize-handle.sw { cursor: nesw-resize; }
.resize-handle.nw, .resize-handle.se { cursor: nwse-resize; }
.resize-handle:hover { background: rgba(0,229,204,0.10); border-radius: 6px; }
.widget-header { touch-action: none; -webkit-user-select: none; }
.widget.locked-widget .widget-header, .widget.fullscreen .widget-header { touch-action: auto; }
.widget-interacting .widget-body { pointer-events: none; }
@media (any-pointer: coarse) {
  .resize-handle.n, .resize-handle.s { height: 20px; left: 14px; right: 14px; }
  .resize-handle.n { top: -10px; }
  .resize-handle.s { bottom: -10px; }
  .resize-handle.e, .resize-handle.w { width: 20px; top: 14px; bottom: 14px; }
  .resize-handle.e { right: -10px; }
  .resize-handle.w { left: -10px; }
  .resize-handle.ne, .resize-handle.nw, .resize-handle.se, .resize-handle.sw { width: 28px; height: 28px; }
  .resize-handle.ne, .resize-handle.se { right: -14px; }
  .resize-handle.nw, .resize-handle.sw { left: -14px; }
  .resize-handle.ne, .resize-handle.nw { top: -14px; }
  .resize-handle.se, .resize-handle.sw { bottom: -14px; }
}

/* ── Add Widget Panel ── */
.panel-backdrop { position: fixed; inset: 0; z-index: 100; }
.add-panel {
  position: fixed; right: 0; top: 40px; bottom: 0; z-index: 110; width: 280px;
  display: flex; flex-direction: column; border-left: 1px solid var(--border);
  background: var(--bg-panel); box-shadow: -4px 0 30px rgba(0,0,0,0.4);
}
.add-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border-light);
}
.add-panel-header h2 { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.add-panel-close { background: none; border: none; font-size: 12px; color: var(--text-muted); cursor: pointer; font-family: var(--font); }
.add-panel-close:hover { color: var(--text-secondary); }
.search-box {
  margin: 8px 12px; padding: 6px 12px; border-radius: 6px; border: none;
  background: rgba(140,20,20,0.10); color: var(--text-primary); font-size: 12px;
  font-family: var(--font); outline: none;
}
.search-box::placeholder { color: rgba(160,80,80,0.35); }
.search-box:focus { background: rgba(140,20,20,0.15); }
.cat-list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
.cat-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px;
  border-radius: 6px; border: none; cursor: pointer; text-align: left;
  background: transparent; font-family: var(--font); transition: background 0.1s;
}
.cat-btn:hover { background: rgba(140,20,20,0.10); }
.cat-arrow { font-size: 10px; color: var(--text-muted); width: 12px; flex-shrink: 0; }
.cat-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.cat-question { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-count { font-size: 10px; color: rgba(140,40,40,0.25); margin-left: auto; }
.cat-group { margin-bottom: 2px; }
.cat-group > summary { list-style: none; }
.cat-group > summary::-webkit-details-marker { display: none; }
.cat-header {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px;
  border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-secondary); transition: background 0.1s;
}
.cat-header:hover { background: rgba(140,20,20,0.10); }
.cat-header::before { content: '▸'; font-size: 10px; color: var(--text-muted); width: 12px; flex-shrink: 0; }
.cat-group[open] > .cat-header::before { content: '▾'; }
.cat-header .cat-count { font-size: 10px; color: rgba(140,40,40,0.25); margin-left: auto; }
.cat-widgets { margin-left: 20px; margin-top: 2px; }
.widget-option {
  display: block; width: 100%; padding: 6px 10px; border-radius: 6px; border: none;
  cursor: pointer; text-align: left; background: transparent; font-family: var(--font);
  transition: background 0.1s;
}
.widget-option:hover { background: rgba(0,229,204,0.10); }
.widget-option .wo-name { font-size: 12px; color: var(--text-secondary); }
.widget-option:hover .wo-name { color: #00e5cc; }
.widget-option .wo-q { font-size: 10px; color: rgba(160,80,80,0.35); line-height: 1.3; }
.widget-option:hover .wo-q { color: rgba(0,229,204,0.5); }
.no-results { text-align: center; padding-top: 32px; font-size: 12px; color: rgba(140,40,40,0.25); }

/* ── Layout Manager ── */
.lm-overlay {
  position: fixed; inset: 0; z-index: 300; background: var(--bg-deepest);
  display: flex; flex-direction: column; overflow: hidden;
}
.lm-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--border);
}
.lm-header h2 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.lm-close {
  display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
  border-radius: 6px; border: none; cursor: pointer; font-size: 14px;
  color: var(--text-muted); background: transparent; font-family: var(--font); transition: all 0.15s;
}
.lm-close:hover { background: var(--hover); color: var(--text-secondary); }
.lm-grid {
  flex: 1; overflow-y: auto; padding: 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px; align-content: start;
}
.lm-card {
  border-radius: 10px; border: 1px solid var(--border); background: var(--bg-panel);
  overflow: hidden; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
}
.lm-card:hover { border-color: rgba(140,20,20,0.35); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.lm-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lm-preview {
  width: 100%; height: 140px; display: block; background: var(--bg-dark);
  border-bottom: 1px solid var(--border-light);
}
.lm-card-info {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
}
.lm-card-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.lm-card-count { font-size: 11px; color: var(--text-muted); }
.lm-card-actions { display: flex; gap: 2px; }
.lm-card-btn {
  display: flex; align-items: center; justify-content: center; width: 26px; height: 26px;
  border-radius: 5px; border: none; cursor: pointer; font-size: 11px;
  color: var(--text-muted); background: transparent; font-family: var(--font); transition: all 0.1s;
}
.lm-card-btn:hover { background: var(--hover); color: var(--text-secondary); }
.lm-card-btn.danger:hover { background: rgba(204,17,17,0.20); color: var(--red); }
.lm-new-card {
  border-radius: 10px; border: 2px dashed rgba(140,20,20,0.20); background: transparent;
  display: flex; align-items: center; justify-content: center; min-height: 196px;
  cursor: pointer; transition: border-color 0.15s;
}
.lm-new-card:hover { border-color: rgba(140,20,20,0.35); }
.lm-new-label { font-size: 13px; color: var(--text-muted); }
.lm-toolbar { display: flex; gap: 8px; }
.lm-tool-btn {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer;
  font-size: 11px; font-weight: 500; color: var(--text-secondary); background: var(--bg-panel);
  font-family: var(--font); transition: all 0.15s; letter-spacing: 0.5px;
}
.lm-tool-btn:hover { background: rgba(0,229,204,0.10); color: var(--accent); border-color: var(--accent); }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10000;
  padding: 8px 20px; border-radius: 8px; font-size: 12px; font-weight: 500;
  background: var(--accent); color: #020000; font-family: var(--font);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
}
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(12px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; } }

/* ── Main layout ── */
.app { display: flex; flex-direction: column; height: 100vh; }


/* Dashboard content variables (scoped to widget bodies) — Yama palette */
.widget-body {
  --bg:#050000; --panel:#0d0305; --line:#2a0a0f;
  --txt:#e8d8d8; --dim:#8b3a3a; --faint:#4a1a1f;
  --up:#00e5cc; --down:#cc1111; --flat:#8b3a3a;
  --accent:#00e5cc; --warn:#cc1111;
  --purple:#8b3a3a; --magenta:#cc1111; --orange:#cc1111; --teal:#00e5cc;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--txt);
  align-items: stretch;
  justify-content: flex-start;
  overflow-y: auto;
  overflow-x: hidden;
  flex-direction: column;
}


/* Dashboard content styles */
.widget-body .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; font-size:13px; }
.widget-body .row .k { color:var(--dim); }
.widget-body .row .v { text-align:right; }
.widget-body .na { color:var(--faint); font-style:italic; }
.widget-body .up { color:var(--up); }
.widget-body .down { color:var(--down); }
.widget-body .flat { color:var(--flat); }
.widget-body .read { margin-top:auto; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--txt); width:100%; flex-shrink:0; }
.widget-body .read b { color:var(--dim); font-weight:400; letter-spacing:1px; font-size:10.5px; text-transform:uppercase; }
.widget-body details > summary { cursor:pointer; list-style:none; user-select:none; display:flex; align-items:center; gap:7px; }
.widget-body details > summary::-webkit-details-marker { display:none; }
.widget-body details > summary::before { content:"\25BE"; color:var(--faint); font-size:10px; transition:transform .12s; flex:none; }
.widget-body details:not([open]) > summary::before { transform:rotate(-90deg); }
.widget-body table { width:100%; border-collapse:collapse; font-size:12px; }
.widget-body th { text-align:left; color:var(--dim); font-weight:400; font-size:10px; text-transform:uppercase; letter-spacing:1px; padding-bottom:6px; }
.widget-body td { padding:3px 0; }
.widget-body td.num { text-align:right; }
.widget-body .cat { padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
.widget-body .cat:last-child { border-bottom:0; }
.widget-body .cat .when { color:var(--dim); font-size:11px; }
.widget-body .cat .fc { color:var(--dim); font-size:11px; }
.widget-body .hi { border-left:2px solid var(--warn); padding-left:8px; }
.widget-body .err { color:var(--down); font-size:12px; padding:8px 0; }
.widget-body table.wl tr:not(:first-child):hover { background:rgba(0,229,204,.05); }
.widget-body .smhide { }
.widget-body h2 { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); margin:0 0 12px; font-weight:600; }
.widget-body .regime { background:rgba(140,20,20,0.06); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
.widget-body .regime .label { color:var(--dim); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; }
.widget-body .regime .call { font-size:19px; margin-top:6px; letter-spacing:1px; text-shadow:0 0 14px currentColor; }
.widget-body .regime .why { color:var(--dim); font-size:12px; margin-top:8px; }
.widget-body svg { max-width:100%; height:auto; }
.widget-body .slice:hover { opacity:0.85; filter:brightness(1.2); }
/* Live badge */
#livebadge { position:fixed; right:12px; bottom:12px; z-index:9999;
  font:11px ui-monospace,Menlo,monospace; padding:5px 9px; border-radius:14px;
  background:rgba(0,0,0,.72); border:1px solid var(--border); color:rgba(200,160,160,0.6);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); pointer-events:none; }
/* Data loading state */
.widget-body .loading { text-align:center; padding:20px; color:rgba(140,40,40,0.3); font-size:12px; }

/* ── GEX Chart widget: TradingView chart inside widget ── */
.widget-body .gex-chart-wrap {
  display:flex; flex-direction:column; width:100%; height:100%;
}
.widget-body .qqq-leverage-meter {
  font-size:10px; line-height:1.3; padding:4px 6px; color:var(--text-secondary);
}
.widget-body .qqq-leverage-meter-head {
  display:flex; justify-content:space-between; align-items:baseline; gap:6px; flex-wrap:wrap;
}
.widget-body .qqq-leverage-meter-title { font-size:10px; }
.widget-body .qqq-leverage-meter-title small { color:var(--text-muted); }
.widget-body .qqq-leverage-meter-state { font-weight:700; color:var(--lev-color, var(--accent)); font-size:11px; }
.widget-body .qqq-leverage-meter-row {
  display:flex; align-items:center; gap:4px; margin:3px 0;
}
